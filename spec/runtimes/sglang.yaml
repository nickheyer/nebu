id: sglang
name: SGLang
description: Serves safetensors checkpoints with prefix caching on NVIDIA GPUs
formats: [safetensors]
constraints:
  - expr: any(devices, .vendor == "nvidia")
    message: an NVIDIA GPU
acquire:
  methods:
    - id: source
      description: Install from PyPI into a virtual environment
      recipe:
        recipe_id: sglang
probes:
  - key: version
    args: [-c, 'import sglang; print(sglang.__version__)']
    match: '(?P<value>\d+\.\d+[\w.+-]*)'
    timeout_ms: 60000
launch:
  command: '{{.install.path}}'
  args: ['-m', 'sglang.launch_server', '--model-path', '{{index .artifacts "weights_dir"}}', '--host', '{{.host}}', '--port', '{{.port}}']
  # A slot pins the process to its devices, an empty render is dropped so no slot means every device
  env:
    CUDA_VISIBLE_DEVICES: '{{$first := true}}{{range .devices}}{{if eq .vendor "nvidia"}}{{if not $first}},{{end}}{{$first = false}}{{.id}}{{end}}{{end}}'
  health:
    path: /health
    interval_ms: 2000
    timeout_ms: 1800000
  api: API_FLAVOR_OPENAI
  stop_grace_ms: 30000
params:
  - name: n_ctx
    label: Context length
    type: PARAM_TYPE_INT
    default: '8192'
    unit: tokens
    min: 256
    step: 256
    group: Context
    flag: --context-length
    description: Tokens the model can hold in one conversation.
  - name: chunked_prefill_size
    label: Chunked prefill
    type: PARAM_TYPE_INT
    default: '8192'
    unit: tokens
    min: -1
    step: 512
    group: Context
    advanced: true
    flag: --chunked-prefill-size
    description: Prompt tokens prefilled per step. Smaller values need less memory. -1 turns chunking off.
  - name: mem_fraction_static
    label: Static memory fraction
    type: PARAM_TYPE_FLOAT
    default: '0.88'
    min: 0.05
    max: 1
    step: 0.01
    group: Memory
    flag: --mem-fraction-static
    description: Share of each device reserved for weights and the cache pool.
  - name: kv_cache_dtype
    label: KV cache type
    type: PARAM_TYPE_STRING
    default: auto
    choices: [auto, fp8_e5m2, fp8_e4m3]
    group: Memory
    flag: --kv-cache-dtype
    description: Element type of the cache. FP8 halves cache memory.
  - name: tp_size
    label: Tensor parallel
    type: PARAM_TYPE_INT
    default: '1'
    unit: devices
    min: 1
    step: 1
    group: Parallelism
    flag: --tp-size
    description: Devices each layer is sharded across.
  - name: served_model_name
    label: Served name
    type: PARAM_TYPE_STRING
    default: '{{.name}}'
    group: Identity
    flag: --served-model-name
    description: Model name the runtime reports. Defaults to the instance name.
  - name: speculative_algorithm
    label: Draft method
    type: PARAM_TYPE_STRING
    default: ''
    choices: ['', NEXTN, EAGLE, EAGLE3]
    group: Speculative decoding
    advanced: true
    flag: --speculative-algorithm
    description: NEXTN uses the prediction heads shipped with the checkpoint. EAGLE methods need a draft model.
  - name: speculative_draft_model_path
    label: Draft model
    type: PARAM_TYPE_STRING
    default: ''
    group: Speculative decoding
    advanced: true
    flag: --speculative-draft-model-path
    description: Path of the draft model for EAGLE methods.
  - name: speculative_num_steps
    label: Draft steps
    type: PARAM_TYPE_STRING
    default: ''
    group: Speculative decoding
    advanced: true
    flag: --speculative-num-steps
    description: Draft steps per verify. Empty uses the runtime default.
  - name: speculative_eagle_topk
    label: Draft branches
    type: PARAM_TYPE_STRING
    default: ''
    group: Speculative decoding
    advanced: true
    flag: --speculative-eagle-topk
    description: Branches kept per draft step. Empty uses the runtime default.
  - name: speculative_num_draft_tokens
    label: Draft tokens
    type: PARAM_TYPE_STRING
    default: ''
    group: Speculative decoding
    advanced: true
    flag: --speculative-num-draft-tokens
    description: Draft tokens verified per step. Empty uses the runtime default.

estimate:
  groups:
    - kind: TENSOR_GROUP_KIND_EMBEDDING
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_LAYER
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_EXPERTS
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_OUTPUT
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_VISION
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_AUDIO
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_DRAFT
      pool: POOL_KIND_DEVICE
      when: (speculative_algorithm ?? "") != ""
    - kind: TENSOR_GROUP_KIND_OTHER
      pool: POOL_KIND_DEVICE
  cache_bytes: n_ctx * cache_per_token * cache_bytes[kv_cache_dtype]
  overhead_bytes: 2 * GiB
  cache_element_bytes:
    auto: 2
    fp8_e5m2: 1
    fp8_e4m3: 1
  margin: 0.1
  context_param: n_ctx
  devices_param: tp_size
triage: [sglang]
report:
  - key: device.weights
    match: 'Load weight end\..*mem usage=(?P<value>[\d.]+) (?P<unit>GiB|GB)'

id: llamacpp
name: llama.cpp
description: llama-server from ggml-org llama.cpp
formats: [gguf]
constraints:
  - expr: len(devices) > 0
    message: at least one probed device
acquire:
  adopt: [llama-server]
  prebuilt:
    # llama.cpp publishes no CUDA build for Linux, so an NVIDIA host takes Vulkan here and CUDA from the recipe
    - when: os == "linux" && arch == "amd64" && any(devices, .vendor == "amd")
      releases: ggml-org/llama.cpp
      assets: ['^llama-b\d+-bin-ubuntu-rocm-[\d.]+-x64\.tar\.gz$']
      binary: llama-server
    - when: os == "linux" && arch == "amd64" && any(devices, .kind == "gpu")
      releases: ggml-org/llama.cpp
      assets: ['^llama-b\d+-bin-ubuntu-vulkan-x64\.tar\.gz$']
      binary: llama-server
    - when: os == "linux" && arch == "amd64"
      releases: ggml-org/llama.cpp
      assets: ['^llama-b\d+-bin-ubuntu-x64\.tar\.gz$']
      binary: llama-server
    - when: os == "linux" && arch == "arm64" && any(devices, .kind == "gpu")
      releases: ggml-org/llama.cpp
      assets: ['^llama-b\d+-bin-ubuntu-vulkan-arm64\.tar\.gz$']
      binary: llama-server
    - when: os == "linux" && arch == "arm64"
      releases: ggml-org/llama.cpp
      assets: ['^llama-b\d+-bin-ubuntu-arm64\.tar\.gz$']
      binary: llama-server
    - when: os == "darwin" && arch == "arm64"
      releases: ggml-org/llama.cpp
      assets: ['^llama-b\d+-bin-macos-arm64\.tar\.gz$']
      binary: llama-server
    - when: os == "darwin" && arch == "amd64"
      releases: ggml-org/llama.cpp
      assets: ['^llama-b\d+-bin-macos-x64\.tar\.gz$']
      binary: llama-server
    # The CUDA build is the binary plus the cudart companion, CUDA 13 needs a 580 driver
    - when: os == "windows" && arch == "amd64" && any(devices, .vendor == "nvidia") && vercmp(facts["nvidia.driver_version"] ?? "0", "580") >= 0
      releases: ggml-org/llama.cpp
      assets: ['^llama-b\d+-bin-win-cuda-13\.[\d.]+-x64\.zip$', '^cudart-llama-bin-win-cuda-13\.[\d.]+-x64\.zip$']
      binary: llama-server.exe
    - when: os == "windows" && arch == "amd64" && any(devices, .vendor == "nvidia")
      releases: ggml-org/llama.cpp
      assets: ['^llama-b\d+-bin-win-cuda-12\.[\d.]+-x64\.zip$', '^cudart-llama-bin-win-cuda-12\.[\d.]+-x64\.zip$']
      binary: llama-server.exe
    - when: os == "windows" && arch == "arm64" && any(devices, .vendor == "nvidia")
      releases: ggml-org/llama.cpp
      assets: ['^llama-b\d+-bin-win-cuda-[\d.]+-arm64\.zip$', '^cudart-llama-bin-win-cuda-[\d.]+-arm64\.zip$']
      binary: llama-server.exe
    - when: os == "windows" && arch == "amd64" && any(devices, .vendor == "amd")
      releases: ggml-org/llama.cpp
      assets: ['^llama-b\d+-bin-win-rocm-[\d.]+-x64\.zip$']
      binary: llama-server.exe
    - when: os == "windows" && arch == "amd64" && any(devices, .kind == "gpu")
      releases: ggml-org/llama.cpp
      assets: ['^llama-b\d+-bin-win-vulkan-x64\.zip$']
      binary: llama-server.exe
    - when: os == "windows" && arch == "amd64"
      releases: ggml-org/llama.cpp
      assets: ['^llama-b\d+-bin-win-cpu-x64\.zip$']
      binary: llama-server.exe
    - when: os == "windows" && arch == "arm64"
      releases: ggml-org/llama.cpp
      assets: ['^llama-b\d+-bin-win-cpu-arm64\.zip$']
      binary: llama-server.exe
  recipe_id: llamacpp
probes:
  - key: version
    args: [--version]
    match: 'version: (?P<value>\S+)'
  - key: devices
    args: [--list-devices]
    match: '(?m)^\s+(?P<value>[A-Za-z_]+\d*): '
launch:
  command: '{{.install.path}}'
  args: ['--model', '{{index .artifacts "weights"}}', '--host', '{{.host}}', '--port', '{{.port}}']
  # A slot pins the process to its devices, an empty render is dropped so no slot means every device
  env:
    CUDA_VISIBLE_DEVICES: '{{$first := true}}{{range .devices}}{{if eq .vendor "nvidia"}}{{if not $first}},{{end}}{{$first = false}}{{.id}}{{end}}{{end}}'
    ROCR_VISIBLE_DEVICES: '{{$first := true}}{{range .devices}}{{if eq .vendor "amd"}}{{if not $first}},{{end}}{{$first = false}}{{index .facts "index"}}{{end}}{{end}}'
    GGML_VK_VISIBLE_DEVICES: '{{$first := true}}{{range .devices}}{{if eq .kind "gpu"}}{{$i := index .facts "index"}}{{if $i}}{{if not $first}},{{end}}{{$first = false}}{{$i}}{{end}}{{end}}{{end}}'
  health:
    path: /health
    interval_ms: 1000
    timeout_ms: 600000
  api: API_FLAVOR_OPENAI
  stop_grace_ms: 15000
params:
  - name: n_ctx
    type: PARAM_TYPE_INT
    default: '8192'
    flag: --ctx-size
    description: Context length in tokens
  - name: n_batch
    type: PARAM_TYPE_INT
    default: '2048'
    flag: --batch-size
    description: Logical batch size
  - name: n_ubatch
    type: PARAM_TYPE_INT
    default: '512'
    flag: --ubatch-size
    description: Physical batch size
  - name: n_gpu_layers
    type: PARAM_TYPE_INT
    default: auto
    solved: true
    flag: --n-gpu-layers
    description: Layers placed on device, solved when auto
  - name: n_cpu_moe
    type: PARAM_TYPE_INT
    default: auto
    solved: true
    flag: --n-cpu-moe
    description: Layers whose experts stay in host memory, solved when auto
  - name: cache_type_k
    type: PARAM_TYPE_STRING
    default: f16
    choices: [f32, f16, bf16, q8_0, q5_1, q5_0, q4_1, q4_0]
    flag: --cache-type-k
    description: Key cache element type
  - name: cache_type_v
    type: PARAM_TYPE_STRING
    default: f16
    choices: [f32, f16, bf16, q8_0, q5_1, q5_0, q4_1, q4_0]
    flag: --cache-type-v
    description: Value cache element type
  - name: flash_attn
    type: PARAM_TYPE_STRING
    default: auto
    choices: [auto, 'on', 'off']
    flag: --flash-attn
    description: Flash attention mode
  - name: n_parallel
    type: PARAM_TYPE_INT
    default: '1'
    flag: --parallel
    description: Concurrent sequences sharing the context
  - name: threads
    type: PARAM_TYPE_INT
    default: '-1'
    flag: --threads
    description: CPU threads, negative for automatic
  - name: mmproj
    type: PARAM_TYPE_STRING
    default: '{{index .artifacts "projector"}}'
    flag: --mmproj
    description: Multimodal projector, taken from the stored model when present
  - name: alias
    type: PARAM_TYPE_STRING
    default: '{{.name}}'
    flag: --alias
    description: Model name reported in responses, the instance name by default
  - name: log_verbosity
    type: PARAM_TYPE_INT
    default: '4'
    flag: --log-verbosity
    description: Log threshold, 4 prints the allocation lines the report rules read, 3 is the runtime default
estimate:
  groups:
    - kind: TENSOR_GROUP_KIND_EMBEDDING
      pool: POOL_KIND_HOST
    - kind: TENSOR_GROUP_KIND_LAYER
      pool: POOL_KIND_DEVICE
      param: n_gpu_layers
      spill_priority: 10
    - kind: TENSOR_GROUP_KIND_OUTPUT
      pool: POOL_KIND_DEVICE
      param: n_gpu_layers
      spill_priority: 10
    - kind: TENSOR_GROUP_KIND_EXPERTS
      pool: POOL_KIND_DEVICE
      param: n_cpu_moe
      param_counts_host: true
      spill_priority: 1
      requires: TENSOR_GROUP_KIND_LAYER
    - kind: TENSOR_GROUP_KIND_OTHER
      pool: POOL_KIND_DEVICE
  cache_bytes: n_ctx * cache_per_token * (cache_bytes[cache_type_k] + cache_bytes[cache_type_v]) / 2
  # The device context plus the compute buffer, fitted to measured CUDA runs with flash attention on
  overhead_bytes: 384 * MiB + n_ctx * n_ubatch * 10 + n_ubatch * n_embd * 16
  cache_element_bytes:
    f32: 4
    f16: 2
    bf16: 2
    q8_0: 1.0625
    q5_1: 0.75
    q5_0: 0.6875
    q4_1: 0.625
    q4_0: 0.5625
  margin: 0.05
  context_param: n_ctx
triage: [llamacpp]
report:
  - key: device.weights
    match: '(?:CUDA|ROCm|HIP|Vulkan|Metal|SYCL|OpenCL)\d* model buffer size\s*=\s*(?P<value>[\d.]+) (?P<unit>\w+)'
  - key: host.weights
    match: '(?:CPU\w*|\w+_Host) model buffer size\s*=\s*(?P<value>[\d.]+) (?P<unit>\w+)'
  - key: device.cache
    match: '(?:CUDA|ROCm|HIP|Vulkan|Metal|SYCL|OpenCL)\d* KV buffer size\s*=\s*(?P<value>[\d.]+) (?P<unit>\w+)'
  - key: host.cache
    match: '(?:CPU\w*|\w+_Host) KV buffer size\s*=\s*(?P<value>[\d.]+) (?P<unit>\w+)'
  - key: device.compute
    match: '(?:CUDA|ROCm|HIP|Vulkan|Metal|SYCL|OpenCL)\d* compute buffer size\s*=\s*(?P<value>[\d.]+) (?P<unit>\w+)'
  - key: host.compute
    match: '(?:CPU\w*|\w+_Host) compute buffer size\s*=\s*(?P<value>[\d.]+) (?P<unit>\w+)'

id: llamacpp
name: llama.cpp
description: llama-server from ggml-org llama.cpp
formats: [gguf]
constraints:
  - expr: len(devices) > 0
    message: at least one probed device
acquire:
  methods:
    - id: adopt
      description: Use a llama-server binary already on this host
      adopt:
        names: [llama-server]
    - id: release
      description: Download a release from ggml-org/llama.cpp
      prebuilt:
        releases: ggml-org/llama.cpp
        rules:
          # llama.cpp publishes no CUDA build for Linux, so an NVIDIA host takes Vulkan here or builds from source
          - id: linux-rocm
            when: os == "linux" && arch == "amd64" && any(devices, .vendor == "amd")
            assets: ['^llama-b\d+-bin-ubuntu-rocm-[\d.]+-x64\.tar\.gz$']
            binary: llama-server
          - id: linux-vulkan
            when: os == "linux" && arch == "amd64" && any(devices, .kind == "gpu")
            assets: ['^llama-b\d+-bin-ubuntu-vulkan-x64\.tar\.gz$']
            binary: llama-server
          - id: linux-cpu
            when: os == "linux" && arch == "amd64"
            assets: ['^llama-b\d+-bin-ubuntu-x64\.tar\.gz$']
            binary: llama-server
          - id: linux-arm64-vulkan
            when: os == "linux" && arch == "arm64" && any(devices, .kind == "gpu")
            assets: ['^llama-b\d+-bin-ubuntu-vulkan-arm64\.tar\.gz$']
            binary: llama-server
          - id: linux-arm64-cpu
            when: os == "linux" && arch == "arm64"
            assets: ['^llama-b\d+-bin-ubuntu-arm64\.tar\.gz$']
            binary: llama-server
          - id: macos-arm64
            when: os == "darwin" && arch == "arm64"
            assets: ['^llama-b\d+-bin-macos-arm64\.tar\.gz$']
            binary: llama-server
          - id: macos-x64
            when: os == "darwin" && arch == "amd64"
            assets: ['^llama-b\d+-bin-macos-x64\.tar\.gz$']
            binary: llama-server
          # The CUDA build is the binary plus the cudart companion, CUDA 13 needs a 580 driver
          - id: windows-cuda13
            when: os == "windows" && arch == "amd64" && any(devices, .vendor == "nvidia") && vercmp(facts["nvidia.driver_version"] ?? "0", "580") >= 0
            assets: ['^llama-b\d+-bin-win-cuda-13\.[\d.]+-x64\.zip$', '^cudart-llama-bin-win-cuda-13\.[\d.]+-x64\.zip$']
            binary: llama-server.exe
          - id: windows-cuda12
            when: os == "windows" && arch == "amd64" && any(devices, .vendor == "nvidia")
            assets: ['^llama-b\d+-bin-win-cuda-12\.[\d.]+-x64\.zip$', '^cudart-llama-bin-win-cuda-12\.[\d.]+-x64\.zip$']
            binary: llama-server.exe
          - id: windows-arm64-cuda
            when: os == "windows" && arch == "arm64" && any(devices, .vendor == "nvidia")
            assets: ['^llama-b\d+-bin-win-cuda-[\d.]+-arm64\.zip$', '^cudart-llama-bin-win-cuda-[\d.]+-arm64\.zip$']
            binary: llama-server.exe
          - id: windows-rocm
            when: os == "windows" && arch == "amd64" && any(devices, .vendor == "amd")
            assets: ['^llama-b\d+-bin-win-rocm-[\d.]+-x64\.zip$']
            binary: llama-server.exe
          - id: windows-vulkan
            when: os == "windows" && arch == "amd64" && any(devices, .kind == "gpu")
            assets: ['^llama-b\d+-bin-win-vulkan-x64\.zip$']
            binary: llama-server.exe
          - id: windows-cpu
            when: os == "windows" && arch == "amd64"
            assets: ['^llama-b\d+-bin-win-cpu-x64\.zip$']
            binary: llama-server.exe
          - id: windows-arm64-cpu
            when: os == "windows" && arch == "arm64"
            assets: ['^llama-b\d+-bin-win-cpu-arm64\.zip$']
            binary: llama-server.exe
    - id: source
      description: Build from source for the devices on this host
      recipe:
        recipe_id: llamacpp
probes:
  - key: version
    args: [--version]
    match: 'version: (?P<value>\S+)'
  - key: devices
    args: [--list-devices]
    match: '(?m)^\s+(?P<value>[A-Za-z_]+\d*): '
launch:
  command: '{{.install.path}}'
  args: ['--model', '{{index .artifacts "weights"}}', '--host', '{{.host}}', '--port', '{{.port}}']
  # A slot pins the process to its devices, an empty render is dropped so no slot means every device
  env:
    CUDA_VISIBLE_DEVICES: '{{$first := true}}{{range .devices}}{{if eq .vendor "nvidia"}}{{if not $first}},{{end}}{{$first = false}}{{.id}}{{end}}{{end}}'
    ROCR_VISIBLE_DEVICES: '{{$first := true}}{{range .devices}}{{if eq .vendor "amd"}}{{if not $first}},{{end}}{{$first = false}}{{index .facts "index"}}{{end}}{{end}}'
    GGML_VK_VISIBLE_DEVICES: '{{$first := true}}{{range .devices}}{{if eq .kind "gpu"}}{{$i := index .facts "index"}}{{if $i}}{{if not $first}},{{end}}{{$first = false}}{{$i}}{{end}}{{end}}{{end}}'
  health:
    path: /health
    interval_ms: 1000
    timeout_ms: 600000
  api: API_FLAVOR_OPENAI
  stop_grace_ms: 15000
params:
  - name: n_ctx
    label: Context length
    type: PARAM_TYPE_INT
    default: '8192'
    unit: tokens
    min: 256
    step: 256
    group: Context
    flag: --ctx-size
    description: Tokens the model can hold in one conversation. Larger contexts need more cache memory.
  - name: n_parallel
    label: Parallel sequences
    type: PARAM_TYPE_INT
    default: '1'
    unit: sequences
    min: 1
    max: 256
    step: 1
    group: Context
    flag: --parallel
    description: Requests served at once. The context is split between them.
  - name: n_gpu_layers
    label: GPU layers
    type: PARAM_TYPE_INT
    default: auto
    solved: true
    unit: layers
    min: 0
    step: 1
    group: Placement
    flag: --n-gpu-layers
    description: Layers loaded onto the device. Auto takes the number from the memory plan.
  - name: n_cpu_moe
    label: Expert layers on CPU
    type: PARAM_TYPE_INT
    default: auto
    solved: true
    unit: layers
    min: 0
    step: 1
    group: Placement
    flag: --n-cpu-moe
    description: Layers whose expert weights stay in system memory. Auto takes the number from the memory plan.
  - name: threads
    label: CPU threads
    type: PARAM_TYPE_INT
    default: '-1'
    unit: threads
    min: -1
    step: 1
    group: Placement
    advanced: true
    flag: --threads
    description: Threads for layers on the CPU. -1 picks a number from the core count.
  - name: cache_type_k
    label: Key cache type
    type: PARAM_TYPE_STRING
    default: f16
    choices: [f32, f16, bf16, q8_0, q5_1, q5_0, q4_1, q4_0]
    group: Cache
    flag: --cache-type-k
    description: Element type of the key cache. Quantized types use less memory.
  - name: cache_type_v
    label: Value cache type
    type: PARAM_TYPE_STRING
    default: f16
    choices: [f32, f16, bf16, q8_0, q5_1, q5_0, q4_1, q4_0]
    group: Cache
    flag: --cache-type-v
    description: Element type of the value cache. Quantized types need flash attention on.
  - name: flash_attn
    label: Flash attention
    type: PARAM_TYPE_STRING
    default: auto
    choices: [auto, 'on', 'off']
    group: Cache
    flag: --flash-attn
    description: Fused attention kernels. Auto turns it on where the device supports it.
  - name: n_batch
    label: Batch size
    type: PARAM_TYPE_INT
    default: '2048'
    unit: tokens
    min: 32
    step: 32
    group: Batching
    advanced: true
    flag: --batch-size
    description: Prompt tokens processed per step.
  - name: n_ubatch
    label: Micro-batch size
    type: PARAM_TYPE_INT
    default: '512'
    unit: tokens
    min: 32
    step: 32
    group: Batching
    advanced: true
    flag: --ubatch-size
    description: Tokens per compute pass. Smaller values need less compute memory.
  - name: alias
    label: Served name
    type: PARAM_TYPE_STRING
    default: '{{.name}}'
    group: Identity
    flag: --alias
    description: Model name the runtime reports. Defaults to the instance name.
  - name: mmproj
    label: Projector file
    type: PARAM_TYPE_STRING
    default: '{{index .artifacts "projector"}}'
    group: Identity
    advanced: true
    flag: --mmproj
    description: Multimodal projector to load. Defaults to the one stored with the model.
  - name: log_verbosity
    label: Log level
    type: PARAM_TYPE_INT
    default: '4'
    min: 0
    max: 5
    step: 1
    group: Diagnostics
    advanced: true
    flag: --log-verbosity
    description: 4 logs the memory allocation lines calibration reads. 3 is the runtime default.

estimate:
  groups:
    - kind: TENSOR_GROUP_KIND_EMBEDDING
      pool: POOL_KIND_HOST
    - kind: TENSOR_GROUP_KIND_LAYER
      pool: POOL_KIND_DEVICE
      param: n_gpu_layers
      spill_priority: 10
    - kind: TENSOR_GROUP_KIND_OUTPUT
      pool: POOL_KIND_DEVICE
      param: n_gpu_layers
      spill_priority: 10
    - kind: TENSOR_GROUP_KIND_EXPERTS
      pool: POOL_KIND_DEVICE
      param: n_cpu_moe
      param_counts_host: true
      spill_priority: 1
      requires: TENSOR_GROUP_KIND_LAYER
    # The projector loads whole on device beside the layers
    - kind: TENSOR_GROUP_KIND_VISION
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_AUDIO
      pool: POOL_KIND_DEVICE
    # Prediction head tensors are skipped at load, no decoding path drafts with them
    - kind: TENSOR_GROUP_KIND_DRAFT
      pool: POOL_KIND_DEVICE
      when: 'false'
    - kind: TENSOR_GROUP_KIND_OTHER
      pool: POOL_KIND_DEVICE
  cache_bytes: n_ctx * cache_per_token * (cache_bytes[cache_type_k] + cache_bytes[cache_type_v]) / 2
  # The device context plus the compute buffer, fitted to measured CUDA runs with flash attention on
  overhead_bytes: 384 * MiB + n_ctx * n_ubatch * 10 + n_ubatch * n_embd * 16
  cache_element_bytes:
    f32: 4
    f16: 2
    bf16: 2
    q8_0: 1.0625
    q5_1: 0.75
    q5_0: 0.6875
    q4_1: 0.625
    q4_0: 0.5625
  margin: 0.05
  context_param: n_ctx
triage: [llamacpp]
report:
  - key: device.weights
    match: '(?:CUDA|ROCm|HIP|Vulkan|Metal|SYCL|OpenCL)\d* model buffer size\s*=\s*(?P<value>[\d.]+) (?P<unit>\w+)'
  - key: host.weights
    match: '(?:CPU\w*|\w+_Host) model buffer size\s*=\s*(?P<value>[\d.]+) (?P<unit>\w+)'
  - key: device.cache
    match: '(?:CUDA|ROCm|HIP|Vulkan|Metal|SYCL|OpenCL)\d* KV buffer size\s*=\s*(?P<value>[\d.]+) (?P<unit>\w+)'
  - key: host.cache
    match: '(?:CPU\w*|\w+_Host) KV buffer size\s*=\s*(?P<value>[\d.]+) (?P<unit>\w+)'
  - key: device.compute
    match: '(?:CUDA|ROCm|HIP|Vulkan|Metal|SYCL|OpenCL)\d* compute buffer size\s*=\s*(?P<value>[\d.]+) (?P<unit>\w+)'
  - key: host.compute
    match: '(?:CPU\w*|\w+_Host) compute buffer size\s*=\s*(?P<value>[\d.]+) (?P<unit>\w+)'

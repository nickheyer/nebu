id: vllm
name: vLLM
description: Serves safetensors checkpoints at high throughput on NVIDIA and AMD GPUs
formats: [safetensors]
constraints:
  - expr: any(devices, .vendor == "nvidia" || .vendor == "amd")
    message: an NVIDIA or AMD GPU
acquire:
  methods:
    - id: adopt
      description: Use a vllm binary already on this host
      adopt:
        names: [vllm]
    - id: source
      description: Install from PyPI into a virtual environment
      recipe:
        recipe_id: vllm
probes:
  - key: version
    args: [--version]
    match: '(?P<value>\d+\.\d+[\w.+-]*)'
launch:
  command: '{{.install.path}}'
  args: ['serve', '{{index .artifacts "weights_dir"}}', '--host', '{{.host}}', '--port', '{{.port}}']
  # A slot pins the process to its devices, an empty render is dropped so no slot means every device
  env:
    CUDA_VISIBLE_DEVICES: '{{$first := true}}{{range .devices}}{{if eq .vendor "nvidia"}}{{if not $first}},{{end}}{{$first = false}}{{.id}}{{end}}{{end}}'
    ROCR_VISIBLE_DEVICES: '{{$first := true}}{{range .devices}}{{if eq .vendor "amd"}}{{if not $first}},{{end}}{{$first = false}}{{index .facts "index"}}{{end}}{{end}}'
  health:
    path: /health
    interval_ms: 2000
    timeout_ms: 1800000
  api: API_FLAVOR_OPENAI
  stop_grace_ms: 30000
params:
  - name: n_ctx
    label: Context length
    type: PARAM_TYPE_INT
    default: '8192'
    unit: tokens
    min: 256
    step: 256
    group: Context
    flag: --max-model-len
    description: Tokens the model can hold in one conversation.
  - name: max_num_seqs
    label: Max sequences
    type: PARAM_TYPE_INT
    default: '256'
    unit: sequences
    min: 1
    step: 1
    group: Context
    flag: --max-num-seqs
    description: Requests scheduled at once.
  - name: gpu_memory_utilization
    label: GPU memory fraction
    type: PARAM_TYPE_FLOAT
    default: '0.9'
    min: 0.05
    max: 1
    step: 0.01
    group: Memory
    flag: --gpu-memory-utilization
    description: Share of each device the runtime claims for weights and cache.
  - name: kv_cache_dtype
    label: KV cache type
    type: PARAM_TYPE_STRING
    default: auto
    choices: [auto, fp8, fp8_e5m2, fp8_e4m3]
    group: Memory
    flag: --kv-cache-dtype
    description: Element type of the cache. FP8 halves cache memory.
  - name: tensor_parallel_size
    label: Tensor parallel
    type: PARAM_TYPE_INT
    default: '1'
    unit: devices
    min: 1
    step: 1
    group: Parallelism
    flag: --tensor-parallel-size
    description: Devices each layer is sharded across.
  - name: served_model_name
    label: Served name
    type: PARAM_TYPE_STRING
    default: '{{.name}}'
    group: Identity
    flag: --served-model-name
    description: Model name the runtime reports. Defaults to the instance name.
  - name: speculative_config
    label: Speculative config
    type: PARAM_TYPE_STRING
    default: ''
    group: Speculative decoding
    advanced: true
    flag: --speculative-config
    description: 'JSON such as {"method":"mtp","num_speculative_tokens":1}. Empty leaves draft heads unloaded.'

estimate:
  groups:
    - kind: TENSOR_GROUP_KIND_EMBEDDING
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_LAYER
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_EXPERTS
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_OUTPUT
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_VISION
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_AUDIO
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_DRAFT
      pool: POOL_KIND_DEVICE
      when: (speculative_config ?? "") != ""
    - kind: TENSOR_GROUP_KIND_OTHER
      pool: POOL_KIND_DEVICE
  cache_bytes: n_ctx * cache_per_token * cache_bytes[kv_cache_dtype]
  overhead_bytes: 2 * GiB
  cache_element_bytes:
    auto: 2
    fp8: 1
    fp8_e5m2: 1
    fp8_e4m3: 1
  margin: 0.1
  context_param: n_ctx
  devices_param: tensor_parallel_size
triage: [vllm]
report:
  - key: device.weights
    match: 'Model loading took (?P<value>[\d.]+) (?P<unit>GiB|GB|MiB|MB)'


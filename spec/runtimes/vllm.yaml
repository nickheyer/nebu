id: vllm
name: vLLM
description: vllm serve over safetensors checkpoints
formats: [safetensors]
constraints:
  - expr: any(devices, .vendor == "nvidia" || .vendor == "amd")
    message: an NVIDIA or AMD GPU
acquire:
  methods:
    - id: adopt
      description: vllm already on this host
      adopt:
        names: [vllm]
    - id: source
      description: Installed from PyPI into a virtual environment
      recipe:
        recipe_id: vllm
probes:
  - key: version
    args: [--version]
    match: '(?P<value>\d+\.\d+[\w.+-]*)'
launch:
  command: '{{.install.path}}'
  args: ['serve', '{{index .artifacts "weights_dir"}}', '--host', '{{.host}}', '--port', '{{.port}}']
  # A slot pins the process to its devices, an empty render is dropped so no slot means every device
  env:
    CUDA_VISIBLE_DEVICES: '{{$first := true}}{{range .devices}}{{if eq .vendor "nvidia"}}{{if not $first}},{{end}}{{$first = false}}{{.id}}{{end}}{{end}}'
    ROCR_VISIBLE_DEVICES: '{{$first := true}}{{range .devices}}{{if eq .vendor "amd"}}{{if not $first}},{{end}}{{$first = false}}{{index .facts "index"}}{{end}}{{end}}'
  health:
    path: /health
    interval_ms: 2000
    timeout_ms: 1800000
  api: API_FLAVOR_OPENAI
  stop_grace_ms: 30000
params:
  - name: n_ctx
    type: PARAM_TYPE_INT
    default: '8192'
    flag: --max-model-len
    description: Maximum model length in tokens
  - name: gpu_memory_utilization
    type: PARAM_TYPE_FLOAT
    default: '0.9'
    flag: --gpu-memory-utilization
    description: Fraction of device memory vLLM may claim
  - name: kv_cache_dtype
    type: PARAM_TYPE_STRING
    default: auto
    choices: [auto, fp8, fp8_e5m2, fp8_e4m3]
    flag: --kv-cache-dtype
    description: Cache element type
  - name: max_num_seqs
    type: PARAM_TYPE_INT
    default: '256'
    flag: --max-num-seqs
    description: Maximum concurrent sequences
  - name: tensor_parallel_size
    type: PARAM_TYPE_INT
    default: '1'
    flag: --tensor-parallel-size
    description: Devices to shard across
  - name: served_model_name
    type: PARAM_TYPE_STRING
    default: '{{.name}}'
    flag: --served-model-name
    description: Model name reported in responses, the instance name by default
  # Speculative decoding, the prediction heads a checkpoint ships loading only once a config names them
  - name: speculative_config
    type: PARAM_TYPE_STRING
    default: ''
    flag: --speculative-config
    description: 'Speculative decoding as JSON, {"method":"mtp","num_speculative_tokens":1} for the prediction heads a checkpoint ships; empty leaves them on disk'
estimate:
  groups:
    - kind: TENSOR_GROUP_KIND_EMBEDDING
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_LAYER
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_EXPERTS
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_OUTPUT
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_VISION
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_AUDIO
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_DRAFT
      pool: POOL_KIND_DEVICE
      when: (speculative_config ?? "") != ""
    - kind: TENSOR_GROUP_KIND_OTHER
      pool: POOL_KIND_DEVICE
  cache_bytes: n_ctx * cache_per_token * cache_bytes[kv_cache_dtype]
  overhead_bytes: 2 * GiB
  cache_element_bytes:
    auto: 2
    fp8: 1
    fp8_e5m2: 1
    fp8_e4m3: 1
  margin: 0.1
  context_param: n_ctx
  devices_param: tensor_parallel_size
triage: [vllm]
report:
  - key: device.weights
    match: 'Model loading took (?P<value>[\d.]+) (?P<unit>GiB|GB|MiB|MB)'


id: nemo
name: NeMo
description: Serves NeMo checkpoints in framework on NVIDIA GPUs
formats: [nemo2, nemo]
constraints:
  - expr: any(devices, .vendor == "nvidia")
    message: an NVIDIA GPU
acquire:
  methods:
    - id: source
      description: Install Export-Deploy and the checkpoint converter from PyPI into virtual environments
      recipe:
        recipe_id: nemo
probes:
  - key: version
    command: '{{.install.dir}}/venv/bin/python'
    args: [-c, 'from nemo_export_deploy_common.package_info import __version__; print(__version__)']
    match: '(?P<value>\d+\.\d+[\w.+-]*)'
    timeout_ms: 60000
launch:
  command: '{{.install.dir}}/venv/bin/python'
  args: ['{{.install.path}}', '--megatron_checkpoint', '{{index .artifacts "weights_dir"}}', '--host', '{{.host}}', '--port', '{{.port}}']
  prepare:
    formats: [nemo]
    command: '{{.install.dir}}/venv-convert/bin/python'
    args: ['{{.install.dir}}/convert_nemo1_to_nemo2.py', '--input_path', '{{index .artifacts "weights"}}', '--output_path', '{{index .artifacts "prepared_dir"}}', '--model_id', '{{index .params "model_id"}}']
    timeout_ms: 7200000
  health:
    path: /v1/health
    interval_ms: 5000
    timeout_ms: 3600000
  api: API_FLAVOR_OPENAI
  stop_grace_ms: 60000
params:
  - name: n_ctx
    label: Context length
    type: PARAM_TYPE_INT
    default: '4096'
    unit: tokens
    min: 256
    step: 256
    group: Context
    flag: --inference_max_seq_length
    description: Tokens the model can hold in one sequence.
  - name: max_batch_size
    label: Batch size
    type: PARAM_TYPE_INT
    default: '8'
    unit: sequences
    min: 1
    step: 1
    group: Context
    flag: --max_batch_size
    description: Sequences batched together. Each holds a full-length cache.
  - name: num_gpus
    label: Devices
    type: PARAM_TYPE_INT
    default: '1'
    unit: devices
    min: 1
    step: 1
    group: Parallelism
    flag: --num_gpus
    description: Devices the deployment claims.
  - name: tensor_model_parallel_size
    label: Tensor parallel
    type: PARAM_TYPE_INT
    default: '1'
    unit: devices
    min: 1
    step: 1
    group: Parallelism
    flag: --tensor_model_parallel_size
    description: Devices each layer is sharded across.
  - name: pipeline_model_parallel_size
    label: Pipeline parallel
    type: PARAM_TYPE_INT
    default: '1'
    unit: devices
    min: 1
    step: 1
    group: Parallelism
    flag: --pipeline_model_parallel_size
    description: Devices the layer stack is split across.
  - name: enable_cuda_graphs
    label: CUDA graphs
    type: PARAM_TYPE_BOOL
    default: 'false'
    group: Performance
    flag: --enable_cuda_graphs
    description: Capture CUDA graphs for faster decoding.
  - name: enable_flash_decode
    label: Flash decode
    type: PARAM_TYPE_BOOL
    default: 'false'
    group: Performance
    flag: --enable_flash_decode
    description: Flash attention during decoding.
  - name: served_model_name
    label: Served name
    type: PARAM_TYPE_STRING
    default: '{{.name}}'
    group: Identity
    flag: --model_id
    description: Model name the runtime reports. Defaults to the instance name.
  - name: model_id
    label: Base model id
    type: PARAM_TYPE_STRING
    default: '{{index .descriptor.metadata "tokenizer.type"}}'
    group: Conversion
    advanced: true
    description: Hugging Face id of the base model the converter builds a packed checkpoint as. Defaults to the checkpoint's tokenizer id.
  - name: legacy_ckpt
    label: Legacy checkpoint
    type: PARAM_TYPE_BOOL
    default: 'false'
    group: Conversion
    advanced: true
    flag: --legacy_ckpt
    description: Load a checkpoint written before Megatron Bridge.
  - name: cuda_visible_devices
    label: Visible devices
    type: PARAM_TYPE_STRING
    default: '{{range $i, $d := .devices}}{{if $i}},{{end}}{{index $d.facts "index"}}{{end}}'
    group: Parallelism
    advanced: true
    flag: --cuda_visible_devices
    description: Device indexes the deployment is pinned to. Set from the slot's devices.

estimate:
  groups:
    - kind: TENSOR_GROUP_KIND_EMBEDDING
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_LAYER
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_EXPERTS
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_OUTPUT
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_VISION
      pool: POOL_KIND_DEVICE
    - kind: TENSOR_GROUP_KIND_AUDIO
      pool: POOL_KIND_DEVICE
    # In framework inference drafts with nothing, prediction heads stay on disk
    - kind: TENSOR_GROUP_KIND_DRAFT
      pool: POOL_KIND_DEVICE
      when: 'false'
    - kind: TENSOR_GROUP_KIND_OTHER
      pool: POOL_KIND_DEVICE
  # In framework inference keeps a full length key and value cache per batched sequence
  cache_bytes: n_ctx * cache_per_token * 2 * max_batch_size
  overhead_bytes: 3 * GiB
  margin: 0.1
  context_param: n_ctx
  devices_param: num_gpus
triage: [nemo]

id: nemo2
description: NeMo 2 checkpoint directory, context/model.yaml beside a torch distributed checkpoint under weights/
blurb: A NeMo 2 checkpoint directory, a model config beside a distributed checkpoint, the layout NeMo serves
priority: 6
reader: nemo
root: '^(?P<root>(?:.*/)?)(?:weights|context)/'
files:
  - match: '(^|/)weights/__\d+_\d+\.distcp$'
    role: ARTIFACT_ROLE_WEIGHTS
  - match: '(^|/)weights/(\.metadata|metadata\.json|common\.pt)$'
    role: ARTIFACT_ROLE_CONFIG
  - match: '(^|/)context/(model\.yaml|io\.json)$'
    role: ARTIFACT_ROLE_CONFIG
  - match: '(^|/)context/nemo_tokenizer/'
    role: ARTIFACT_ROLE_TOKENIZER
groups:
  - match: '^(?P<root>.+)/weights/[^/]+$'
    value: '${root}'
  - match: '.*'
    value: default
tensors:
  - match: '(^|\.)(word_embeddings|position_embeddings)\.'
    kind: TENSOR_GROUP_KIND_EMBEDDING
  - match: '(^|\.)layers\.(?P<layer>\d+)\..*experts\.'
    kind: TENSOR_GROUP_KIND_EXPERTS
  - match: '(^|\.)layers\.(?P<layer>\d+)\.'
    kind: TENSOR_GROUP_KIND_LAYER
  - match: '(^|\.)(output_layer|final_layernorm|final_norm)\.'
    kind: TENSOR_GROUP_KIND_OUTPUT
  - match: '.*'
    kind: TENSOR_GROUP_KIND_OTHER
architecture: [nemo.architecture]
params:
  - name: n_layer
    keys: [config.num_layers]
    derive: layers_seen
  - name: n_embd
    keys: [config.hidden_size]
  - name: n_head
    keys: [config.num_attention_heads]
  - name: n_head_kv
    keys: [config.num_query_groups]
    derive: n_head
  - name: head_dim
    keys: [config.kv_channels]
    derive: n_embd / n_head
  - name: head_dim_v
    keys: []
    derive: head_dim
  - name: n_ctx_train
    keys: [config.seq_length]
  - name: embedding_elements
    tensor: '(^|\.)word_embeddings\.weight$'
  - name: n_vocab
    keys: [config.vocab_size]
    derive: embedding_elements / n_embd
  - name: n_expert
    keys: [config.num_moe_experts]
  - name: n_expert_used
    keys: [config.moe_router_topk]
precisions:
  - key: config.params_dtype
    match: '^(?:torch\.)?(?P<name>bfloat16)$'
    bits: 16
    note: bfloat16, the training format on modern GPUs
  - key: config.params_dtype
    match: '^(?:torch\.)?(?P<name>float16)$'
    bits: 16
    note: float16, the training format on older GPUs
  - key: config.params_dtype
    match: '^(?:torch\.)?(?P<name>float32)$'
    bits: 32
  - key: config.bf16
    match: '^(?i:true)$'
    bits: 16
    note: bfloat16, the training format on modern GPUs
  - key: config.fp16
    match: '^(?i:true)$'
    bits: 16
    note: float16, the training format on older GPUs
metadata:
  - config.params_dtype
  - config.bf16
  - config.fp16
  - _target_
  - config._target_
  - nemo.sharded_backend
  - nemo.layers
  - config.seq_length
  - config.rotary_base
requires: [ARTIFACT_ROLE_CONFIG]

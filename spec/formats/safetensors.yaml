id: safetensors
description: Safetensors shards with a transformers config
priority: 5
files:
  - match: '(?i)\.safetensors$'
    role: ARTIFACT_ROLE_WEIGHTS
  - match: '(^|/)config\.json$'
    role: ARTIFACT_ROLE_CONFIG
  - match: '(^|/)tokenizer(\.json|\.model|_config\.json)$'
    role: ARTIFACT_ROLE_TOKENIZER
  - match: '(^|/)chat_template\.(jinja|json)$'
    role: ARTIFACT_ROLE_TEMPLATE
groups:
  - match: '^(?P<dir>.+)/[^/]+$'
    value: '${dir}'
  - match: '.*'
    value: default
shards: '-(?P<index>\d{5})-of-(?P<count>\d{5})\.safetensors$'
tensors:
  - match: '(^|\.)embed_tokens\.'
    kind: TENSOR_GROUP_KIND_EMBEDDING
  - match: '(^|\.)layers\.(?P<layer>\d+)\..*experts\.'
    kind: TENSOR_GROUP_KIND_EXPERTS
  - match: '(^|\.)layers\.(?P<layer>\d+)\.'
    kind: TENSOR_GROUP_KIND_LAYER
  - match: '(^|\.)lm_head\.'
    kind: TENSOR_GROUP_KIND_OUTPUT
  - match: '(^|\.)norm\.weight$'
    kind: TENSOR_GROUP_KIND_OUTPUT
  - match: '.*'
    kind: TENSOR_GROUP_KIND_OTHER
architecture: [architectures, model_type, text_config.model_type]
params:
  - name: n_layer
    keys: [num_hidden_layers, text_config.num_hidden_layers]
    derive: layers_seen
  - name: n_embd
    keys: [hidden_size, text_config.hidden_size]
  - name: n_head
    keys: [num_attention_heads, text_config.num_attention_heads]
  - name: n_head_kv
    keys: [num_key_value_heads, text_config.num_key_value_heads]
    derive: n_head
  - name: head_dim
    keys: [head_dim, text_config.head_dim]
    derive: n_embd / n_head
  - name: head_dim_v
    keys: []
    derive: head_dim
  - name: n_ctx_train
    keys: [max_position_embeddings, text_config.max_position_embeddings]
  - name: n_vocab
    keys: [vocab_size, text_config.vocab_size]
  - name: n_expert
    keys: [num_local_experts, num_experts, n_routed_experts, text_config.num_local_experts]
  - name: n_expert_used
    keys: [num_experts_per_tok, text_config.num_experts_per_tok]
  - name: kv_lora_rank
    keys: [kv_lora_rank]
  - name: rope_dim
    keys: [qk_rope_head_dim]
  - name: n_swa
    keys: [sliding_window]
metadata:
  - torch_dtype
  - dtype
  - model_type
  - quantization_config.quant_method
  - quantization_config.bits
  - __metadata__.format
requires: [ARTIFACT_ROLE_CONFIG]

id: gguf
description: GGML universal file format
blurb: GGUF packs the whole model into one file per precision, usually quantized to fit in less memory
priority: 10
files:
  - match: '(?i)(^|/)mmproj[^/]*\.gguf$'
    role: ARTIFACT_ROLE_PROJECTOR
  - match: '(?i)\.gguf$'
    role: ARTIFACT_ROLE_WEIGHTS
groups:
  - match: '(?i)(?:^|[-_./])(?P<quant>(?:UD-)?(?:I?Q\d(?:_[0-9A-Z]+)*|BF16|F16|F32|MXFP4|TQ\d_\d))(?:[-_./]|$)'
    value: '${quant}'
  - match: '^(?P<dir>.+)/[^/]+$'
    value: '${dir}'
  - match: '.*'
    value: default
shards: '-(?P<index>\d{5})-of-(?P<count>\d{5})\.gguf$'
tensors:
  - match: '^token_embd\.'
    kind: TENSOR_GROUP_KIND_EMBEDDING
  - match: '^blk\.(?P<layer>\d+)\..*_exps\.'
    kind: TENSOR_GROUP_KIND_EXPERTS
  - match: '^blk\.(?P<layer>\d+)\.'
    kind: TENSOR_GROUP_KIND_LAYER
  - match: '^output(_norm)?\.'
    kind: TENSOR_GROUP_KIND_OUTPUT
  - match: '.*'
    kind: TENSOR_GROUP_KIND_OTHER
architecture: [general.architecture]
params:
  - name: n_layer
    keys: ['{arch}.block_count']
    derive: layers_seen
  - name: n_embd
    keys: ['{arch}.embedding_length']
  - name: n_head
    keys: ['{arch}.attention.head_count']
  - name: n_head_kv
    keys: ['{arch}.attention.head_count_kv']
    derive: n_head
  - name: head_dim
    keys: ['{arch}.attention.key_length']
    derive: n_embd / n_head
  - name: head_dim_v
    keys: ['{arch}.attention.value_length']
    derive: head_dim
  - name: n_ctx_train
    keys: ['{arch}.context_length']
  - name: n_vocab
    keys: ['{arch}.vocab_size', 'tokenizer.ggml.tokens.length']
  - name: n_expert
    keys: ['{arch}.expert_count']
  - name: n_expert_used
    keys: ['{arch}.expert_used_count']
  - name: kv_lora_rank
    keys: ['{arch}.attention.kv_lora_rank']
  - name: rope_dim
    keys: ['{arch}.rope.dimension_count']
  - name: n_swa
    keys: ['{arch}.attention.sliding_window']
  - name: swa_pattern
    keys: ['{arch}.attention.sliding_window_pattern']
  - name: file_type
    keys: ['general.file_type']
metadata:
  - general.name
  - general.basename
  - general.size_label
  - general.file_type
  - general.quantization_version
  - general.finetune
  - '{arch}.block_count'
requires: []
# The quant token in the group name names the width, the flavour rules only add words
precisions:
  - key: group
    match: '(?i)(?:^|[-_./])(?P<name>(?:UD-)?I?Q(?P<bits>\d)(?:_[0-9A-Z]+)*)(?:[-_./]|$)'
  - key: group
    match: '(?i)(?:^|[-_./])(?P<name>TQ(?P<bits>\d)_\d)(?:[-_./]|$)'
  - key: group
    match: '(?i)(?:^|[-_./])(?P<name>MXFP4)(?:[-_./]|$)'
    bits: 4
  - key: group
    match: '(?i)(?:^|[-_./])(?P<name>F32)(?:[-_./]|$)'
    bits: 32
  - key: group
    match: '(?i)(?:^|[-_./])(?P<name>BF16)(?:[-_./]|$)'
    bits: 16
    note: bfloat16, the training format on modern GPUs
  - key: group
    match: '(?i)(?:^|[-_./])(?P<name>F16)(?:[-_./]|$)'
    bits: 16
    note: float16, the training format on older GPUs
  - key: group
    match: '(?i)(?:^|[-_./])UD-'
    note: Unsloth dynamic, key layers kept at higher precision
  - key: group
    match: '(?i)(?:^|[-_./])(?:UD-)?IQ\d'
    note: importance-matrix quant, better quality than plain quants at the same bits
  - key: group
    match: '(?i)_K_XL(?:[-_./]|$)'
    note: extra large K-quant, the most careful of its bit width
  - key: group
    match: '(?i)_K_L(?:[-_./]|$)'
    note: large K-quant, more of the sensitive layers kept precise
  - key: group
    match: '(?i)_K_M(?:[-_./]|$)'
    note: medium K-quant, the recommended balance
  - key: group
    match: '(?i)_K_S(?:[-_./]|$)'
    note: small K-quant, a bit smaller and a bit rougher
  - key: group
    match: '(?i)(?:^|[-_./])Q\d_[01](?:[-_./]|$)'
    note: older quant scheme, a K-quant at the same bits is usually better
dtypes:
  '0': F32
  '1': F16
  '2': Q4_0
  '3': Q4_1
  '6': Q5_0
  '7': Q5_1
  '8': Q8_0
  '9': Q8_1
  '10': Q2_K
  '11': Q3_K
  '12': Q4_K
  '13': Q5_K
  '14': Q6_K
  '15': Q8_K
  '16': IQ2_XXS
  '17': IQ2_XS
  '18': IQ3_XXS
  '19': IQ1_S
  '20': IQ4_NL
  '21': IQ3_S
  '22': IQ2_S
  '23': IQ4_XS
  '24': I8
  '25': I16
  '26': I32
  '27': I64
  '28': F64
  '29': IQ1_M
  '30': BF16
  '34': TQ1_0
  '35': TQ2_0
  '39': MXFP4

id: nemo
description: NeMo checkpoint packed as one .nemo tar, model_config.yaml beside a torch, zarr, or distributed checkpoint
blurb: A NeMo checkpoint packed as one .nemo archive, the older NVIDIA layout
priority: 6
files:
  - match: '(?i)\.nemo$'
    role: ARTIFACT_ROLE_WEIGHTS
groups:
  - match: '^(?:.*/)?(?P<stem>[^/]+)\.(?i:nemo)$'
    value: '${stem}'
  - match: '.*'
    value: default
tensors:
  - match: '(^|\.)(word_embeddings|position_embeddings)\.'
    kind: TENSOR_GROUP_KIND_EMBEDDING
  - match: '(^|\.)layers\.(?P<layer>\d+)\..*experts\.'
    kind: TENSOR_GROUP_KIND_EXPERTS
  - match: '(^|\.)layers\.(?P<layer>\d+)\.'
    kind: TENSOR_GROUP_KIND_LAYER
  - match: '(^|\.)(output_layer|final_layernorm|final_norm)\.'
    kind: TENSOR_GROUP_KIND_OUTPUT
  - match: '.*'
    kind: TENSOR_GROUP_KIND_OTHER
architecture: [nemo.architecture]
params:
  - name: n_layer
    keys: [num_layers, config.num_layers]
    derive: layers_seen
  - name: n_embd
    keys: [hidden_size, config.hidden_size]
  - name: n_head
    keys: [num_attention_heads, config.num_attention_heads]
  - name: n_head_kv
    keys: [num_query_groups, config.num_query_groups]
    derive: n_head
  - name: head_dim
    keys: [kv_channels, config.kv_channels]
    derive: n_embd / n_head
  - name: head_dim_v
    keys: []
    derive: head_dim
  - name: n_ctx_train
    keys: [max_position_embeddings, encoder_seq_length, seq_length, config.seq_length]
  - name: embedding_elements
    tensor: '(^|\.)word_embeddings\.weight$'
  - name: n_vocab
    keys: [vocab_size, config.vocab_size, tokenizer.vocab_size]
    derive: embedding_elements / n_embd
  - name: n_expert
    keys: [num_moe_experts, config.num_moe_experts]
  - name: n_expert_used
    keys: [moe_router_topk, config.moe_router_topk]
metadata:
  - precision
  - config.params_dtype
  - config.bf16
  - target
  - _target_
  - config._target_
  - nemo.sharded_backend
  - nemo.layers
  - tokenizer.type
  - config.seq_length
requires: []

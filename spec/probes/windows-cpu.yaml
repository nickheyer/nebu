id: windows-cpu
description: CPU model and counts from the processor class
os: [windows]
exec:
  command: powershell
  args: [-NoProfile, -NonInteractive, -Command, 'Get-CimInstance Win32_Processor | Select-Object Name,Manufacturer,NumberOfCores,NumberOfLogicalProcessors | Format-List']
  timeout_ms: 20000
parse:
  kind: PARSE_KIND_KV
emit:
  device:
    kind: DEVICE_KIND_CPU
    vendor: "{{lower .Manufacturer}}"
    id: cpu-{{.index}}
    name: "{{.Name}}"
    facts:
      cores: "{{.NumberOfCores}}"
      siblings: "{{.NumberOfLogicalProcessors}}"
  facts:
    - key: cpu.model
      value: "{{.first.Name}}"
    - key: cpu.threads
      value: "{{.first.NumberOfLogicalProcessors}}"

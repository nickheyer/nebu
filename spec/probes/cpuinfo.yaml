id: cpuinfo
description: CPU model and flags from procfs
os: [linux]
exec:
  file: /proc/cpuinfo
parse:
  kind: PARSE_KIND_KV
emit:
  device:
    kind: DEVICE_KIND_CPU
    vendor: "{{index . \"vendor_id\"}}"
    id: cpu-{{index . "physical_id"}}
    name: "{{index . \"model_name\"}}"
    when: index == "0"
    facts:
      cores: "{{index . \"cpu_cores\"}}"
      siblings: "{{index . \"siblings\"}}"
      flags: "{{index . \"flags\"}}"
  facts:
    - key: cpu.model
      value: "{{index .first \"model_name\"}}"
    - key: cpu.flags
      value: "{{index .first \"flags\"}}"
    - key: cpu.threads
      value: "{{.count}}"

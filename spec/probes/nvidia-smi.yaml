id: nvidia-smi
description: NVIDIA GPUs through nvidia-smi
exec:
  command: nvidia-smi
  args:
    - --query-gpu=index,name,uuid,memory.total,memory.used,memory.free,compute_cap,driver_version,pci.bus_id
    - --format=csv,noheader,nounits
parse:
  kind: PARSE_KIND_CSV
  columns: [index, name, uuid, memory_total, memory_used, memory_free, compute_cap, driver_version, pci_bus_id]
emit:
  device:
    kind: DEVICE_KIND_GPU
    vendor: nvidia
    id: "{{.uuid}}"
    name: "{{.name}}"
    memory_total: "{{.memory_total}}"
    memory_free: "{{.memory_free}}"
    unit: MiB
    facts:
      index: "{{.index}}"
      compute_capability: "{{.compute_cap}}"
      driver_version: "{{.driver_version}}"
      pci_bus_id: "{{.pci_bus_id}}"
  pool:
    kind: POOL_KIND_DEVICE
    id: "{{.uuid}}"
    device_id: "{{.uuid}}"
    total: "{{.memory_total}}"
    free: "{{.memory_free}}"
    unit: MiB
  facts:
    - key: nvidia.driver_version
      value: "{{.first.driver_version}}"
    - key: nvidia.count
      value: "{{.count}}"

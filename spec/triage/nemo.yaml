id: nemo
description: Failure patterns of NeMo Export-Deploy in framework serving
rules:
  - id: device-oom
    match: '(?i)(torch\.OutOfMemoryError|CUDA out of memory|out of memory)'
    summary: device ran out of memory
    hint: lower n_ctx or max_batch_size, or shard with tensor_model_parallel_size and num_gpus
  - id: not-nemo2
    match: '(?i)((context|weights).*(does not exist|not found|no such file)|not a valid NeMo 2|missing (context|weights) director)'
    summary: the checkpoint is not a NeMo 2 directory
    hint: in framework serving loads NeMo 2 checkpoints with context/ and weights/; a packed .nemo has to be converted first
  - id: state-dict-mismatch
    match: '(?i)(Missing key\(s\) in state_dict|Unexpected key\(s\) in state_dict|legacy checkpoint)'
    summary: the checkpoint keys do not match the model the config builds
    hint: turn on legacy_ckpt for checkpoints written before Megatron Bridge
    fix:
      legacy_ckpt: 'true'
  - id: convert-model-id
    match: '(?i)(model_id .* not (in|supported)|is not a valid model_id|Available model listed in MODEL_CONFIG_MAPPING|needs the base model.s Hugging Face id)'
    summary: the converter does not know this checkpoint's base model
    hint: set model_id to the Hugging Face id of the base model the converter lists, such as meta-llama/Meta-Llama-3-8B
  - id: convert-failed
    match: '(?i)(convert_nemo1_to_nemo2|nemo-serve: converting).*(Traceback|Error)'
    summary: converting the packed checkpoint failed
    hint: read the converter output above; only the model families the converter lists can be converted
  - id: missing-module
    match: '(?i)(ModuleNotFoundError|No module named)'
    summary: the install is missing a Python package
    hint: rebuild the nemo recipe, the virtual environment is incomplete
  - id: ray-start
    match: '(?i)(Failed to start Ray|Could not connect to Ray|ray\.exceptions|RayTaskError)'
    summary: Ray could not start or lost a worker
    hint: stop other Ray instances on the host and free its ports, then run again
  - id: port-in-use
    match: '(?i)address already in use'
    summary: the port is taken
    hint: stop whatever holds the port or run the model again to get a fresh port

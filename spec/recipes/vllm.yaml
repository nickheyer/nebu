id: vllm
runtime_id: vllm
description: vllm installed from PyPI into a virtual environment
tools: [python3]
facts: [device.vendor, device.compute_capability]
vars:
  version: ''
  wheel: 'vllm{{if .vars.version}}=={{.vars.version}}{{end}}'
variants:
  - id: cuda
    description: The default wheel, built for CUDA
    when: any(devices, .vendor == "nvidia")
  - id: rocm
    description: ROCm wheels from the AMD index
    when: any(devices, .vendor == "amd")
    vars:
      index: --extra-index-url=https://download.pytorch.org/whl/rocm6.3
  - id: cpu
    description: CPU only wheel
    when: 'true'
    vars:
      index: --extra-index-url=https://download.pytorch.org/whl/cpu
sandbox:
  kind: SANDBOX_KIND_HOST
  cli: [podman, docker, nerdctl]
steps:
  - name: venv
    command: [python3, -m, venv, '{{.out}}/venv']
  - name: pip
    command: ['{{.out}}/venv/bin/python', -m, pip, install, --upgrade, pip]
  - name: install
    command: ['{{.out}}/venv/bin/python', -m, pip, install, '{{.vars.wheel}}', '{{index .vars "index"}}']
binary: venv/bin/vllm
timeout_ms: 3600000

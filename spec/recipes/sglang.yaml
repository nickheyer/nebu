id: sglang
runtime_id: sglang
description: SGLang installed from PyPI into a virtual environment
tools: [python3]
facts: [device.vendor, device.compute_capability]
vars:
  version: ''
  wheel: 'sglang[all]{{if .vars.version}}=={{.vars.version}}{{end}}'
variants:
  - id: cuda
    description: The PyPI wheels, built for CUDA
    when: any(devices, .vendor == "nvidia")
  - id: cpu
    description: The same wheels over CPU torch, so the recipe builds anywhere, serving still needs the NVIDIA GPU the manifest asks for
    when: 'true'
    vars:
      index: --extra-index-url=https://download.pytorch.org/whl/cpu
sandbox:
  kind: SANDBOX_KIND_HOST
  cli: [podman, docker, nerdctl]
steps:
  - name: venv
    command: [python3, -m, venv, '{{.out}}/venv']
  - name: pip
    command: ['{{.out}}/venv/bin/python', -m, pip, install, --upgrade, pip]
  - name: install
    command: ['{{.out}}/venv/bin/python', -m, pip, install, '{{.vars.wheel}}', '{{index .vars "index"}}']
binary: venv/bin/python
timeout_ms: 3600000

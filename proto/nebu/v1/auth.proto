syntax = "proto3";

package nebu.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// What an account may do. Each role grants the scopes listed beside it
enum Role {
  ROLE_UNSPECIFIED = 0;
  // inference, read, operate, and admin
  ROLE_ADMIN = 1;
  // inference, read, and operate
  ROLE_OPERATOR = 2;
  // inference alone
  ROLE_INFERENCE = 3;
}

// A class of calls a credential opens. Admin opens every call and operate opens read calls as well
enum Scope {
  SCOPE_UNSPECIFIED = 0;
  // Gateway requests, web chat, tool calls, and the caller's own password and tokens
  SCOPE_INFERENCE = 1;
  // List, Get, Watch, and Logs calls
  SCOPE_READ = 2;
  // Calls that run, stop, swap, put, or delete
  SCOPE_OPERATE = 3;
  // Accounts, settings, sources, and mesh membership
  SCOPE_ADMIN = 4;
}

// A local account that signs in to the web UI
message User {
  string id = 1;
  string username = 2;
  google.protobuf.Timestamp created_at = 3;
  // Last password change
  google.protobuf.Timestamp updated_at = 4;
  Role role = 5;
}

// Asks for accounts, the ones whose username holds every word of the query
message ListUsersRequest {
  string query = 1 [(buf.validate.field).string.max_len = 256];
  string cursor = 2;
  uint32 limit = 3 [(buf.validate.field).uint32.lte = 1000];
}

// Accounts by username
message ListUsersResponse {
  repeated User users = 1;
  string next_cursor = 2;
}

// Adds an account. The first account is always an admin and later ones need a role
message CreateUserRequest {
  string username = 1 [(buf.validate.field).string.min_len = 1];
  string password = 2 [(buf.validate.field).string.min_len = 1];
  Role role = 3 [(buf.validate.field).enum.defined_only = true];
}

// The new account
message CreateUserResponse {
  User user = 1;
}

// Removes an account and ends its sessions
message DeleteUserRequest {
  string username = 1 [(buf.validate.field).string.min_len = 1];
}

// Confirms the removal
message DeleteUserResponse {}

// Changes an account's password and ends its sessions. An account changes its own password
// and an admin changes any. Local accounts give their own current password, the daemon token none
message SetPasswordRequest {
  string username = 1;
  string password = 2 [(buf.validate.field).string.min_len = 1];
  string current_password = 3;
}

// The account after the change
message SetPasswordResponse {
  User user = 1;
}

// Gives an account another role, ending its sessions and moving its API tokens to the role
message SetRoleRequest {
  string username = 1 [(buf.validate.field).string.min_len = 1];
  Role role = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}

// The account after the change
message SetRoleResponse {
  User user = 1;
}

// An API token a signed-in user made. API and gateway clients send it as a
// bearer token and act as that user within its scopes.
message ApiToken {
  string id = 1;
  // Label the owner gave it
  string name = 2;
  // The whole token, nebu_ then the prefix then the secret, set once in the answer that creates it
  string secret = 3;
  google.protobuf.Timestamp created_at = 4;
  // Last request that sent it, unset until the first
  google.protobuf.Timestamp last_used_at = 5;
  // The twelve characters after nebu_ that name the token without revealing it
  string prefix = 6;
  repeated Scope scopes = 7;
}

// Asks for the caller's own tokens, the ones whose name or prefix holds every word of the query
message ListTokensRequest {
  string query = 1 [(buf.validate.field).string.max_len = 256];
  string cursor = 2;
  uint32 limit = 3 [(buf.validate.field).uint32.lte = 1000];
}

// The caller's tokens, newest first
message ListTokensResponse {
  repeated ApiToken tokens = 1;
  string next_cursor = 2;
}

// Makes a token for the caller's own account, holding no scope beyond the caller's own
message CreateTokenRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  repeated Scope scopes = 2 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      enum: {defined_only: true}
    }
  }];
}

// The new token with its secret
message CreateTokenResponse {
  ApiToken token = 1;
}

// Revokes one of the caller's own tokens
message DeleteTokenRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// Confirms the revocation
message DeleteTokenResponse {}

// How a caller signs in to a provider serving models
enum CredentialKind {
  CREDENTIAL_KIND_UNSPECIFIED = 0;
  // An API key the caller gives
  CREDENTIAL_KIND_KEY = 1;
  // Tokens a sign-in with the provider gave, refreshed by the daemon
  CREDENTIAL_KIND_SIGN_IN = 2;
}

// What a budget counts
enum BudgetUnit {
  BUDGET_UNIT_UNSPECIFIED = 0;
  // Input and output tokens
  BUDGET_UNIT_TOKENS = 1;
  BUDGET_UNIT_INPUT_TOKENS = 2;
  BUDGET_UNIT_OUTPUT_TOKENS = 3;
  BUDGET_UNIT_REQUESTS = 4;
  // The percent of a reported window used, from what the provider says is left, spent once it reaches the limit
  BUDGET_UNIT_PERCENT_USED = 5;
}

// The span a budget counts over
enum BudgetPeriod {
  BUDGET_PERIOD_UNSPECIFIED = 0;
  // The seconds before each request
  BUDGET_PERIOD_ROLLING = 1;
  BUDGET_PERIOD_DAY = 2;
  BUDGET_PERIOD_WEEK = 3;
  BUDGET_PERIOD_MONTH = 4;
  // From one reset of a reported window to the next
  BUDGET_PERIOD_REPORTED = 5;
}

// A limit the owner sets on what one credential is used for
message CredentialBudget {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Model ids it counts, * standing for any run of characters, every model when empty
  repeated string models = 2 [(buf.validate.field).repeated.max_items = 64];
  BudgetUnit unit = 3 [(buf.validate.field).enum.defined_only = true];
  double limit = 4 [(buf.validate.field).double = {
    gt: 0
    finite: true
  }];
  BudgetPeriod period = 5 [(buf.validate.field).enum.defined_only = true];
  // Seconds a rolling period spans, from 300, the span usage is counted in, to 8640000, the 100 days it is kept
  uint32 seconds = 6;
  // Where a day, week or month starts: the hour, the weekday from Sunday as 0, or the day of the month
  uint32 start = 7 [(buf.validate.field).uint32.lte = 31];
  // The time zone a day, week or month is counted in, UTC when empty
  string zone = 8 [(buf.validate.field).string.max_len = 64];
  // The reported window a percent used unit or a reported period reads
  string window = 9 [(buf.validate.field).string.max_len = 64];
  // Percent of the limit held back, the credential spent once the rest is used
  uint32 reserve_percent = 10 [(buf.validate.field).uint32.lte = 100];
  // Whether input the provider served from its cache counts
  bool cached = 11;
}

// What a window measures
enum WindowKind {
  WINDOW_KIND_UNSPECIFIED = 0;
  // A budget the owner set, measured against the usage recorded
  WINDOW_KIND_BUDGET = 1;
  // A limit the provider reports on its answers
  WINDOW_KIND_REPORTED = 2;
  // The wait after the provider refused a request as over its limits
  WINDOW_KIND_COOLDOWN = 3;
}

// One limit on a credential, how much of it is used and when it resets
message CredentialWindow {
  string name = 1;
  WindowKind kind = 2;
  double limit = 3;
  double used = 4;
  google.protobuf.Timestamp resets_at = 5;
  // Whether requests pass the credential over until it resets
  bool spent = 6;
}

// A credential a caller keeps for one provider source. Gateway requests to the source's
// models carry the caller's first by position whose windows are not spent. The secret never leaves the daemon.
message ProviderCredential {
  string id = 1;
  string source_id = 2;
  // Label the owner gave it
  string name = 3;
  CredentialKind kind = 4;
  // Whether a secret is stored
  bool secret_set = 5;
  // When a sign-in's access lapses unless refreshed, unset for a key
  google.protobuf.Timestamp expires_at = 6;
  // Order among the owner's credentials for the source from 1, the lowest used first
  uint32 position = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // Limits the owner set, in the order written
  repeated CredentialBudget budgets = 10;
  // Each budget, reported limit and cooldown as it stands, kept in memory since the daemon started
  repeated CredentialWindow windows = 11;
}

// Asks for the caller's own credentials, the ones whose name or source holds every word of the query
message ListCredentialsRequest {
  string query = 1 [(buf.validate.field).string.max_len = 256];
  string cursor = 2;
  uint32 limit = 3 [(buf.validate.field).uint32.lte = 1000];
}

// The caller's credentials by source and position
message ListCredentialsResponse {
  repeated ProviderCredential credentials = 1;
  string next_cursor = 2;
}

// Stores a key for a provider source as the caller's, a new credential when id is empty
message PutCredentialRequest {
  string id = 1;
  string source_id = 2;
  string name = 3;
  // The key. Empty keeps the stored one.
  string secret = 4;
  // Order among the caller's credentials for the source from 1. Zero keeps it, or places a new one last.
  uint32 position = 5;
  // The budgets the credential takes in place of its own when budgets_set is true
  repeated CredentialBudget budgets = 6 [(buf.validate.field).repeated.max_items = 32];
  bool budgets_set = 7;
}

// The credential after the change
message PutCredentialResponse {
  ProviderCredential credential = 1;
}

// Removes one of the caller's credentials
message DeleteCredentialRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// Confirms the removal
message DeleteCredentialResponse {
  // Whether the provider has yet to confirm revoking the removed sign-in's session. The daemon keeps asking it to, and
  // the person can end the session at the provider meanwhile
  bool revocation_unconfirmed = 1;
}

// Asks for what the caller's credentials were used for over a time range
message ListCredentialUsageRequest {
  // One credential's, every one's when empty
  string credential_id = 1;
  // Thirty days back when unset
  google.protobuf.Timestamp from = 2;
  // Now when unset
  google.protobuf.Timestamp to = 3;
}

// What one credential was used for with one model
message CredentialUsage {
  string credential_id = 1;
  string model = 2;
  uint64 requests = 3;
  uint64 input_tokens = 4;
  uint64 output_tokens = 5;
  // Input tokens the provider served from its cache, counted among the input tokens
  uint64 cached_tokens = 6;
}

// Usage by credential and model, the most requests first
message ListCredentialUsageResponse {
  repeated CredentialUsage usage = 1;
}

// A sign-in waiting for the person to approve it at the provider
message ProviderSignIn {
  string id = 1;
  string source_id = 2;
  // Where the person approves it
  string url = 3;
  // The code the person enters there, empty when the provider asks for none
  string code = 4;
  google.protobuf.Timestamp expires_at = 5;
}

// Starts a sign-in with a provider for the caller
message StartSignInRequest {
  string source_id = 1 [(buf.validate.field).string.min_len = 1];
  // Label the credential gets
  string name = 2;
  // One of the caller's sign-ins with the source to authorize again, under the client its provider issued it and with
  // its tokens replaced in place once the same account approves; a new credential when empty
  string credential_id = 3;
}

// Where the person goes to approve it
message StartSignInResponse {
  ProviderSignIn sign_in = 1;
}

// Completes a sign-in the person approved, keeping its tokens as the caller's credential
message FinishSignInRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // The address the provider sent the browser back to after approval
  string callback = 2 [(buf.validate.field).string.max_len = 8192];
}

// The credential the sign-in made
message FinishSignInResponse {
  ProviderCredential credential = 1;
}

// Local accounts, API tokens, and provider credentials. Account calls are unavailable when auth.oidc
// is set or auth.disabled is true and need an admin, password changes apart. Token calls
// need a signed-in account, local or single sign-on, and are unavailable when auth.disabled is true.
// Credential calls act on the caller's own, the daemon token and auth.disabled sharing one set.
service AuthService {
  // Lists accounts
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // Adds an account
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  // Refuses the caller's own account and the last account
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  // Changes a password and ends the account's sessions
  rpc SetPassword(SetPasswordRequest) returns (SetPasswordResponse);
  // Change an account's role. Needs an admin, and the last admin keeps the role.
  rpc SetRole(SetRoleRequest) returns (SetRoleResponse);
  // Lists the caller's API tokens by prefix, never with their secrets
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);
  // Makes an API token for the caller
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse);
  // Revokes one of the caller's API tokens
  rpc DeleteToken(DeleteTokenRequest) returns (DeleteTokenResponse);
  // Lists the caller's provider credentials, never with their secrets
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  // Stores a key for a provider source as the caller's
  rpc PutCredential(PutCredentialRequest) returns (PutCredentialResponse);
  // Removes one of the caller's provider credentials
  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialResponse);
  // Reads what the caller's credentials were used for, by model
  rpc ListCredentialUsage(ListCredentialUsageRequest) returns (ListCredentialUsageResponse);
  // Starts a sign-in with a provider
  rpc StartSignIn(StartSignInRequest) returns (StartSignInResponse);
  // Completes an approved sign-in and keeps its tokens
  rpc FinishSignIn(FinishSignInRequest) returns (FinishSignInResponse);
}

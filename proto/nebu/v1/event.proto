syntax = "proto3";

package nebu.v1;

import "google/protobuf/timestamp.proto";
import "nebu/v1/bot.proto";
import "nebu/v1/gateway.proto";
import "nebu/v1/host.proto";
import "nebu/v1/instance.proto";
import "nebu/v1/mesh.proto";
import "nebu/v1/recipe.proto";
import "nebu/v1/runtime.proto";
import "nebu/v1/settings.proto";
import "nebu/v1/slot.proto";
import "nebu/v1/source.proto";
import "nebu/v1/store.proto";
import "nebu/v1/task.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// Changed resource kind.
enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_HOST = 1;
  EVENT_KIND_TASK = 2;
  EVENT_KIND_INSTANCE = 3;
  EVENT_KIND_SLOT = 4;
  EVENT_KIND_ROUTE = 5;
  EVENT_KIND_INSTALL = 6;
  EVENT_KIND_BUILD = 7;
  EVENT_KIND_MODEL = 8;
  EVENT_KIND_SOURCE = 11;
  // Store totals after downloads, removals, or collection.
  EVENT_KIND_STORE = 14;
  // Updated host preferences.
  EVENT_KIND_SETTINGS = 15;
  // Gateway request start and completion, excluding bodies.
  EVENT_KIND_TRACE = 16;
  // A Discord bot, after its settings or connection change
  EVENT_KIND_BOT = 17;
  // Discord bot activity or failure.
  EVENT_KIND_BOT_ACTIVITY = 18;
  // A mesh member's record, this node's or a copy of another's
  EVENT_KIND_NODE = 19;
  // A formation, conducted here or copied from its conductor
  EVENT_KIND_FORMATION = 20;
  // The mesh from this node: membership, nodes and meshes heard on the network, admissions under way
  EVENT_KIND_MESH = 21;
}

// How it changed
enum EventAction {
  EVENT_ACTION_UNSPECIFIED = 0;
  EVENT_ACTION_CREATED = 1;
  EVENT_ACTION_UPDATED = 2;
  EVENT_ACTION_DELETED = 3;
}

// Resource change with the updated record.
message Event {
  uint64 seq = 1;
  EventKind kind = 2;
  EventAction action = 3;
  string id = 4;
  google.protobuf.Timestamp at = 5;
  // The record after the change
  oneof payload {
    HostProfile host = 10;
    Task task = 11;
    Instance instance = 12;
    Slot slot = 13;
    Route route = 14;
    Install install = 15;
    Build build = 16;
    StoredModel model = 17;
    Source source = 20;
    StoreStatus store = 23;
    Settings settings = 24;
    Trace trace = 25;
    Bot bot = 26;
    BotActivity bot_activity = 27;
    Node node = 28;
    Formation formation = 29;
    MeshStatus mesh_status = 30;
  }
}

// Subscribes to changes, all kinds when empty
message WatchEventsRequest {
  repeated EventKind kinds = 1;
  bool snapshot = 2;
}

// One event on the stream
message WatchEventsResponse {
  Event event = 1;
}

// Live updates feeding the UI
service EventService {
  // Stream events until the client disconnects.
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse);
}

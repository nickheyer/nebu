syntax = "proto3";

package nebu.v1;

import "google/protobuf/timestamp.proto";
import "nebu/v1/model.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// Kind of catalog a source talks to
enum SourceKind {
  SOURCE_KIND_UNSPECIFIED = 0;
  SOURCE_KIND_HUGGINGFACE = 1;
  SOURCE_KIND_LOCAL = 2;
  SOURCE_KIND_MODELSCOPE = 3;
  SOURCE_KIND_MIRROR = 4;
  SOURCE_KIND_OLLAMA = 5;
  SOURCE_KIND_CIVITAI = 6;
  SOURCE_KIND_OCI = 7;
  SOURCE_KIND_KAGGLE = 8;
  SOURCE_KIND_NGC = 9;
  SOURCE_KIND_CSGHUB = 10;
  SOURCE_KIND_GITHUB = 11;
  SOURCE_KIND_GIT = 12;
}

// Value type of one source setting
enum ConfigType {
  CONFIG_TYPE_UNSPECIFIED = 0;
  CONFIG_TYPE_STRING = 1;
  CONFIG_TYPE_URL = 2;
  CONFIG_TYPE_PATH = 3;
  CONFIG_TYPE_ENV = 4;
  CONFIG_TYPE_BOOL = 5;
  CONFIG_TYPE_INT = 6;
}

// One setting a source of a provider accepts, declared by the transport that reads it
message ConfigField {
  string name = 1;
  string label = 2;
  ConfigType type = 3;
  bool required = 4;
  string default = 5;
  string description = 6;
  string transport = 7;
  repeated string choices = 8;
}

// A provider sources are created from, with the settings its transports accept
message Provider {
  SourceKind kind = 1;
  string name = 2;
  string description = 3;
  repeated ConfigField fields = 4;
  repeated string transports = 5;
  bool configured = 6;
}

// Configured place models come from
message Source {
  string id = 1;
  SourceKind kind = 2;
  string name = 3;
  map<string, string> config = 4;
  bool seeded = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// One way a source can order results
message SortOption {
  string id = 1;
  string label = 2;
  bool reversible = 3;
}

// One value a facet accepts
message FacetValue {
  string id = 1;
  string label = 2;
  string group = 3;
}

// One dimension results can be narrowed by
message Facet {
  string id = 1;
  string label = 2;
  repeated FacetValue values = 3;
  bool multi = 4;
  bool freeform = 5;
}

// What a source can do, so a client can render one interface for every catalog
message SourceCapabilities {
  bool browse = 1;
  bool search = 2;
  bool paginate = 3;
  bool card = 4;
  bool revisions = 5;
  bool auth_required = 6;
  bool token_present = 7;
  repeated SortOption sorts = 8;
  string default_sort = 9;
  repeated Facet facets = 10;
  string repo_example = 11;
  string repo_pattern = 12;
  string web_url = 13;
  string description = 14;
  string revision_label = 15;
  string token_env = 16;
  string endpoint = 17;
  string name = 18;
  repeated ConfigField fields = 19;
  repeated string transports = 20;
  // Housekeeping tags the provider attaches that say nothing about a model, patterns matched whole
  repeated string hidden_tags = 21;
  // Extras worth a chip on a hit card in order, a bool showing its label, a comma list one chip each
  repeated ConfigField hit_fields = 22;
}

// A configured source with what it can do
message SourceStatus {
  Source source = 1;
  SourceCapabilities capabilities = 2;
  string error = 3;
}

// One catalog search result
message SearchHit {
  string source_id = 1;
  string repo = 2;
  string author = 3;
  uint64 downloads = 4;
  uint64 likes = 5;
  google.protobuf.Timestamp updated_at = 6;
  repeated string tags = 7;
  string name = 8;
  string description = 9;
  string task = 10;
  string library = 11;
  string license = 12;
  repeated string formats = 13;
  uint64 parameters = 14;
  uint64 size_bytes = 15;
  bool gated = 16;
  bool private = 17;
  google.protobuf.Timestamp created_at = 18;
  string url = 19;
  map<string, string> extra = 20;
}

// One branch, tag, version, or variant of a repository
message Revision {
  string name = 1;
  string commit = 2;
  bool default = 3;
  uint64 size_bytes = 4;
  google.protobuf.Timestamp updated_at = 5;
  string detail = 6;
  // Set when the variant resolves as its own repository
  string repo = 7;
}

// The description a source publishes for a repository
message ModelCard {
  string markdown = 1;
  string html = 2;
  string url = 3;
}

// Lists configured sources
message ListSourcesRequest {}

// Lists providers sources can be created from
message ListProvidersRequest {}

// Returns every provider with the settings it accepts
message ListProvidersResponse {
  repeated Provider providers = 1;
}

// Returns configured sources with their capabilities
message ListSourcesResponse {
  repeated SourceStatus sources = 1;
}

// Searches or browses one source, every source of a provider, or every source at once
message SearchRequest {
  string source_id = 1;
  string query = 2;
  repeated string tags = 3;
  uint32 limit = 4;
  string sort = 5;
  bool ascending = 6;
  // Facet id to value, comma separated for multi valued facets
  map<string, string> filters = 7;
  string cursor = 8;
  string author = 9;
  // Searches every source of this provider when source_id is empty, every source when both are empty
  SourceKind kind = 10;
}

// Returns one page of hits, merged across sources when the request named none, with a warning for every source that did not answer
message SearchResponse {
  repeated SearchHit hits = 1;
  string next_cursor = 2;
  uint64 total = 3;
  repeated string warnings = 4;
}

// Resolves a repo and revision to artifacts
message ResolveRequest {
  string source_id = 1;
  string repo = 2;
  string revision = 3;
}

// Returns the classified model
message ResolveResponse {
  Model model = 1;
}

// Lists revisions of a repository
message ListRevisionsRequest {
  string source_id = 1;
  string repo = 2;
}

// Returns revisions, default first
message ListRevisionsResponse {
  repeated Revision revisions = 1;
}

// Creates a source
message CreateSourceRequest {
  Source source = 1;
}

// Returns the new source with what it can do
message CreateSourceResponse {
  SourceStatus source = 1;
}

// Replaces the name and settings of a source, its id and kind stay
message UpdateSourceRequest {
  Source source = 1;
}

// Returns the updated source with what it can do
message UpdateSourceResponse {
  SourceStatus source = 1;
}

// Removes a source, refused for seeded defaults
message DeleteSourceRequest {
  string id = 1;
  // Removes the watches of the source and widens the wants narrowed to it first
  bool force = 2;
}

// Returns the removed source
message DeleteSourceResponse {
  Source source = 1;
}

// Fetches the description of a repository
message GetModelCardRequest {
  string source_id = 1;
  string repo = 2;
  string revision = 3;
}

// Returns the card
message GetModelCardResponse {
  ModelCard card = 1;
}

// Catalog lookup across sources
service SourceService {
  // Lists configured sources with capabilities
  rpc ListSources(ListSourcesRequest) returns (ListSourcesResponse);
  // Lists providers with the settings their sources accept
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  // Searches or browses a source catalog
  rpc Search(SearchRequest) returns (SearchResponse);
  // Resolves a repo to classified artifacts
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  // Lists revisions of a repository
  rpc ListRevisions(ListRevisionsRequest) returns (ListRevisionsResponse);
  // Fetches the model card
  rpc GetModelCard(GetModelCardRequest) returns (GetModelCardResponse);
  // Creates a source
  rpc CreateSource(CreateSourceRequest) returns (CreateSourceResponse);
  // Replaces the settings of a source
  rpc UpdateSource(UpdateSourceRequest) returns (UpdateSourceResponse);
  // Removes a source
  rpc DeleteSource(DeleteSourceRequest) returns (DeleteSourceResponse);
}

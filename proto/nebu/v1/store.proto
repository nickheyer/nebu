syntax = "proto3";

package nebu.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "nebu/v1/model.proto";
import "nebu/v1/task.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// Stored artifact with blob digest and link path.
message StoredArtifact {
  Artifact artifact = 1;
  string digest = 2;
  string path = 3;
}

// Downloaded weight group and associated files.
message StoredModel {
  string source_id = 1;
  string repo = 2;
  string revision = 3;
  string commit = 4;
  string group = 5;
  string format_id = 6;
  repeated StoredArtifact artifacts = 7;
  Descriptor descriptor = 8;
  uint64 bytes = 9;
  google.protobuf.Timestamp pulled_at = 10;
  string path = 11;
  // Last launch time, used for eviction order.
  google.protobuf.Timestamp used_at = 12;
  // Compatible runtimes by Runtime.bit, based on the format and header metadata.
  uint32 runtimes = 13;
}

// Store wide counters
message StoreStatus {
  string path = 1;
  uint64 models = 2;
  uint64 blobs = 3;
  uint64 blob_bytes = 4;
  uint64 partials = 5;
  uint64 partial_bytes = 6;
  // Blob storage limit in bytes. Zero disables the limit.
  uint64 max_bytes = 7;
  // Tensor caches formation stages keep on disk, counted against the limit
  uint64 caches = 8;
  uint64 cache_bytes = 9;
}

// Download a weight group and its blueprint dependencies.
message PullRequest {
  string source_id = 1 [(buf.validate.field).string.min_len = 1];
  string repo = 2 [(buf.validate.field).string.min_len = 1];
  string revision = 3;
  string group = 4;
  // Download only this group, excluding blueprint dependencies.
  bool alone = 5;
  // Pull onto another mesh member, this node when empty
  string node_id = 6;
  // Files of the repository to download on their own, each joining the stored group it belongs to
  repeated string paths = 7;
  // The blueprint slot the files fill, the stored group then carrying that component's descriptor
  string slot = 8;
}

// Returns the pull task
message PullResponse {
  Task task = 1;
}

// How a model listing is ordered
enum ModelSort {
  // Repository then group, ascending
  MODEL_SORT_UNSPECIFIED = 0;
  // Most recently launched first
  MODEL_SORT_LAST_USED = 1;
  // Most recently pulled first
  MODEL_SORT_PULLED = 2;
  // Largest first
  MODEL_SORT_SIZE = 3;
  // Repository then group, ascending
  MODEL_SORT_NAME = 4;
}

// Lists stored models, the ones whose repository, group, format, or architecture holds every word of the query
message ListModelsRequest {
  string query = 1 [(buf.validate.field).string.max_len = 256];
  ModelKind kind = 2 [(buf.validate.field).enum.defined_only = true];
  // A runtime id, keeping the models compatible with it
  string runtime_id = 3;
  string format_id = 4;
  ModelSort sort = 5 [(buf.validate.field).enum.defined_only = true];
  // The cursor the previous page answered with, the first page when empty
  string cursor = 6;
  // Models per page, every remaining model when zero
  uint32 limit = 7 [(buf.validate.field).uint32.lte = 1000];
}

// Returns stored models
message ListModelsResponse {
  repeated StoredModel models = 1;
  // The cursor of the page after, empty on the last
  string next_cursor = 2;
}

// Fetches one stored model
message GetModelRequest {
  string source_id = 1 [(buf.validate.field).string.min_len = 1];
  string repo = 2 [(buf.validate.field).string.min_len = 1];
  string group = 3;
}

// Returns one stored model
message GetModelResponse {
  StoredModel model = 1;
}

// Removes a stored model and optionally collects blobs
message RemoveModelRequest {
  string source_id = 1 [(buf.validate.field).string.min_len = 1];
  string repo = 2 [(buf.validate.field).string.min_len = 1];
  string group = 3;
  bool gc = 4;
}

// Returns the removed model and any collection result
message RemoveModelResponse {
  StoredModel model = 1;
  GcResponse gc = 2;
}

// Collects unreferenced blobs
message GcRequest {
  bool partials = 1;
}

// Returns collection counts
message GcResponse {
  uint32 removed = 1;
  uint64 freed_bytes = 2;
}

// Rehashes stored blobs, optionally for one model
message VerifyRequest {
  string source_id = 1 [(buf.validate.field).string.min_len = 1];
  string repo = 2 [(buf.validate.field).string.min_len = 1];
  string group = 3;
}

// Returns the verify task
message VerifyResponse {
  Task task = 1;
}

// Copies a stored model into a mirror layout
message ExportRequest {
  string source_id = 1 [(buf.validate.field).string.min_len = 1];
  string repo = 2 [(buf.validate.field).string.min_len = 1];
  string group = 3;
  string dir = 4 [(buf.validate.field).string.min_len = 1];
}

// Returns the export task
message ExportResponse {
  Task task = 1;
}

// Asks for store counters
message GetStatusRequest {}

// Returns store counters
message GetStatusResponse {
  StoreStatus status = 1;
}

// Managed model store
service StoreService {
  // Starts a pull task
  rpc Pull(PullRequest) returns (PullResponse);
  // Lists stored models
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  // Fetches one stored model
  rpc GetModel(GetModelRequest) returns (GetModelResponse);
  // Removes a stored model
  rpc RemoveModel(RemoveModelRequest) returns (RemoveModelResponse);
  // Collects unreferenced blobs
  rpc Gc(GcRequest) returns (GcResponse);
  // Starts a verify task
  rpc Verify(VerifyRequest) returns (VerifyResponse);
  // Returns store counters
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // Starts an export task
  rpc Export(ExportRequest) returns (ExportResponse);
}

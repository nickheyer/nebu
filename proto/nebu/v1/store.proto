syntax = "proto3";

package nebu.v1;

import "google/protobuf/timestamp.proto";
import "nebu/v1/model.proto";
import "nebu/v1/task.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// Artifact as stored, with its blob digest and link path
message StoredArtifact {
  Artifact artifact = 1;
  string digest = 2;
  string path = 3;
}

// One pulled weight group and its attached files
message StoredModel {
  string source_id = 1;
  string repo = 2;
  string revision = 3;
  string commit = 4;
  string group = 5;
  string format_id = 6;
  repeated StoredArtifact artifacts = 7;
  Descriptor descriptor = 8;
  uint64 bytes = 9;
  google.protobuf.Timestamp pulled_at = 10;
  string path = 11;
  // Last time a run started from it, what eviction orders by
  google.protobuf.Timestamp used_at = 12;
  // The runtimes that serve this group, one bit per runtime as Runtime.bit numbers them, from its format and what its headers say it is
  uint32 runtimes = 13;
}

// Store wide counters
message StoreStatus {
  string path = 1;
  uint64 models = 2;
  uint64 blobs = 3;
  uint64 blob_bytes = 4;
  uint64 partials = 5;
  uint64 partial_bytes = 6;
  // Blob bytes the store keeps under by evicting, 0 for no cap
  uint64 max_bytes = 7;
}

// Pulls one weight group into the store
message PullRequest {
  string source_id = 1;
  string repo = 2;
  string revision = 3;
  string group = 4;
}

// Returns the pull task
message PullResponse {
  Task task = 1;
}

// Lists stored models
message ListModelsRequest {}

// Returns stored models
message ListModelsResponse {
  repeated StoredModel models = 1;
}

// Fetches one stored model
message GetModelRequest {
  string source_id = 1;
  string repo = 2;
  string group = 3;
}

// Returns one stored model
message GetModelResponse {
  StoredModel model = 1;
}

// Removes a stored model and optionally collects blobs
message RemoveModelRequest {
  string source_id = 1;
  string repo = 2;
  string group = 3;
  bool gc = 4;
}

// Returns the removed model and any collection result
message RemoveModelResponse {
  StoredModel model = 1;
  GcResponse gc = 2;
}

// Collects unreferenced blobs
message GcRequest {
  bool partials = 1;
}

// Returns collection counts
message GcResponse {
  uint32 removed = 1;
  uint64 freed_bytes = 2;
}

// Rehashes stored blobs, optionally for one model
message VerifyRequest {
  string source_id = 1;
  string repo = 2;
  string group = 3;
}

// Returns the verify task
message VerifyResponse {
  Task task = 1;
}

// Copies a stored model into a mirror layout
message ExportRequest {
  string source_id = 1;
  string repo = 2;
  string group = 3;
  string dir = 4;
}

// Returns the export task
message ExportResponse {
  Task task = 1;
}

// Asks for store counters
message GetStatusRequest {}

// Returns store counters
message GetStatusResponse {
  StoreStatus status = 1;
}

// Managed model store
service StoreService {
  // Starts a pull task
  rpc Pull(PullRequest) returns (PullResponse);
  // Lists stored models
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  // Fetches one stored model
  rpc GetModel(GetModelRequest) returns (GetModelResponse);
  // Removes a stored model
  rpc RemoveModel(RemoveModelRequest) returns (RemoveModelResponse);
  // Collects unreferenced blobs
  rpc Gc(GcRequest) returns (GcResponse);
  // Starts a verify task
  rpc Verify(VerifyRequest) returns (VerifyResponse);
  // Returns store counters
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // Starts an export task
  rpc Export(ExportRequest) returns (ExportResponse);
}

syntax = "proto3";

package nebu.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "nebu/v1/task.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// Where build steps run
enum SandboxKind {
  SANDBOX_KIND_UNSPECIFIED = 0;
  SANDBOX_KIND_HOST = 1;
  SANDBOX_KIND_OCI = 2;
}

// Lifecycle of a build
enum BuildState {
  BUILD_STATE_UNSPECIFIED = 0;
  BUILD_STATE_RUNNING = 1;
  BUILD_STATE_SUCCEEDED = 2;
  BUILD_STATE_FAILED = 3;
}

// Build variant selected for the host.
message Variant {
  string id = 1;
  string description = 2;
  // Additional tools required by this variant.
  repeated string tools = 3;
  // Host requirements. Empty when unrestricted.
  string requires = 4;
  // Variant settings for this host. Empty when unsupported.
  map<string, string> vars = 5;
}

// Configurable build variable.
message Var {
  string name = 1;
  string default = 2;
  string description = 3;
  // Allowed values. Empty when unrestricted.
  repeated string choices = 4;
  // Variable description.
  string label = 5;
}

// One source patch, a recipe's applied before its steps or a build's own applied after the recipe's
message Patch {
  string id = 1;
  string description = 2;
  // Where the unified diff is fetched from
  string url = 3;
  // The unified diff itself, in place of a URL, which a recipe's own patch leaves out of its description
  string content = 4;
  // Leading path components stripped from the diff's paths, one when zero
  uint32 strip = 5;
}

// One command a build runs in its sandbox. Every word, the script and every environment value is a template over the
// build: {{.Src}}, {{.Out}} and {{.Root}} are the source tree, the output directory and the build's own directory,
// {{.Jobs}} the parallel jobs, {{.Ref}}, {{.Commit}} and {{.Variant}} what is built, and {{.Vars.name}} a variable
message BuildStep {
  string name = 1;
  // The words of the command, run without a shell, a word whose template renders empty left out
  repeated string command = 2;
  // A script sh runs, in place of a command
  string script = 3;
  // Environment variables the step sets over the build's
  map<string, string> env = 4;
  // Working directory relative to the source tree, the tree itself when empty
  string dir = 5;
}

// Build recipe.
message Recipe {
  string id = 1;
  string runtime_id = 2;
  string description = 3;
  // Source description.
  string source = 4;
  repeated string tools = 5;
  repeated Variant variants = 6;
  SandboxKind sandbox = 7;
  // Container CLIs tried in order for the oci sandbox
  repeated string sandbox_clis = 8;
  // Build variables and defaults.
  repeated Var vars = 9;
  uint32 timeout_ms = 10;
  // Source patches a build applies in order unless it leaves them out
  repeated Patch patches = 11;
}

// One build of a recipe on this host
message Build {
  string id = 1;
  string recipe_id = 2;
  string runtime_id = 3;
  string variant = 4;
  string ref = 5;
  string commit = 6;
  SandboxKind sandbox = 7;
  string image = 8;
  string dir = 9;
  string binary = 10;
  string install_id = 11;
  string task_id = 12;
  BuildState state = 13;
  string error = 14;
  map<string, string> vars = 15;
  map<string, string> facts = 16;
  repeated string patches = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp finished_at = 19;
  // The request the build was made from, with everything it set in place of the recipe's
  BuildRequest request = 20;
}

// Recipe with its selected host variant.
message RecipeStatus {
  Recipe recipe = 1;
  string variant = 2;
  repeated string missing_tools = 3;
  SandboxKind sandbox = 4;
  string sandbox_cli = 5;
  repeated string unmet = 6;
  map<string, string> vars = 7;
  // Missing tools required by build variants.
  repeated string absent_tools = 8;
}

// Lists recipes, optionally for one runtime
message ListRecipesRequest {
  string runtime_id = 1;
}

// Returns recipes with host selection
message ListRecipesResponse {
  repeated RecipeStatus recipes = 1;
}

// Builds a runtime from a recipe
message BuildRequest {
  option (buf.validate.message).cel = {
    id: "runtime_or_recipe"
    message: "a runtime id or a recipe id is required"
    expression: "this.runtime_id != '' || this.recipe_id != ''"
  };
  string runtime_id = 1;
  string recipe_id = 2;
  string variant = 3;
  map<string, string> vars = 4;
  SandboxKind sandbox = 5;
  string image = 6;
  bool force = 7;
  // A tag, branch, commit, or any other ref of the source, such as refs/pull/123/head
  string ref = 8;
  // Recipe patches the build leaves out, by id
  repeated string skip_patches = 9;
  // A git repository cloned at the ref in place of the recipe's source, a URL or a GitHub owner/name
  string repo = 10;
  // Steps run in order in place of the recipe's
  repeated BuildStep steps = 11;
  // Environment variables every step runs with, each value a template as a step's are
  map<string, string> env = 12;
  // Paths under the source tree copied into the output directory after the steps, globs allowed, in place of the recipe's
  repeated string outputs = 13;
  // The installed binary relative to the output directory, in place of the recipe's
  string binary = 14;
  // Unified diffs applied to the source after the recipe's patches, each by its URL or its content
  repeated Patch patches = 15;
  // Longest the build may run, the recipe's own limit when zero
  uint32 timeout_ms = 16;
}

// Asks what a build request would run, building nothing
message PreviewBuildRequest {
  BuildRequest build = 1 [(buf.validate.field).required = true];
}

// What a build request resolves to
message PreviewBuildResponse {
  // The build as it would be recorded, or the one already made when this exact build exists
  Build build = 1;
  // The steps in order, the recipe's for the chosen variant and variables unless the request gave its own, in the form a request sends back
  repeated BuildStep steps = 2;
  // Paths under the source tree copied into the output directory after the steps
  repeated string outputs = 3;
  // The installed binary relative to the output directory
  string binary = 4;
  // Where the source comes from
  string source = 5;
  uint32 timeout_ms = 6;
}

// Returns the build record and its task
message BuildResponse {
  Build build = 1;
  Task task = 2;
}

// Lists builds, optionally for one runtime, the ones whose recipe, variant, ref, commit, or error holds every word of the query
message ListBuildsRequest {
  string runtime_id = 1;
  string query = 2 [(buf.validate.field).string.max_len = 256];
  string cursor = 3;
  uint32 limit = 4 [(buf.validate.field).uint32.lte = 1000];
}

// Returns builds newest first
message ListBuildsResponse {
  repeated Build builds = 1;
  string next_cursor = 2;
}

// Fetches one build
message GetBuildRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// Returns one build
message GetBuildResponse {
  Build build = 1;
}

// Removes a build and its tree
message RemoveBuildRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// Returns the removed build
message RemoveBuildResponse {
  Build build = 1;
}

// Recipes and builds
service BuildService {
  // Lists recipes with the variant the host selects
  rpc ListRecipes(ListRecipesRequest) returns (ListRecipesResponse);
  // Starts or reuses a build
  rpc Build(BuildRequest) returns (BuildResponse);
  // Resolves a build request to its ref, steps and outputs without building
  rpc PreviewBuild(PreviewBuildRequest) returns (PreviewBuildResponse);
  // Lists builds
  rpc ListBuilds(ListBuildsRequest) returns (ListBuildsResponse);
  // Fetches one build
  rpc GetBuild(GetBuildRequest) returns (GetBuildResponse);
  // Removes a build
  rpc RemoveBuild(RemoveBuildRequest) returns (RemoveBuildResponse);
}

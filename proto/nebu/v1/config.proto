syntax = "proto3";

package nebu.v1;

import "buf/validate/validate.proto";
import "nebu/v1/gateway.proto";
import "nebu/v1/recipe.proto";
import "nebu/v1/source.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// Logging settings
message Logging {
  string level = 1;
  string format = 2;
  string file = 3;
}

// Weekly transfer-limit window.
message TransferWindow {
  // Days or ranges, such as mon-fri or sat,sun. Empty means every day.
  string days = 1;
  // Local times as HH:MM. A start after the end crosses midnight.
  string from = 2;
  string to = 3;
  // Bytes per second inside the window, 0 for no limit
  uint64 max_bytes_per_second = 4;
  // Pause downloads during this window.
  bool pause = 5;
}

// Download tuning
message Transfer {
  uint32 workers = 1;
  uint64 chunk_bytes = 2;
  uint32 retries = 3;
  uint64 max_bytes_per_second = 4;
  // Use the first matching window, otherwise max_bytes_per_second.
  repeated TransferWindow windows = 5;
}

// Store limits
message Store {
  // Blob storage limit in bytes. Evict unused models before downloads. Zero disables the limit.
  uint64 max_bytes = 1;
}

// Queueing, shedding and saturation thresholds of the gateway's flow control
message FlowControl {
  // Requests a pool holds queued across its bands before a lower band is displaced or the arrival refused
  uint32 queue_capacity = 1 [(buf.validate.field).uint32.gte = 1];
  // Longest wait in a queue before the request is refused
  uint32 queue_timeout_ms = 2 [(buf.validate.field).uint32.gte = 1];
  // Bands at or below this priority are shed instead of queued under saturation
  int32 sheddable_below = 3 [(buf.validate.field).int32 = {
    gte: -1001
    lte: 1000
  }];
  // Requests waiting on an endpoint at which it counts as saturated
  uint32 saturation_queue_depth = 4 [(buf.validate.field).uint32.gte = 1];
  // KV cache utilization from zero to one at which an endpoint counts as saturated
  double saturation_kv_utilization = 5 [(buf.validate.field).double = {
    gt: 0
    lte: 1
  }];
  // Age past which scraped endpoint metrics no longer count
  uint32 metrics_staleness_ms = 6 [(buf.validate.field).uint32.gte = 1];
  // The quota of every fairness id without one of its own
  Quota quota = 7;
  // Quotas per fairness id, replacing the default
  map<string, Quota> quotas = 8;
}

// Tokens and requests one fairness id may use per window, zero limits meaning unlimited
message Quota {
  option (buf.validate.message).cel = {
    id: "quota_window"
    message: "window_ms must be set when tokens or requests are limited"
    expression: "(this.tokens == 0u && this.requests == 0u) || this.window_ms > 0u"
  };
  uint64 tokens = 1;
  uint64 requests = 2;
  uint32 window_ms = 3;
}

// OpenAI compatible gateway settings
message Gateway {
  string listen = 1;
  repeated string api_keys = 2;
  reserved 3;
  uint32 drain_timeout_ms = 4;
  // Default route limits, overridable by slot.
  Policy policy = 5;
  // Allowed browser origins. Empty allows any origin.
  repeated string cors_origins = 6;
  FlowControl flow_control = 7;
  // How long persisted request traces are kept, such as 168h
  string trace_retention = 8 [(buf.validate.field).string.min_len = 1];
  // Recent traces kept in memory for listing
  uint32 trace_ring = 9 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1000000
  }];
  // Output tokens counted for a request that sets no bound
  uint32 default_output_tokens = 10 [(buf.validate.field).uint32.gte = 1];
  // Path of a YAML document ordering the request control plugins, the built in chain when empty
  string request_chain = 11;
}

// OpenTelemetry tracing of gateway requests
message Telemetry {
  // Host and port of an OTLP HTTP collector, spans kept in memory alone when empty
  string endpoint = 1;
  // Sends plain HTTP to the collector instead of HTTPS
  bool insecure = 2;
  // Fraction of requests traced, from zero to one
  double sample_ratio = 3 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
}

// A listener serving metrics, liveness and readiness alone
message Metrics {
  // Address the listener binds, none when empty
  string listen = 1;
}

// External failure notifications.
message Notify {
  // URLs that receive one JSON document per failed instance
  repeated string webhooks = 1;
}

// TLS for the API, gateway and metrics listeners when enabled, the pair generated in data_dir when unset
message Tls {
  string cert_file = 1;
  string key_file = 2;
  bool enabled = 3;
}

// Single sign-on through an OpenID Connect provider. Any provider with a
// discovery document works: Google, Microsoft Entra ID, Okta, Auth0, Keycloak,
// Authentik, Authelia, Zitadel, Kanidm, Pocket ID, Dex, GitLab, Cognito.
message Oidc {
  // Issuer URL. Discovery reads <issuer>/.well-known/openid-configuration.
  string issuer = 1;
  string client_id = 2;
  string client_secret = 3;
  reserved 4;
  // Scopes to request. openid, profile, and email when empty.
  repeated string scopes = 5;
  // Origin browsers reach the daemon at, such as https://nebu.example.com.
  // Builds the callback URL. Each request's own scheme and host when empty.
  string public_url = 6;
  // Provider name shown on the sign-in button. The issuer host when empty.
  string name = 7;
  // Who may sign in. Everyone the provider signs in when all three are empty.
  // An email or domain match admits the user, and allowed_groups must match as well when set.
  repeated string allowed_emails = 8;
  repeated string allowed_domains = 9;
  repeated string allowed_groups = 10;
  // Claim listing the user's groups, dotted for nested claims such as realm_access.roles. groups when empty.
  string groups_claim = 11;
  // Groups whose members sign in as admins, then as operators. Everyone else signs in with the inference role
  repeated string admin_groups = 12;
  repeated string operator_groups = 13;
}

// API listener and web UI authentication. On by default: browsers sign in with a
// local account, or through oidc when set, and API clients send the bearer token.
message Auth {
  // Bearer token for API clients. Generated into <data_dir>/api.token when empty.
  string token = 1;
  reserved 2;
  // Single sign-on. Replaces local accounts when set.
  Oidc oidc = 3;
  // Turns authentication off: no accounts, no single sign-on, and no token check.
  bool disabled = 4;
  // Browser session lifetime such as 24h or 30m. 24h when empty.
  string session_ttl = 5;
  // Proxy addresses as CIDRs whose X-Forwarded-For, X-Forwarded-Proto, and X-Forwarded-Host
  // headers are believed. Requests from other addresses are read as they arrive.
  repeated string trusted_proxies = 6;
}

// Build defaults
message Builds {
  SandboxKind sandbox = 1;
  string image = 2;
  repeated string cli = 3;
  uint32 jobs = 4;
  string dir = 5;
}

// Embedded web UI settings
message Web {
  bool disabled = 1;
}

// Discord bot settings shared by every bot
message Discord {
  // ffmpeg path for sampling video attachments. Empty searches PATH.
  string ffmpeg = 1;
}

// Mesh membership settings
message MeshConfig {
  // Address node traffic listens on, a second listener when the API listener stays on loopback
  string listen = 1;
  // The address this node tells other members, on the fastest link to them
  string advertise = 2;
  // Whether to send and hear multicast beacons. On when unset.
  optional bool announce = 3;
  // guard, a forwarder in front of seats other seats connect to, or direct, the seat on the mesh address itself
  string exposure = 4;
  // Ports seats, guards, and rendezvous take on the mesh address, as from-to, for a host behind a port map
  string ports = 5;
  // full, every member syncing with a log fan-out of the others, hub, or spoke, syncing with the hubs alone
  string topology = 6 [(buf.validate.field).string = {in: ["", "full", "hub", "spoke"]}];
  // Members spokes sync with, by id or name
  repeated string hubs = 7;
  // push-pull, push, or pull, what a sync carries and takes
  string sync = 8 [(buf.validate.field).string = {in: ["", "push-pull", "push", "pull"]}];
  // endpoint, routing straight to exported endpoints the exporter's scheduler picks, or parent, through the exporter's gateway
  string routing_mode = 9 [(buf.validate.field).string = {in: ["", "endpoint", "parent"]}];
  // Routing mode per imported pool id, over routing_mode
  map<string, string> import_routing = 10 [(buf.validate.field).map.values.string = {in: ["endpoint", "parent"]}];
}

// The out of process scheduler listener this daemon serves its schedulers on
message Scheduler {
  // Address the scheduler listener binds, none when empty
  string listen = 1;
}

// Daemon and client configuration
message Config {
  reserved 5, 14;
  string listen = 1;
  string addr = 2;
  string data_dir = 3;
  string cache_dir = 4;
  repeated Source sources = 6;
  Logging logging = 7;
  repeated uint32 contexts = 8;
  uint64 min_free_bytes = 9;
  string store_dir = 10;
  Transfer transfer = 11;
  Gateway gateway = 12;
  Auth auth = 13;
  Builds builds = 15;
  Web web = 16;
  Store store = 17;
  Tls tls = 18;
  Notify notify = 19;
  Discord discord = 20;
  MeshConfig mesh = 21;
  Telemetry telemetry = 22;
  Metrics metrics = 23;
  Scheduler scheduler = 24;
}

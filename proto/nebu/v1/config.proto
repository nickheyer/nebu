syntax = "proto3";

package nebu.v1;

import "nebu/v1/gateway.proto";
import "nebu/v1/recipe.proto";
import "nebu/v1/source.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// Logging settings
message Logging {
  string level = 1;
  string format = 2;
  string file = 3;
}

// A span of the week with its own transfer limit
message TransferWindow {
  // Day names or ranges such as mon-fri or sat,sun, every day when empty
  string days = 1;
  // Local clock times as HH:MM, a from after to wraps past midnight
  string from = 2;
  string to = 3;
  // Bytes per second inside the window, 0 for no limit
  uint64 max_bytes_per_second = 4;
  // Holds downloads inside the window
  bool pause = 5;
}

// Download tuning
message Transfer {
  uint32 workers = 1;
  uint64 chunk_bytes = 2;
  uint32 retries = 3;
  uint64 max_bytes_per_second = 4;
  // Spans with their own limit, the first that holds wins, else max_bytes_per_second
  repeated TransferWindow windows = 5;
}

// Store limits
message Store {
  // Blob bytes the store keeps under by evicting unused models before a pull, 0 for no cap
  uint64 max_bytes = 1;
}

// OpenAI compatible gateway settings
message Gateway {
  string listen = 1;
  repeated string api_keys = 2;
  string api_key_env = 3;
  uint32 drain_timeout_ms = 4;
  // Limits every route enforces unless its slot says otherwise
  Policy policy = 5;
  // Origins browsers may call the gateway from, any when empty
  repeated string cors_origins = 6;
}

// Where failures are announced beyond the UI
message Notify {
  // URLs that receive one JSON document per failed instance
  repeated string webhooks = 1;
}

// Certificate for the API and gateway listeners, plain HTTP when unset
message Tls {
  string cert_file = 1;
  string key_file = 2;
}

// Bearer token required on the API listener when set
message Auth {
  string token = 1;
  string token_env = 2;
}

// Build defaults
message Builds {
  SandboxKind sandbox = 1;
  string image = 2;
  repeated string cli = 3;
  uint32 jobs = 4;
  string dir = 5;
}

// Embedded web UI settings
message Web {
  bool disabled = 1;
}

// Discord bot settings shared by every bot
message Discord {
  // The ffmpeg binary that samples frames from video attachments, found on PATH when empty
  string ffmpeg = 1;
}

// Daemon and client configuration
message Config {
  string listen = 1;
  string addr = 2;
  string data_dir = 3;
  string cache_dir = 4;
  repeated Source sources = 6;
  Logging logging = 7;
  repeated uint32 contexts = 8;
  uint64 min_free_bytes = 9;
  string store_dir = 10;
  Transfer transfer = 11;
  Gateway gateway = 12;
  Auth auth = 13;
  Builds builds = 15;
  Web web = 16;
  Store store = 17;
  Tls tls = 18;
  Notify notify = 19;
  Discord discord = 20;
}

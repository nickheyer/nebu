syntax = "proto3";

package nebu.v1;

import "google/protobuf/timestamp.proto";
import "nebu/v1/model.proto";
import "nebu/v1/recipe.proto";
import "nebu/v1/source.proto";
import "nebu/v1/task.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// Value type of a runtime parameter
enum ParamType {
  PARAM_TYPE_UNSPECIFIED = 0;
  PARAM_TYPE_STRING = 1;
  PARAM_TYPE_INT = 2;
  PARAM_TYPE_FLOAT = 3;
  PARAM_TYPE_BOOL = 4;
  PARAM_TYPE_PATH = 5;
}

// Instance and gateway wire protocols.
enum ApiFlavor {
  API_FLAVOR_UNSPECIFIED = 0;
  API_FLAVOR_OPENAI = 1;
  API_FLAVOR_ANTHROPIC = 2;
  API_FLAVOR_OLLAMA = 3;
  API_FLAVOR_SDCPP = 4;
}

// How an install was obtained
enum InstallKind {
  INSTALL_KIND_UNSPECIFIED = 0;
  INSTALL_KIND_ADOPTED = 1;
  INSTALL_KIND_PREBUILT = 2;
  INSTALL_KIND_BUILT = 3;
}

// Runtime parameter with metadata for rendering its form control.
message Param {
  string name = 1;
  ParamType type = 2;
  string default = 3;
  string description = 4;
  repeated string choices = 5;
  string flag = 6;
  string env = 7;
  // The planner chooses the value at launch when set to auto.
  bool solved = 8;
  // Display label.
  string label = 9;
  // Display unit, such as tokens or threads.
  string unit = 10;
  // Bounds and step for INT and FLOAT params, zero when unbounded
  double min = 11;
  double max = 12;
  double step = 13;
  // Form section heading.
  string group = 14;
  // Hidden until the form is expanded
  bool advanced = 15;
  // Description of the automatic value.
  string rule = 16;
  // Stored component architecture, such as vae or t5. Use model to accept any weights.
  string picks = 17;
  // Blueprint slots the parameter fills, so a pipeline group bundling one of them supplies the part.
  repeated string slots = 18;
  // The parameter names a directory of stored parts rather than one file.
  bool directory = 19;
}

// Runtime installation method.
message InstallMethod {
  string id = 1;
  string description = 2;
  // Adopt a local binary, download a release, or build a recipe.
  InstallKind kind = 3;
  // Binary names to search on PATH when adopting.
  repeated string binaries = 4;
  // Release repository for downloads.
  string releases = 5;
  // Recipe for source builds.
  string recipe_id = 6;
}

// Installation method with host-specific settings and defaults.
message InstallOption {
  InstallMethod method = 1;
  repeated ConfigField fields = 2;
  // Reason the defaults cannot run on this host. Empty when supported.
  repeated string unmet = 3;
  // Recipe and selected variant for source builds.
  RecipeStatus recipe = 4;
}

// A usable copy of a runtime
message Install {
  string id = 1;
  string runtime_id = 2;
  InstallKind kind = 3;
  string path = 4;
  string dir = 5;
  string version = 6;
  string origin = 7;
  map<string, string> facts = 8;
  google.protobuf.Timestamp created_at = 9;
  string build_id = 10;
}

// Runtime definition.
message Runtime {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string formats = 4;
  ApiFlavor api = 5;
  // Host requirements.
  repeated string requirements = 6;
  repeated InstallMethod methods = 7;
  repeated Param params = 8;
  ModelKind kind = 9;
  // Bit assigned to this runtime in catalog and stored-model runtime masks.
  uint32 bit = 10;
}

// Lists formats
message ListFormatsRequest {}

// Returns formats in priority order
message ListFormatsResponse {
  repeated Format formats = 1;
}

// Lists known runtimes
message ListRuntimesRequest {}

// Returns known runtimes with constraint results
message ListRuntimesResponse {
  repeated RuntimeStatus runtimes = 1;
}

// Runtime compatibility and available installation methods.
message RuntimeStatus {
  Runtime runtime = 1;
  bool compatible = 2;
  repeated string unmet = 3;
  repeated InstallOption installs = 4;
}

// Fetches one runtime
message GetRuntimeRequest {
  string id = 1;
}

// Returns one runtime
message GetRuntimeResponse {
  RuntimeStatus runtime = 1;
}

// Lists installs, optionally for one runtime
message ListInstallsRequest {
  string runtime_id = 1;
}

// Returns installs newest first
message ListInstallsResponse {
  repeated Install installs = 1;
}

// Adopts a binary already on the host
message AdoptInstallRequest {
  string runtime_id = 1;
  string path = 2;
}

// Returns the adopted install
message AdoptInstallResponse {
  Install install = 1;
}

// Install a runtime using the selected method and settings.
message InstallRequest {
  string runtime_id = 1;
  string method = 2;
  // Installation settings. Omitted fields use defaults.
  map<string, string> settings = 3;
}

// Returns the install task
message InstallResponse {
  Task task = 1;
}

// Removes an install record and its downloaded files
message RemoveInstallRequest {
  string id = 1;
}

// Returns the removed install
message RemoveInstallResponse {
  Install install = 1;
}

// Runtime catalog and installs
service RuntimeService {
  // List supported formats and their descriptions.
  rpc ListFormats(ListFormatsRequest) returns (ListFormatsResponse);
  // Lists runtimes and host compatibility
  rpc ListRuntimes(ListRuntimesRequest) returns (ListRuntimesResponse);
  // Fetches one runtime by id
  rpc GetRuntime(GetRuntimeRequest) returns (GetRuntimeResponse);
  // Lists installs
  rpc ListInstalls(ListInstallsRequest) returns (ListInstallsResponse);
  // Adopts a binary on the host
  rpc AdoptInstall(AdoptInstallRequest) returns (AdoptInstallResponse);
  // Start an installation task with the selected method and settings.
  rpc Install(InstallRequest) returns (InstallResponse);
  // Removes an install
  rpc RemoveInstall(RemoveInstallRequest) returns (RemoveInstallResponse);
}

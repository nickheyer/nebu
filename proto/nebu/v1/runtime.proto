syntax = "proto3";

package nebu.v1;

import "google/protobuf/timestamp.proto";
import "nebu/v1/model.proto";
import "nebu/v1/recipe.proto";
import "nebu/v1/source.proto";
import "nebu/v1/task.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// Value type of a runtime parameter
enum ParamType {
  PARAM_TYPE_UNSPECIFIED = 0;
  PARAM_TYPE_STRING = 1;
  PARAM_TYPE_INT = 2;
  PARAM_TYPE_FLOAT = 3;
  PARAM_TYPE_BOOL = 4;
}

// Wire protocol an instance speaks, and the ones the gateway answers in
enum ApiFlavor {
  API_FLAVOR_UNSPECIFIED = 0;
  API_FLAVOR_OPENAI = 1;
  API_FLAVOR_ANTHROPIC = 2;
  API_FLAVOR_OLLAMA = 3;
}

// How an install was obtained
enum InstallKind {
  INSTALL_KIND_UNSPECIFIED = 0;
  INSTALL_KIND_ADOPTED = 1;
  INSTALL_KIND_PREBUILT = 2;
  INSTALL_KIND_BUILT = 3;
}

// One tunable knob of a runtime
//
// The form fields carry what a client needs to render a control without
// knowing the runtime: a label, a unit, bounds and a step for numbers, the
// section the param sits in, and whether it is folded away by default.
message Param {
  string name = 1;
  ParamType type = 2;
  string default = 3;
  string description = 4;
  repeated string choices = 5;
  string flag = 6;
  string env = 7;
  // The memory planner picks the value at launch while it is left at auto
  bool solved = 8;
  // Shown in place of the name
  string label = 9;
  // Shown beside the control, such as tokens or threads
  string unit = 10;
  // Bounds and step for INT and FLOAT params, zero when unbounded
  double min = 11;
  double max = 12;
  double step = 13;
  // Section heading the param is listed under
  string group = 14;
  // Hidden until the form is expanded
  bool advanced = 15;
}

// One way to obtain an install, offered when someone installs the runtime
message InstallMethod {
  string id = 1;
  string description = 2;
  // What the method does: adopt a binary on the host, download a published release, or build a recipe
  InstallKind kind = 3;
  // The binaries looked for on PATH, for an adopted install
  repeated string binaries = 4;
  // The repository releases come from, for a downloaded install
  string releases = 5;
  // The recipe built, for a built install
  string recipe_id = 6;
}

// A method as this host sees it: the settings it takes, defaults picked for this host
message InstallOption {
  InstallMethod method = 1;
  repeated ConfigField fields = 2;
  // What keeps the default settings from running here, empty when nothing does
  repeated string unmet = 3;
  // The recipe with what the host selects, for a recipe method
  RecipeStatus recipe = 4;
}

// A usable copy of a runtime
message Install {
  string id = 1;
  string runtime_id = 2;
  InstallKind kind = 3;
  string path = 4;
  string dir = 5;
  string version = 6;
  string origin = 7;
  map<string, string> facts = 8;
  google.protobuf.Timestamp created_at = 9;
  string build_id = 10;
}

// A runtime as the API describes it
message Runtime {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string formats = 4;
  ApiFlavor api = 5;
  // What the host must have, in words
  repeated string requirements = 6;
  repeated InstallMethod methods = 7;
  repeated Param params = 8;
}

// Lists formats
message ListFormatsRequest {}

// Returns formats in priority order
message ListFormatsResponse {
  repeated Format formats = 1;
}

// Lists known runtimes
message ListRuntimesRequest {}

// Returns known runtimes with constraint results
message ListRuntimesResponse {
  repeated RuntimeStatus runtimes = 1;
}

// Runtime paired with host compatibility and how it installs here
message RuntimeStatus {
  Runtime runtime = 1;
  bool compatible = 2;
  repeated string unmet = 3;
  repeated InstallOption installs = 4;
}

// Fetches one runtime
message GetRuntimeRequest {
  string id = 1;
}

// Returns one runtime
message GetRuntimeResponse {
  RuntimeStatus runtime = 1;
}

// Lists installs, optionally for one runtime
message ListInstallsRequest {
  string runtime_id = 1;
}

// Returns installs newest first
message ListInstallsResponse {
  repeated Install installs = 1;
}

// Adopts a binary already on the host
message AdoptInstallRequest {
  string runtime_id = 1;
  string path = 2;
}

// Returns the adopted install
message AdoptInstallResponse {
  Install install = 1;
}

// Installs a runtime by one of its methods with the settings chosen for it
message InstallRequest {
  string runtime_id = 1;
  string method = 2;
  // Values for the method's fields, a field left out taking its default
  map<string, string> settings = 3;
}

// Returns the install task
message InstallResponse {
  Task task = 1;
}

// Removes an install record and its downloaded files
message RemoveInstallRequest {
  string id = 1;
}

// Returns the removed install
message RemoveInstallResponse {
  Install install = 1;
}

// Runtime catalog and installs
service RuntimeService {
  // Lists the formats runtimes accept, with their words
  rpc ListFormats(ListFormatsRequest) returns (ListFormatsResponse);
  // Lists runtimes and host compatibility
  rpc ListRuntimes(ListRuntimesRequest) returns (ListRuntimesResponse);
  // Fetches one runtime by id
  rpc GetRuntime(GetRuntimeRequest) returns (GetRuntimeResponse);
  // Lists installs
  rpc ListInstalls(ListInstallsRequest) returns (ListInstallsResponse);
  // Adopts a binary on the host
  rpc AdoptInstall(AdoptInstallRequest) returns (AdoptInstallResponse);
  // Installs a runtime as a task by a method and its settings
  rpc Install(InstallRequest) returns (InstallResponse);
  // Removes an install
  rpc RemoveInstall(RemoveInstallRequest) returns (RemoveInstallResponse);
}

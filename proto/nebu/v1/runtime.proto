syntax = "proto3";

package nebu.v1;

import "google/protobuf/timestamp.proto";
import "nebu/v1/model.proto";
import "nebu/v1/host.proto";
import "nebu/v1/task.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// Value type of a runtime parameter
enum ParamType {
  PARAM_TYPE_UNSPECIFIED = 0;
  PARAM_TYPE_STRING = 1;
  PARAM_TYPE_INT = 2;
  PARAM_TYPE_FLOAT = 3;
  PARAM_TYPE_BOOL = 4;
}

// Wire protocol an instance speaks, and the ones the gateway answers in
enum ApiFlavor {
  API_FLAVOR_UNSPECIFIED = 0;
  API_FLAVOR_OPENAI = 1;
  API_FLAVOR_ANTHROPIC = 2;
  API_FLAVOR_OLLAMA = 3;
}

// How an install was obtained
enum InstallKind {
  INSTALL_KIND_UNSPECIFIED = 0;
  INSTALL_KIND_ADOPTED = 1;
  INSTALL_KIND_PREBUILT = 2;
  INSTALL_KIND_BUILT = 3;
}

// One tunable knob of a runtime
message Param {
  string name = 1;
  ParamType type = 2;
  string default = 3;
  string description = 4;
  repeated string choices = 5;
  string flag = 6;
  string env = 7;
  bool solved = 8;
}

// Host requirement expressed over probed facts
message Constraint {
  string expr = 1;
  string message = 2;
}

// Prebuilt release matched to host facts
//
// releases names the repository at the source named by source, the github
// default when empty. The newest release carrying an asset for every pattern
// in assets is installed, all of them unpacked into one directory.
message PrebuiltRule {
  string when = 1;
  string releases = 2;
  repeated string assets = 3;
  string binary = 4;
  string source = 5;
}

// Runs the binary once and captures named groups as facts
message CommandProbe {
  string key = 1;
  repeated string args = 2;
  string match = 3;
  uint32 timeout_ms = 4;
  string command = 5;
}

// Turns a stored group of one of the formats into what the runtime loads, once per group, before its first launch
message Prepare {
  repeated string formats = 1;
  string command = 2;
  repeated string args = 3;
  map<string, string> env = 4;
  uint32 timeout_ms = 5;
}

// A usable copy of a runtime
message Install {
  string id = 1;
  string runtime_id = 2;
  InstallKind kind = 3;
  string path = 4;
  string dir = 5;
  string version = 6;
  string origin = 7;
  map<string, string> facts = 8;
  google.protobuf.Timestamp created_at = 9;
  string build_id = 10;
}

// Ways to obtain an install
message Acquire {
  repeated string adopt = 1;
  repeated PrebuiltRule prebuilt = 2;
  string recipe_id = 3;
}

// Readiness probe of a running instance
message HealthCheck {
  string path = 1;
  uint32 interval_ms = 2;
  uint32 timeout_ms = 3;
}

// How to start and address an instance
message Launch {
  string command = 1;
  repeated string args = 2;
  map<string, string> env = 3;
  HealthCheck health = 4;
  ApiFlavor api = 5;
  uint32 stop_grace_ms = 6;
  Prepare prepare = 7;
}

// One log pattern with its hint
message TriageRule {
  string id = 1;
  string match = 2;
  string summary = 3;
  string hint = 4;
  map<string, string> fix = 5;
}

// Data driven set of failure patterns
message TriageSpec {
  string id = 1;
  string description = 2;
  repeated TriageRule rules = 3;
}

// Placement rule for one tensor group kind
message GroupPolicy {
  TensorGroupKind kind = 1;
  PoolKind pool = 2;
  string param = 3;
  bool param_counts_host = 4;
  uint32 spill_priority = 5;
  TensorGroupKind requires = 6;
}

// Memory planning rules for a runtime
//
// devices_param names the param holding how many devices a run spans, so
// device capacity is that many of the largest pools; empty means the
// runtime spreads over every device it sees.
message EstimatePolicy {
  repeated GroupPolicy groups = 1;
  string cache_bytes = 2;
  string overhead_bytes = 3;
  map<string, double> cache_element_bytes = 4;
  double margin = 5;
  string context_param = 6;
  string devices_param = 7;
}

// Extracts a measured allocation from a log line
message ReportRule {
  string match = 1;
  string key = 2;
  string unit = 3;
}

// Data driven runtime definition
message RuntimeManifest {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string formats = 4;
  repeated Constraint constraints = 5;
  Acquire acquire = 6;
  Launch launch = 7;
  repeated Param params = 8;
  EstimatePolicy estimate = 9;
  repeated string triage = 10;
  repeated ReportRule report = 11;
  repeated CommandProbe probes = 12;
}

// A named set of param values for one runtime, user data beside the seeded manifest
message Profile {
  string id = 1;
  string runtime_id = 2;
  string name = 3;
  string description = 4;
  map<string, string> params = 5;
  // Applies to every run of the runtime that names no profile
  bool default = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// Lists profiles, optionally for one runtime
message ListProfilesRequest {
  string runtime_id = 1;
}

// Returns profiles by runtime then name
message ListProfilesResponse {
  repeated Profile profiles = 1;
}

// Creates a profile, its id is assigned
message CreateProfileRequest {
  Profile profile = 1;
}

// Returns the new profile
message CreateProfileResponse {
  Profile profile = 1;
}

// Replaces the name, description, params, and default flag of a profile
message UpdateProfileRequest {
  Profile profile = 1;
}

// Returns the updated profile
message UpdateProfileResponse {
  Profile profile = 1;
}

// Removes a profile, refused while a watch, want, slot, or instance starts from it unless forced
message DeleteProfileRequest {
  string id = 1;
  // Clears every reference first, those fall back to the runtime's default profile
  bool force = 2;
}

// Returns the removed profile
message DeleteProfileResponse {
  Profile profile = 1;
}

// Lists format specs
message ListFormatsRequest {}

// Returns format specs in priority order
message ListFormatsResponse {
  repeated FormatSpec formats = 1;
}

// Lists known runtimes
message ListRuntimesRequest {}

// Returns known runtimes with constraint results
message ListRuntimesResponse {
  repeated RuntimeStatus runtimes = 1;
}

// Runtime paired with host compatibility
message RuntimeStatus {
  RuntimeManifest manifest = 1;
  bool compatible = 2;
  repeated string unmet = 3;
}

// Fetches one runtime
message GetRuntimeRequest {
  string id = 1;
}

// Returns one runtime
message GetRuntimeResponse {
  RuntimeStatus runtime = 1;
}

// Lists installs, optionally for one runtime
message ListInstallsRequest {
  string runtime_id = 1;
}

// Returns installs newest first
message ListInstallsResponse {
  repeated Install installs = 1;
}

// Adopts a binary already on the host
message AdoptInstallRequest {
  string runtime_id = 1;
  string path = 2;
}

// Returns the adopted install
message AdoptInstallResponse {
  Install install = 1;
}

// Downloads a prebuilt release matched to the host
message InstallPrebuiltRequest {
  string runtime_id = 1;
}

// Returns the install task
message InstallPrebuiltResponse {
  Task task = 1;
}

// Removes an install record and its downloaded files
message RemoveInstallRequest {
  string id = 1;
}

// Returns the removed install
message RemoveInstallResponse {
  Install install = 1;
}

// Runtime catalog and installs
service RuntimeService {
  // Lists the formats runtimes accept, with their words
  rpc ListFormats(ListFormatsRequest) returns (ListFormatsResponse);
  // Lists runtimes and host compatibility
  rpc ListRuntimes(ListRuntimesRequest) returns (ListRuntimesResponse);
  // Fetches one runtime by id
  rpc GetRuntime(GetRuntimeRequest) returns (GetRuntimeResponse);
  // Lists installs
  rpc ListInstalls(ListInstallsRequest) returns (ListInstallsResponse);
  // Adopts a binary on the host
  rpc AdoptInstall(AdoptInstallRequest) returns (AdoptInstallResponse);
  // Downloads a prebuilt release
  rpc InstallPrebuilt(InstallPrebuiltRequest) returns (InstallPrebuiltResponse);
  // Removes an install
  rpc RemoveInstall(RemoveInstallRequest) returns (RemoveInstallResponse);
  // Lists param profiles
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);
  // Creates a param profile
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  // Replaces a param profile
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // Removes a param profile
  rpc DeleteProfile(DeleteProfileRequest) returns (DeleteProfileResponse);
}

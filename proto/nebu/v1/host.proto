syntax = "proto3";

package nebu.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "nebu/v1/task.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// Classifies a probed compute device
enum DeviceKind {
  DEVICE_KIND_UNSPECIFIED = 0;
  DEVICE_KIND_GPU = 1;
  DEVICE_KIND_CPU = 2;
  DEVICE_KIND_ACCELERATOR = 3;
}

// Classifies a memory pool by locality
enum PoolKind {
  POOL_KIND_UNSPECIFIED = 0;
  POOL_KIND_DEVICE = 1;
  POOL_KIND_HOST = 2;
  POOL_KIND_UNIFIED = 3;
}

// Outcome of one probe run
enum ProbeStatus {
  PROBE_STATUS_UNSPECIFIED = 0;
  PROBE_STATUS_OK = 1;
  PROBE_STATUS_SKIPPED = 2;
  PROBE_STATUS_FAILED = 3;
}

// Probed compute device with vendor facts
message Device {
  string id = 1;
  DeviceKind kind = 2;
  string vendor = 3;
  string name = 4;
  uint64 memory_total_bytes = 5;
  uint64 memory_free_bytes = 6;
  map<string, string> facts = 7;
  // The pool the device draws on, the host pool for the CPU, an accelerator's own or the unified pool
  string pool_id = 8;
}

// Memory pool available to runtimes.
message MemoryPool {
  string id = 1;
  PoolKind kind = 2;
  string device_id = 3;
  uint64 total_bytes = 4;
  uint64 free_bytes = 5;
}

// Device memory one process holds as the host reports it, stamped with the live instance owning the pid
message ProcessUse {
  string device_id = 1;
  int32 pid = 2;
  uint64 bytes = 3;
  string instance_id = 4;
  string instance_name = 5;
  string command = 6;
}

// Filesystem holding nebu data, one entry per mount
message Storage {
  string path = 1;
  string filesystem = 2;
  uint64 total_bytes = 3;
  uint64 free_bytes = 4;
  repeated string uses = 5;
  // Bytes each use holds on this mount, keyed by use
  map<string, uint64> use_bytes = 6;
}

// Result of one probe
message ProbeResult {
  string probe_id = 1;
  ProbeStatus status = 2;
  string detail = 3;
}

// Probed host profile.
message HostProfile {
  string hostname = 1;
  string os = 2;
  string arch = 3;
  repeated Device devices = 4;
  repeated MemoryPool pools = 5;
  repeated Storage storage = 6;
  map<string, string> facts = 7;
  google.protobuf.Timestamp probed_at = 8;
  repeated ProbeResult probes = 9;
  // The daemon's home directory
  string home = 10;
  // Processes holding device memory at probe time
  repeated ProcessUse processes = 11;
}

// Asks for the host profile
message GetProfileRequest {
  bool refresh = 1;
}

// Returns the host profile
message GetProfileResponse {
  HostProfile profile = 1;
}

// Start a host probe and dependency check task.
message DoctorRequest {}

// Check task with one log line per check.
message DoctorResponse {
  Task task = 1;
}

// Read the last tail log lines and optionally follow new output.
message HostServiceLogsRequest {
  bool follow = 1;
  uint32 tail = 2 [(buf.validate.field).uint32.lte = 100000];
}

// Batch of daemon log lines
message HostServiceLogsResponse {
  repeated string lines = 1;
}

// Names a directory a file browser jumps to
enum DirPlaceKind {
  DIR_PLACE_KIND_UNSPECIFIED = 0;
  // The daemon's home directory
  DIR_PLACE_KIND_HOME = 1;
  // The directory holding the files of every stored model
  DIR_PLACE_KIND_STORE = 2;
  // The root of a filesystem or drive
  DIR_PLACE_KIND_VOLUME = 3;
}

// One entry of a directory on the host
message DirEntry {
  string name = 1;
  bool dir = 2;
  // Whether the file can be run
  bool executable = 3;
  uint64 size_bytes = 4;
  // Absolute path of the entry
  string path = 5;
}

// One directory on the way from a volume root down to a listed directory
message DirStep {
  string name = 1;
  string path = 2;
}

// A directory a file browser jumps to
message DirPlace {
  DirPlaceKind kind = 1;
  string path = 2;
}

// Lists a host directory, a file path as the directory holding it and a store reference as the directory of its group
message ListDirectoryRequest {
  string path = 1 [(buf.validate.field).string.max_len = 4096];
  // The place an empty path lists, home when unset
  DirPlaceKind start = 2 [(buf.validate.field).enum = {
    in: [
      0,
      1,
      2
    ]
  }];
  // Lists the nearest directory above a path that cannot be listed, the start place when none can
  bool nearest = 3;
}

// Resolved directory with its entries sorted by name, directories first
message ListDirectoryResponse {
  string path = 1;
  // Empty at the root
  string parent = 2;
  repeated DirEntry entries = 3;
  // Every directory from the volume root down to path
  repeated DirStep trail = 4;
  // The store, home and every volume root
  repeated DirPlace places = 5;
}

// Host probing and diagnostics
service HostService {
  // Returns cached or refreshed host profile
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  // Start a host probe and dependency check task.
  rpc Doctor(DoctorRequest) returns (DoctorResponse);
  // Stream the daemon log.
  rpc Logs(HostServiceLogsRequest) returns (stream HostServiceLogsResponse);
  // Lists a directory on the host, for picking a file
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);
}

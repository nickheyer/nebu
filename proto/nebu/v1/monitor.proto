syntax = "proto3";

package nebu.v1;

import "google/protobuf/timestamp.proto";
import "nebu/v1/source.proto";
import "nebu/v1/task.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// What a check found
enum FindingKind {
  FINDING_KIND_UNSPECIFIED = 0;
  FINDING_KIND_NEW_REVISION = 1;
  FINDING_KIND_NEW_GROUP = 2;
  FINDING_KIND_REMOVED_GROUP = 3;
  FINDING_KIND_WANTED_FOUND = 4;
}

// A repository watched for new revisions and weight groups
message Watch {
  string id = 1;
  string source_id = 2;
  string repo = 3;
  string revision = 4;
  string group_match = 5;
  bool auto_pull = 6;
  string slot_id = 7;
  string runtime_id = 8;
  map<string, string> params = 9;
  string last_commit = 10;
  repeated string known_groups = 11;
  google.protobuf.Timestamp checked_at = 12;
  google.protobuf.Timestamp created_at = 13;
  string error = 14;
  string profile_id = 15;
}

// One change a check noticed
message Finding {
  string id = 1;
  string watch_id = 2;
  FindingKind kind = 3;
  string repo = 4;
  string commit = 5;
  string group = 6;
  string detail = 7;
  string task_id = 8;
  bool acknowledged = 9;
  google.protobuf.Timestamp found_at = 10;
  // The want that found it, when no watch did
  string want_id = 11;
  string source_id = 12;
  // The swap the pull led to, when a slot took it
  string swap_task_id = 13;
}

// A standing search across sources, satisfied once a matching weight group turns up
message Want {
  string id = 1;
  string query = 2;
  // Narrow to one provider, every source when unspecified
  SourceKind kind = 3;
  // Narrow to one source
  string source_id = 4;
  string group_match = 5;
  string format_id = 6;
  bool auto_pull = 7;
  string slot_id = 8;
  string runtime_id = 9;
  map<string, string> params = 10;
  string profile_id = 11;
  string found_source_id = 12;
  string found_repo = 13;
  string found_group = 14;
  string task_id = 15;
  bool satisfied = 16;
  google.protobuf.Timestamp checked_at = 17;
  google.protobuf.Timestamp created_at = 18;
  string error = 19;
  // The swap the pull led to, when a slot took it
  string swap_task_id = 20;
}

// Starts wanting a model
message AddWantRequest {
  string query = 1;
  SourceKind kind = 2;
  string source_id = 3;
  string group_match = 4;
  string format_id = 5;
  bool auto_pull = 6;
  string slot_id = 7;
  string runtime_id = 8;
  map<string, string> params = 9;
  string profile_id = 10;
}

// Returns the want after its first check
message AddWantResponse {
  Want want = 1;
}

// Lists wants
message ListWantsRequest {}

// Returns wants oldest first
message ListWantsResponse {
  repeated Want wants = 1;
}

// Stops wanting
message RemoveWantRequest {
  string id = 1;
}

// Returns the removed want
message RemoveWantResponse {
  Want want = 1;
}

// Starts watching a repository
message AddWatchRequest {
  string source_id = 1;
  string repo = 2;
  string revision = 3;
  string group_match = 4;
  bool auto_pull = 5;
  string slot_id = 6;
  string runtime_id = 7;
  map<string, string> params = 8;
  string profile_id = 9;
}

// Returns the watch after its first check
message AddWatchResponse {
  Watch watch = 1;
}

// Lists watches
message ListWatchesRequest {}

// Returns watches
message ListWatchesResponse {
  repeated Watch watches = 1;
}

// Stops watching
message RemoveWatchRequest {
  string id = 1;
}

// Returns the removed watch
message RemoveWatchResponse {
  Watch watch = 1;
}

// Checks one watch or want by id now, or every watch and open want
message CheckWatchesRequest {
  string id = 1;
  // Looks again for a satisfied want, forgetting what it found
  bool rearm = 2;
}

// Returns the check task
message CheckWatchesResponse {
  Task task = 1;
}

// Lists findings
message ListFindingsRequest {
  // A watch id or repo, or a want id
  string watch_id = 1;
  bool unacknowledged_only = 2;
  string want_id = 3;
}

// Returns findings newest first
message ListFindingsResponse {
  repeated Finding findings = 1;
}

// Marks a finding as seen
message AckFindingRequest {
  string id = 1;
}

// Returns the finding
message AckFindingResponse {
  Finding finding = 1;
}

// Watches sources for new revisions and quants, and searches for wanted models
service MonitorService {
  // Adds a watch
  rpc AddWatch(AddWatchRequest) returns (AddWatchResponse);
  // Lists watches
  rpc ListWatches(ListWatchesRequest) returns (ListWatchesResponse);
  // Removes a watch
  rpc RemoveWatch(RemoveWatchRequest) returns (RemoveWatchResponse);
  // Adds a want
  rpc AddWant(AddWantRequest) returns (AddWantResponse);
  // Lists wants
  rpc ListWants(ListWantsRequest) returns (ListWantsResponse);
  // Removes a want
  rpc RemoveWant(RemoveWantRequest) returns (RemoveWantResponse);
  // Runs checks now, one watch or want by id, else every watch and open want
  rpc CheckWatches(CheckWatchesRequest) returns (CheckWatchesResponse);
  // Lists findings
  rpc ListFindings(ListFindingsRequest) returns (ListFindingsResponse);
  // Acknowledges a finding
  rpc AckFinding(AckFindingRequest) returns (AckFindingResponse);
}

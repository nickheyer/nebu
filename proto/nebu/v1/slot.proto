syntax = "proto3";

package nebu.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "nebu/v1/estimate.proto";
import "nebu/v1/gateway.proto";
import "nebu/v1/instance.proto";
import "nebu/v1/meta.proto";
import "nebu/v1/task.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// Lifecycle of a slot
enum SlotState {
  SLOT_STATE_UNSPECIFIED = 0;
  SLOT_STATE_EMPTY = 1;
  SLOT_STATE_STARTING = 2;
  SLOT_STATE_READY = 3;
  SLOT_STATE_SWAPPING = 4;
  SLOT_STATE_DRAINING = 5;
  SLOT_STATE_FAILED = 6;
  // The occupant unloaded after its idle window and loads again on the next request
  SLOT_STATE_IDLE = 7;
}

// Another public name a slot answers to
message SlotAlias {
  string name = 1;
  Policy policy = 2;
  Profile profile = 3;
}

// Named device and memory reservation.
// Run and swap set the request. Eviction clears it. Failures retain it for retry.
// Slots with a request restart with the daemon.
message Slot {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string device_ids = 4;
  uint64 memory_bytes = 5;
  string runtime_id = 6;
  map<string, string> params = 7;
  string instance_id = 8;
  SlotState state = 9;
  string error = 10;
  RunRequest request = 11;
  string task_id = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  // Route limits.
  Policy policy = 15;
  // List and relaunch position, starting at one.
  uint32 position = 16;
  // Request transformations.
  Profile profile = 17;
  // Model memory placement.
  Placement placement = 18;
  // Extra public names, each a route serving the slot's model.
  repeated SlotAlias aliases = 19;
  // The formation a mesh slot runs, empty for a slot on this node alone
  string formation_id = 20;
  // Extra words for the runtime's server command, split by shell quoting, each a template over the launch
  string args = 21;
  repeated Condition conditions = 22;
  ObjectMeta meta = 23;
  uint64 observed_generation = 24;
  // Whether the slot is asked to be serving, restarting its request after a crash
  bool desired_running = 25;
}

// Creates a slot
message CreateSlotRequest {
  string name = 1;
  string description = 2;
  repeated string device_ids = 3;
  uint64 memory_bytes = 4;
  string runtime_id = 5;
  map<string, string> params = 6;
  Policy policy = 7;
  // List position. Zero appends to the end.
  uint32 position = 8;
  Profile profile = 9;
  Placement placement = 10;
  // Extra public names for the slot.
  repeated SlotAlias aliases = 11;
  // Extra words for the runtime's server command, templates over the launch
  string args = 12;
}

// Returns the new slot
message CreateSlotResponse {
  Slot slot = 1;
}

// Lists slots
message ListSlotsRequest {}

// Returns slots by name
message ListSlotsResponse {
  repeated Slot slots = 1;
}

// Fetches one slot by id or name
message GetSlotRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// Returns one slot with its occupant
message GetSlotResponse {
  Slot slot = 1;
  Instance instance = 2;
}

// Update slot settings
message UpdateSlotRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string description = 2;
  repeated string device_ids = 3;
  uint64 memory_bytes = 4;
  string runtime_id = 5;
  map<string, string> params = 6;
  Policy policy = 7;
  // Public name. Empty keeps the current name.
  string name = 8;
  // List position. Zero keeps the current position.
  uint32 position = 9;
  Profile profile = 10;
  Placement placement = 11;
  // Extra public names, replacing the current list. Names dropped stop answering.
  repeated SlotAlias aliases = 12;
  // Extra words for the runtime's server command, templates over the launch
  string args = 13;
}

// Returns the updated slot
message UpdateSlotResponse {
  Slot slot = 1;
}

// Deletes a slot, stopping its occupant when forced
message DeleteSlotRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  bool force = 2;
}

// Returns the deleted slot
message DeleteSlotResponse {
  Slot slot = 1;
}

// Replace the model while keeping the slot's public name.
message SwapRequest {
  string slot_id = 1 [(buf.validate.field).string.min_len = 1];
  RunRequest run = 2 [(buf.validate.field).required = true];
  bool drain_first = 3;
  // Percent of the slot's traffic the new occupant takes in the first canary step, zero skipping the canary
  uint32 canary_percent = 4 [(buf.validate.field).uint32.lte = 99];
  // Seconds each canary step lasts before its share grows, the swap completes, or it rolls back, at most a day
  uint32 canary_seconds = 5 [(buf.validate.field).uint32.lte = 86400];
  // Percent added to the new occupant's share after each step it passes, zero completing after the first step
  uint32 canary_step_percent = 6 [(buf.validate.field).uint32.lte = 99];
  // Points the new occupant's error rate and objective attainment, and percent its mean TTFT and TPOT, may trail the old, 10 when unset
  optional uint32 canary_max_regression_percent = 7 [(buf.validate.field).uint32.lte = 100];
}

// Returns the slot, the incoming instance, and the swap task
message SwapResponse {
  Slot slot = 1;
  Instance instance = 2;
  Task task = 3;
}

// Stops the occupant of a slot, keeping the slot
message EvictSlotRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// Returns the emptied slot
message EvictSlotResponse {
  Slot slot = 1;
}

// Relaunch the slot's saved request.
message RelaunchSlotRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// Returns the slot, the new instance, and its startup task
message RelaunchSlotResponse {
  Slot slot = 1;
  Instance instance = 2;
  Task task = 3;
}

// Slots and swaps
service SlotService {
  // Lists slots
  rpc ListSlots(ListSlotsRequest) returns (ListSlotsResponse);
  // Fetches one slot
  rpc GetSlot(GetSlotRequest) returns (GetSlotResponse);
  // Creates a slot
  rpc CreateSlot(CreateSlotRequest) returns (CreateSlotResponse);
  // Updates a slot
  rpc UpdateSlot(UpdateSlotRequest) returns (UpdateSlotResponse);
  // Deletes a slot
  rpc DeleteSlot(DeleteSlotRequest) returns (DeleteSlotResponse);
  // Swaps the model a slot serves
  rpc Swap(SwapRequest) returns (SwapResponse);
  // Stops the occupant of a slot
  rpc EvictSlot(EvictSlotRequest) returns (EvictSlotResponse);
  // Runs the slot's request again
  rpc RelaunchSlot(RelaunchSlotRequest) returns (RelaunchSlotResponse);
}

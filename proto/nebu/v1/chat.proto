syntax = "proto3";

package nebu.v1;

import "google/protobuf/timestamp.proto";
import "nebu/v1/gateway.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// An image in a saved conversation
message ChatFile {
  string id = 1;
  string media_type = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint64 size_bytes = 5;
  string name = 6;
  // Remote image the model answered with, stored by link instead of bytes.
  string url = 7;
  // Why the image could not be saved, empty when it was.
  string error = 8;
}

// One message of a saved conversation
message ChatTurn {
  // user or assistant
  string role = 1;
  string text = 2;
  // Images attached to a user turn.
  repeated ChatFile images = 3;
  // Images the model answered with.
  repeated ChatFile media = 4;
  repeated TraceToolCall tool_calls = 5;
  string error = 6;
  // Gateway trace of the request that produced an assistant turn.
  string trace_id = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp first_token_at = 9;
  google.protobuf.Timestamp finished_at = 10;
  uint32 prompt_tokens = 11;
  uint32 completion_tokens = 12;
  // stop, length, tool, cancelled, or the runtime's word
  string stop = 13;
  // Wire format the turn was made with: openai, anthropic, or ollama.
  string dialect = 14;
}

// Request settings a conversation was made with
message ChatSettings {
  string system = 1;
  string dialect = 2;
  bool stream = 3;
  string temperature = 4;
  string top_p = 5;
  string top_k = 6;
  string max_tokens = 7;
  string stop = 8;
  string seed = 9;
  // Tool definitions as a JSON array.
  string tools = 10;
}

// A saved conversation, owned by the account that made it
message Conversation {
  string id = 1;
  string title = 2;
  // Route name the last turn was sent to.
  string model = 3;
  ChatSettings settings = 4;
  repeated ChatTurn turns = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // Messages in the conversation, set on lists.
  uint32 turn_count = 8;
}

// Asks for the caller's conversations
message ListConversationsRequest {}

// The caller's conversations, most recently updated first, without turns
message ListConversationsResponse {
  repeated Conversation conversations = 1;
}

// Fetches one of the caller's conversations with its turns
message GetConversationRequest {
  string id = 1;
}

// Returns the conversation
message GetConversationResponse {
  Conversation conversation = 1;
}

// Saves a conversation, replacing one with the same id
message PutConversationRequest {
  Conversation conversation = 1;
}

// Returns the saved conversation with its timestamps
message PutConversationResponse {
  Conversation conversation = 1;
}

// Renames one of the caller's conversations
message RenameConversationRequest {
  string id = 1;
  string title = 2;
}

// Returns the renamed conversation without turns
message RenameConversationResponse {
  Conversation conversation = 1;
}

// Removes one of the caller's conversations and the images stored for it
message DeleteConversationRequest {
  string id = 1;
}

// Confirms the removal
message DeleteConversationResponse {}

// Stores an image for the caller's conversations
message PutChatFileRequest {
  ChatFile file = 1;
  bytes data = 2;
}

// Returns the stored image's record
message PutChatFileResponse {
  ChatFile file = 1;
}

// Fetches one of the caller's stored images
message GetChatFileRequest {
  string id = 1;
}

// Returns the image with its bytes
message GetChatFileResponse {
  ChatFile file = 1;
  bytes data = 2;
}

// Removes stored images no conversation refers to any more
message DeleteChatFilesRequest {
  repeated string ids = 1;
}

// Confirms the removal
message DeleteChatFilesResponse {}

// Saved conversations of the web chat
service ChatService {
  // Lists the caller's conversations
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  // Fetches one conversation with its turns
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);
  // Saves a conversation
  rpc PutConversation(PutConversationRequest) returns (PutConversationResponse);
  // Renames a conversation
  rpc RenameConversation(RenameConversationRequest) returns (RenameConversationResponse);
  // Removes a conversation and its images
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse);
  // Stores an image
  rpc PutChatFile(PutChatFileRequest) returns (PutChatFileResponse);
  // Fetches a stored image
  rpc GetChatFile(GetChatFileRequest) returns (GetChatFileResponse);
  // Removes stored images
  rpc DeleteChatFiles(DeleteChatFilesRequest) returns (DeleteChatFilesResponse);
}

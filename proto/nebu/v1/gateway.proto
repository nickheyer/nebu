syntax = "proto3";

package nebu.v1;

import "google/protobuf/timestamp.proto";
import "nebu/v1/runtime.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// Whether a route can take requests
enum RouteState {
  ROUTE_STATE_UNSPECIFIED = 0;
  ROUTE_STATE_PENDING = 1;
  ROUTE_STATE_READY = 2;
  ROUTE_STATE_DRAINING = 3;
}

// Limits a route enforces on requests, zero inherits the gateway default
message Policy {
  // Requests in flight at once
  uint32 max_in_flight = 1;
  // Sustained requests per second
  double requests_per_second = 2;
  // Requests a quiet route absorbs at once, the rate rounded up when zero
  uint32 burst = 3;
  // The whole exchange, first byte in to last byte out
  uint32 request_timeout_ms = 4;
  // How long the runtime may take to start answering
  uint32 upstream_timeout_ms = 5;
}

// A public model name mapped to an instance
message Route {
  string name = 1;
  string instance_id = 2;
  string slot_id = 3;
  string endpoint = 4;
  ApiFlavor api = 5;
  RouteState state = 6;
  uint64 requests = 7;
  uint32 in_flight = 8;
  string model = 9;
  google.protobuf.Timestamp updated_at = 10;
  Policy policy = 11;
  // The model name the runtime itself answers to, sent upstream in place of the route name
  string served = 12;
}

// One address the gateway answers on
message Listener {
  string addr = 1;
  bool shared = 2;
}

// Gateway wide view
message GatewayStatus {
  repeated Listener listeners = 1;
  repeated Route routes = 2;
  bool auth = 3;
  uint64 requests = 4;
  // What routes without a policy of their own enforce
  Policy policy = 5;
  // Whether the listeners speak TLS
  bool tls = 6;
}

// Asks for the gateway view
message GetGatewayStatusRequest {}

// Returns the gateway view
message GetGatewayStatusResponse {
  GatewayStatus status = 1;
}

// Lists routes
message ListRoutesRequest {}

// Returns routes by name
message ListRoutesResponse {
  repeated Route routes = 1;
}

// Maps an extra public name onto a running instance
message SetRouteRequest {
  string name = 1;
  string instance_id = 2;
  // Limits the alias enforces, the gateway defaults for every zero field
  Policy policy = 3;
}

// Returns the route
message SetRouteResponse {
  Route route = 1;
}

// Removes a route by name
message DeleteRouteRequest {
  string name = 1;
}

// Returns the removed route
message DeleteRouteResponse {
  Route route = 1;
}

// What a request asked the gateway for
enum TraceKind {
  TRACE_KIND_UNSPECIFIED = 0;
  TRACE_KIND_CHAT = 1;
  TRACE_KIND_GENERATE = 2;
  TRACE_KIND_EMBED = 3;
  TRACE_KIND_COUNT = 4;
  // A path the gateway proxies without reading, such as a runtime's own endpoint
  TRACE_KIND_OTHER = 5;
}

// One request through the gateway
//
// The gateway keeps the newest traces in memory, streams each one as an
// event when it starts and when it ends, and answers its id in the
// X-Nebu-Trace response header. Bodies are capped and left out of events;
// GetTrace returns them.
message Trace {
  string id = 1;
  // The public name the request named, empty when it named none
  string route = 2;
  string instance_id = 3;
  string slot_id = 4;
  // The wire format the client spoke and the one the runtime speaks
  ApiFlavor client_api = 5;
  ApiFlavor upstream_api = 6;
  string path = 7;
  TraceKind kind = 8;
  bool stream = 9;
  google.protobuf.Timestamp started_at = 10;
  // The runtime's response headers arrived
  google.protobuf.Timestamp first_byte_at = 11;
  // The first text or tool call of the answer arrived
  google.protobuf.Timestamp first_token_at = 12;
  google.protobuf.Timestamp finished_at = 13;
  // The HTTP status the client got
  uint32 status = 14;
  // Why the request failed, empty on success
  string error = 15;
  uint32 prompt_tokens = 16;
  uint32 completion_tokens = 17;
  // stop, length, tool, or filter
  string stop = 18;
  uint64 request_bytes = 19;
  uint64 response_bytes = 20;
  // The client's body as sent, capped
  string request = 21;
  // The body the gateway sent the runtime when it translated, capped, empty when passed through
  string upstream_request = 22;
  // The answer text, or the response body for a request the gateway did not read, capped
  string response = 23;
  // Whether the client and runtime formats differed
  bool translated = 24;
  // Where the request came from
  string remote = 25;
  // Tool calls the answer made, as the runtime named and argued them
  repeated TraceToolCall tool_calls = 26;
}

// One tool call in a traced answer
message TraceToolCall {
  string id = 1;
  string name = 2;
  string arguments = 3;
}

// Lists traces newest first, one route's or every route's
message ListTracesRequest {
  string route = 1;
  // At most this many, the whole ring when zero
  uint32 limit = 2;
}

// Returns traces without bodies
message ListTracesResponse {
  repeated Trace traces = 1;
}

// Fetches one trace with its bodies
message GetTraceRequest {
  string id = 1;
}

// Returns one trace
message GetTraceResponse {
  Trace trace = 1;
}

// Routes and listeners of the OpenAI compatible gateway
service GatewayService {
  // Returns listeners, routes, and counters
  rpc GetGatewayStatus(GetGatewayStatusRequest) returns (GetGatewayStatusResponse);
  // Lists routes
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);
  // Adds an alias route
  rpc SetRoute(SetRouteRequest) returns (SetRouteResponse);
  // Removes an alias route
  rpc DeleteRoute(DeleteRouteRequest) returns (DeleteRouteResponse);
  // Lists recent requests
  rpc ListTraces(ListTracesRequest) returns (ListTracesResponse);
  // Fetches one request with its bodies
  rpc GetTrace(GetTraceRequest) returns (GetTraceResponse);
}

syntax = "proto3";

package nebu.v1;

import "google/protobuf/timestamp.proto";
import "nebu/v1/runtime.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// Whether a route can take requests
enum RouteState {
  ROUTE_STATE_UNSPECIFIED = 0;
  ROUTE_STATE_PENDING = 1;
  ROUTE_STATE_READY = 2;
  ROUTE_STATE_DRAINING = 3;
}

// Route request limits. Zero inherits the gateway default.
message Policy {
  // Requests in flight at once
  uint32 max_in_flight = 1;
  // Sustained requests per second
  double requests_per_second = 2;
  // Burst capacity. Zero uses the request rate rounded up.
  uint32 burst = 3;
  // The whole exchange, first byte in to last byte out
  uint32 request_timeout_ms = 4;
  // Maximum wait for the runtime response.
  uint32 upstream_timeout_ms = 5;
}

// Handling of system messages after the first message.
enum SystemMessages {
  // Keep if the template probe accepts later system messages, otherwise merge.
  SYSTEM_MESSAGES_UNSPECIFIED = 0;
  // Send unchanged.
  SYSTEM_MESSAGES_KEEP = 1;
  // Merge into the first system message, creating it if absent.
  SYSTEM_MESSAGES_MERGE = 2;
  // Convert to user messages in place.
  SYSTEM_MESSAGES_USER = 3;
}

// Request transformations. Unset fields use instance defaults.
message Profile {
  SystemMessages system_messages = 1;
}

// A public model name mapped to an instance
message Route {
  string name = 1;
  string instance_id = 2;
  string slot_id = 3;
  string endpoint = 4;
  ApiFlavor api = 5;
  RouteState state = 6;
  uint64 requests = 7;
  uint32 in_flight = 8;
  string model = 9;
  google.protobuf.Timestamp updated_at = 10;
  Policy policy = 11;
  // Upstream model name, replacing the public route name.
  string served = 12;
  // Request transformations for this route.
  Profile profile = 13;
  // Generation modes from the capabilities endpoint: img_gen and vid_gen. Empty for language models.
  repeated string modes = 14;
}

// Gateway listener address.
message Listener {
  string addr = 1;
  bool shared = 2;
}

// Gateway wide view
message GatewayStatus {
  repeated Listener listeners = 1;
  repeated Route routes = 2;
  bool auth = 3;
  uint64 requests = 4;
  // Default route policy.
  Policy policy = 5;
  // Whether the listeners speak TLS
  bool tls = 6;
}

// Asks for the gateway view
message GetGatewayStatusRequest {}

// Returns the gateway view
message GetGatewayStatusResponse {
  GatewayStatus status = 1;
}

// Lists routes
message ListRoutesRequest {}

// Returns routes by name
message ListRoutesResponse {
  repeated Route routes = 1;
}

// Maps an extra public name onto a slot or a running instance
message SetRouteRequest {
  string name = 1;
  // A ready instance. Its slot takes the alias when it serves one.
  string instance_id = 2;
  // Alias limits. Zero fields inherit the slots, then gateway defaults.
  Policy policy = 3;
  // Alias request transformations. Unset fields use the slots, then instance defaults.
  Profile profile = 4;
  // A slot by id or name, taking the alias even before a model runs in it.
  string slot_id = 5;
}

// Returns the route
message SetRouteResponse {
  Route route = 1;
}

// Removes an alias by name. Slot names are removed with their slot.
message DeleteRouteRequest {
  string name = 1;
}

// Returns the removed route
message DeleteRouteResponse {
  Route route = 1;
}

// Gateway operation.
enum TraceKind {
  TRACE_KIND_UNSPECIFIED = 0;
  TRACE_KIND_CHAT = 1;
  TRACE_KIND_GENERATE = 2;
  TRACE_KIND_EMBED = 3;
  TRACE_KIND_COUNT = 4;
  // Endpoint proxied without parsing, such as a runtime-specific endpoint.
  TRACE_KIND_OTHER = 5;
  TRACE_KIND_IMAGE = 6;
  TRACE_KIND_VIDEO = 7;
}

// Gateway request trace.
// Recent traces are kept in memory and streamed at request start and completion.
// X-Nebu-Trace identifies the trace. Capped bodies are returned by GetTrace, not events.
message Trace {
  string id = 1;
  // Requested public model name. Empty when omitted.
  string route = 2;
  string instance_id = 3;
  string slot_id = 4;
  // Client and runtime wire protocols.
  ApiFlavor client_api = 5;
  ApiFlavor upstream_api = 6;
  string path = 7;
  TraceKind kind = 8;
  bool stream = 9;
  google.protobuf.Timestamp started_at = 10;
  // Time runtime response headers arrived.
  google.protobuf.Timestamp first_byte_at = 11;
  // Time the first response text or tool call arrived.
  google.protobuf.Timestamp first_token_at = 12;
  google.protobuf.Timestamp finished_at = 13;
  // Client response status.
  uint32 status = 14;
  // Why the request failed, empty on success
  string error = 15;
  uint32 prompt_tokens = 16;
  uint32 completion_tokens = 17;
  // stop, length, tool, or filter
  string stop = 18;
  uint64 request_bytes = 19;
  uint64 response_bytes = 20;
  // Original request body, capped.
  string request = 21;
  // Transformed upstream request body, capped. Empty when unchanged.
  string upstream_request = 22;
  // Response text or unparsed response body, capped.
  string response = 23;
  // Whether the client and runtime formats differed
  bool translated = 24;
  // Request origin.
  string remote = 25;
  // Runtime tool calls with names and arguments.
  repeated TraceToolCall tool_calls = 26;
}

// One tool call in a traced answer
message TraceToolCall {
  string id = 1;
  string name = 2;
  string arguments = 3;
}

// Lists traces newest first, one route's or every route's
message ListTracesRequest {
  string route = 1;
  // Maximum results. Zero returns the full buffer.
  uint32 limit = 2;
}

// Returns traces without bodies
message ListTracesResponse {
  repeated Trace traces = 1;
}

// Fetches one trace with its bodies
message GetTraceRequest {
  string id = 1;
}

// Returns one trace
message GetTraceResponse {
  Trace trace = 1;
}

// Routes and listeners of the OpenAI compatible gateway
service GatewayService {
  // Returns listeners, routes, and counters
  rpc GetGatewayStatus(GetGatewayStatusRequest) returns (GetGatewayStatusResponse);
  // Lists routes
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);
  // Adds an alias for a slot or a running instance
  rpc SetRoute(SetRouteRequest) returns (SetRouteResponse);
  // Removes an alias, from its slot when it has one
  rpc DeleteRoute(DeleteRouteRequest) returns (DeleteRouteResponse);
  // Lists recent requests
  rpc ListTraces(ListTracesRequest) returns (ListTracesResponse);
  // Fetches one request with its bodies
  rpc GetTrace(GetTraceRequest) returns (GetTraceResponse);
}

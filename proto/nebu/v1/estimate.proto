syntax = "proto3";

package nebu.v1;

import "google/protobuf/timestamp.proto";
import "nebu/v1/host.proto";
import "nebu/v1/model.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// Whether a plan fits the primary pools
enum FitVerdict {
  FIT_VERDICT_UNSPECIFIED = 0;
  FIT_VERDICT_FITS = 1;
  FIT_VERDICT_PARTIAL = 2;
  FIT_VERDICT_NO = 3;
}

// Which memory a run's weights go into
enum Placement {
  // Device memory first, the rest in host memory
  PLACEMENT_UNSPECIFIED = 0;
  // Device memory only, a model that does not fit there is refused
  PLACEMENT_DEVICE = 1;
  // Host memory only, no device is touched
  PLACEMENT_HOST = 2;
}

// Bytes planned into one pool, past its capacity when the plan overflows the host and this is the last pool it spills into
message PoolUsage {
  string pool_id = 1;
  PoolKind kind = 2;
  uint64 used_bytes = 3;
  uint64 capacity_bytes = 4;
  // The whole pool, and what was free in it when the plan was made
  uint64 total_bytes = 5;
  uint64 free_bytes = 6;
}

// Bytes of one group kind planned onto one side, device or host, or left on disk when the pool is empty
message GroupPlacement {
  TensorGroupKind kind = 1;
  string pool_id = 2;
  uint64 bytes = 3;
  uint32 count = 4;
}

// Result of planning one model on one runtime
message MemoryPlan {
  FitVerdict verdict = 1;
  repeated PoolUsage pools = 2;
  repeated GroupPlacement placements = 3;
  uint64 weights_bytes = 4;
  uint64 cache_bytes = 5;
  uint64 overhead_bytes = 6;
  map<string, string> params = 7;
  string detail = 8;
  // The learned correction folded into overhead_bytes when the plan was made
  double overhead_delta = 9;
  // Groups the runtime leaves on disk under these params, a draft head without speculative decoding
  repeated GroupPlacement skipped = 10;
  // Whether pool capacities are the memory free when the plan was made rather than whole pools
  bool against_free = 11;
  // When the host was read for this plan
  google.protobuf.Timestamp planned_at = 12;
}

// Learned correction for one runtime and architecture
message Calibration {
  double overhead_delta = 1;
  uint32 samples = 2;
  google.protobuf.Timestamp updated_at = 3;
}

// Every learned correction keyed by runtime and architecture
message CalibrationTable {
  map<string, Calibration> entries = 1;
}

// Plans one weight group on one runtime, against memory free right now when free is set
//
// Params apply over the slot's defaults, the same layering a run uses.
message EstimateRequest {
  string source_id = 1;
  string repo = 2;
  string revision = 3;
  string group = 4;
  string runtime_id = 5;
  map<string, string> params = 6;
  string slot_id = 7;
  bool free = 8;
}

// A choice the current params rule out, and why
message DisabledChoice {
  string value = 1;
  string message = 2;
}

// What the model, host, and current params make of one param: its bounds and the choices ruled out
message ParamState {
  string name = 1;
  double min = 2;
  double max = 3;
  double step = 4;
  repeated DisabledChoice disabled = 5;
}

// Returns the plan and descriptor used, with the state of every param under these inputs
message EstimateResponse {
  MemoryPlan plan = 1;
  Descriptor descriptor = 2;
  repeated ParamState params = 3;
  // Why a run with these params would be refused, empty when it would not
  string refusal = 4;
}

// Builds a fit table for a model
//
// Every compatible runtime is planned unless runtime_ids names some, the
// slot's runtime alone when a slot is named and runtime_ids is empty.
message InspectRequest {
  string source_id = 1;
  string repo = 2;
  string revision = 3;
  repeated string groups = 4;
  repeated string runtime_ids = 5;
  repeated uint32 contexts = 6;
  map<string, string> params = 7;
  string slot_id = 8;
}

// One cell of the fit table: the plan against the whole memory, and the one against what is free right now
//
// A context of zero is the row the planner solved itself, the largest context that fits, and the
// plan's params carry the length it settled on.
message FitRow {
  string group = 1;
  string runtime_id = 2;
  uint32 context = 3;
  MemoryPlan plan = 4;
  MemoryPlan free = 5;
}

// Model, descriptors, and fit table
message InspectResponse {
  Model model = 1;
  repeated Descriptor descriptors = 2;
  repeated FitRow rows = 3;
  repeated string warnings = 4;
}

// Memory planning before download
service EstimateService {
  // Resolves, describes, and plans every group
  rpc Inspect(InspectRequest) returns (InspectResponse);
  // Plans one group on one runtime
  rpc Estimate(EstimateRequest) returns (EstimateResponse);
}

syntax = "proto3";

package nebu.v1;

import "google/protobuf/timestamp.proto";
import "nebu/v1/host.proto";
import "nebu/v1/model.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// A way of spreading one model over the nodes of a mesh
enum Shape {
  SHAPE_UNSPECIFIED = 0;
  // Everything on one node
  SHAPE_SOLO = 1;
  // Consecutive layer ranges on stages, the head sampling
  SHAPE_CHAIN = 2;
  // Every layer split across every seat, two reductions per layer per token
  SHAPE_LOCKSTEP = 3;
  // One seat prefills, another decodes, the cache crossing once per request
  SHAPE_RELAY = 4;
  // The whole model on every seat, requests spread by the gateway
  SHAPE_REPLICAS = 5;
  // The target on the head, a draft model on another node
  SHAPE_DRAFT = 6;
  // A diffusion denoiser on one node, its encoders and decoder on another
  SHAPE_STAGES = 7;
}

// What a link carries well, from its measurements
enum LinkClass {
  LINK_CLASS_UNSPECIFIED = 0;
  // RDMA both ends, round trip under 100 us, aggregate 100 Gb/s or more
  LINK_CLASS_FABRIC = 1;
  // Round trip under 300 us, stream 10 Gb/s or more
  LINK_CLASS_FAST = 2;
  // Round trip under 2 ms, stream 1 Gb/s or more
  LINK_CLASS_LAN = 3;
  // Anything else
  LINK_CLASS_SLOW = 4;
}

// Which numbers a route cares about, weighting the planner's score
enum PlanProfile {
  PLAN_PROFILE_UNSPECIFIED = 0;
  // Short prompts, short answers, balanced at 2048 prompt tokens
  PLAN_PROFILE_CHAT = 1;
  // Long prompts, short answers, prefill weighted at the route's median prompt
  PLAN_PROFILE_AGENT = 2;
  // Many concurrent requests, throughput weighted
  PLAN_PROFILE_BATCH = 3;
  // Learned from the route's last 200 traces
  PLAN_PROFILE_AUTO = 4;
}

// Whether a plan fits the primary pools
enum FitVerdict {
  FIT_VERDICT_UNSPECIFIED = 0;
  FIT_VERDICT_FITS = 1;
  FIT_VERDICT_PARTIAL = 2;
  FIT_VERDICT_NO = 3;
}

// Weight placement.
enum Placement {
  // Device memory first, the rest in host memory
  PLACEMENT_UNSPECIFIED = 0;
  // Require the model to fit in device memory.
  PLACEMENT_DEVICE = 1;
  // Use host memory only.
  PLACEMENT_HOST = 2;
}

// Planned pool usage. The final spill pool may exceed capacity.
message PoolUsage {
  string pool_id = 1;
  PoolKind kind = 2;
  uint64 used_bytes = 3;
  uint64 capacity_bytes = 4;
  // Total and free pool memory at planning time.
  uint64 total_bytes = 5;
  uint64 free_bytes = 6;
}

// Tensor-group bytes assigned to device or host memory. An empty pool means disk only.
message GroupPlacement {
  TensorGroupKind kind = 1;
  string pool_id = 2;
  uint64 bytes = 3;
  uint32 count = 4;
}

// Result of planning one model on one runtime
message MemoryPlan {
  FitVerdict verdict = 1;
  repeated PoolUsage pools = 2;
  repeated GroupPlacement placements = 3;
  uint64 weights_bytes = 4;
  uint64 cache_bytes = 5;
  uint64 overhead_bytes = 6;
  map<string, string> params = 7;
  string detail = 8;
  // Learned correction included in overhead_bytes.
  double overhead_delta = 9;
  // Unloaded groups, such as draft heads when speculative decoding is disabled.
  repeated GroupPlacement skipped = 10;
  // Whether pool capacities use free memory instead of total memory.
  bool against_free = 11;
  // Host snapshot time used by this plan.
  google.protobuf.Timestamp planned_at = 12;
}

// Learned correction for one runtime and architecture
message Calibration {
  double overhead_delta = 1;
  uint32 samples = 2;
  google.protobuf.Timestamp updated_at = 3;
}

// Learned corrections keyed by runtime and architecture.
message CalibrationTable {
  map<string, Calibration> entries = 1;
}

// Plan a weight group on a runtime. Use currently free memory when free is set.
// Request parameters override slot defaults, as they do at launch.
message EstimateRequest {
  string source_id = 1;
  string repo = 2;
  string revision = 3;
  string group = 4;
  string runtime_id = 5;
  map<string, string> params = 6;
  string slot_id = 7;
  bool free = 8;
}

// Disabled parameter choice and reason.
message DisabledChoice {
  string value = 1;
  string message = 2;
}

// Parameter bounds and disabled choices for the current model, host, and settings.
message ParamState {
  string name = 1;
  double min = 2;
  double max = 3;
  double step = 4;
  repeated DisabledChoice disabled = 5;
}

// Resolved blueprint dependency.
// stored means available in the store, bundled means included in the model group, and error
// explains resolution failures. Source fields identify the download location.
// paths restrict the download to selected files within the group.
message Part {
  // Blueprint slot, such as text_encoder.t5.
  string slot = 1;
  // Slot display label.
  string label = 2;
  // Component name from the blueprint, such as UMT5-XXL encoder.
  string name = 3;
  // Required to run the model.
  bool required = 4;
  // Runtime parameter for this file, when requested by a runtime.
  string param = 5;
  bool stored = 6;
  bool bundled = 7;
  string source_id = 8;
  string repo = 9;
  string revision = 10;
  string group = 11;
  repeated string paths = 12;
  uint64 size_bytes = 13;
  string error = 14;
  // Pipeline subfolder for a bundled component.
  string subfolder = 15;
}

// Plan, descriptor, and parameter states for the requested inputs.
message EstimateResponse {
  MemoryPlan plan = 1;
  Descriptor descriptor = 2;
  repeated ParamState params = 3;
  // Launch refusal reason. Empty when allowed.
  string refusal = 4;
  // Missing dependencies and their download locations.
  repeated Part missing = 5;
}

// Resolve a weight group's dependencies.
message PartsRequest {
  string source_id = 1;
  string repo = 2;
  string revision = 3;
  string group = 4;
}

// Weight group blueprint and resolved dependencies.
message PartsResponse {
  Descriptor descriptor = 1;
  // Blueprint family ID and name. Empty when no blueprint applies.
  string family = 2;
  string family_name = 3;
  repeated Part parts = 4;
  // Additional bytes to download.
  uint64 pull_bytes = 5;
}

// Build a model fit table.
// Use runtime_ids when specified, otherwise the slot runtime if a slot is given,
// otherwise all compatible runtimes.
message InspectRequest {
  string source_id = 1;
  string repo = 2;
  string revision = 3;
  repeated string groups = 4;
  repeated string runtime_ids = 5;
  repeated uint32 contexts = 6;
  map<string, string> params = 7;
  string slot_id = 8;
}

// Plans for total and currently free memory.
// Context zero selects the largest context that fits. The plan parameters
// contain the selected context length.
message FitRow {
  string group = 1;
  string runtime_id = 2;
  uint32 context = 3;
  MemoryPlan plan = 4;
  MemoryPlan free = 5;
}

// Model, descriptors, and fit table
message InspectResponse {
  Model model = 1;
  repeated Descriptor descriptors = 2;
  repeated FitRow rows = 3;
  repeated string warnings = 4;
}

// Memory planning before download
service EstimateService {
  // Resolves, describes, and plans every group
  rpc Inspect(InspectRequest) returns (InspectResponse);
  // Plans one group on one runtime
  rpc Estimate(EstimateRequest) returns (EstimateResponse);
  // Resolve the components needed by a weight group.
  rpc Parts(PartsRequest) returns (PartsResponse);
}

syntax = "proto3";

package nebu.v1;

import "google/protobuf/timestamp.proto";
import "nebu/v1/estimate.proto";
import "nebu/v1/task.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// Lifecycle of a running model
enum InstanceState {
  INSTANCE_STATE_UNSPECIFIED = 0;
  INSTANCE_STATE_STARTING = 1;
  INSTANCE_STATE_READY = 2;
  INSTANCE_STATE_STOPPING = 3;
  INSTANCE_STATE_STOPPED = 4;
  INSTANCE_STATE_FAILED = 5;
  INSTANCE_STATE_DRAINING = 6;
}

// One matched triage rule with its hint
message TriageHit {
  string id = 1;
  string summary = 2;
  string hint = 3;
  string line = 4;
  map<string, string> fix = 5;
}

// One allocation reported by the runtime or measured on the host
message Measurement {
  string key = 1;
  uint64 bytes = 2;
  string line = 3;
}

// Chat template support probed with two requests at startup.
message TemplateProbe {
  // Whether the template supports later system messages.
  bool late_system = 1;
  // Template refusal message. Empty when supported.
  string refusal = 2;
  // Probe error. Empty on success.
  string error = 3;
}

// Another seat of the formation a seat talks to, with the address it reaches it at
message SeatPeer {
  string node_id = 1;
  string role = 2;
  uint32 rank = 3;
  // host:port the seat reaches the peer at
  string address = 4;
  // Devices the peer's seat holds
  uint32 devices = 5;
  // Layer range the peer holds, from inclusive to exclusive; every layer when both are zero
  uint32 layer_from = 6;
  uint32 layer_to = 7;
}

// The place an instance takes in a formation, carried by its run request
message SeatSpec {
  string formation_id = 1;
  Shape shape = 2;
  string role = 3;
  uint32 rank = 4;
  // Seats in the formation, ranks that rendezvous counting every rank
  uint32 count = 5;
  // host:port the ranks rendezvous at
  string rendezvous = 6;
  repeated SeatPeer peers = 7;
  // Layer range the seat holds, from inclusive to exclusive; every layer when both are zero
  uint32 layer_from = 8;
  uint32 layer_to = 9;
  // The node id of the conductor
  string conductor = 10;
  // The formation's name, the route the head answers
  string name = 11;
  // The port the seat's guard listener or the seat itself takes on the mesh address
  uint32 port = 12;
  // The mesh address of this node, what peers dial
  string address = 13;
  // Whether the seat binds the mesh address itself instead of a guard forwarder
  bool exposed = 14;
  // Member addresses the guard listener admits
  repeated string admit = 15;
  // The interface the link to the peers leaves through, and its RDMA devices
  string interface = 16;
  repeated string rdma_devices = 17;
  // Planned bytes per device in device order, what a tensor split follows
  repeated string devices = 18;
  repeated uint64 device_bytes = 19;
  // The draft model's weights, for a draft head
  string draft = 20;
  // Where a stage keeps streamed tensors between starts
  string cache_dir = 21;
  // The context the plan chose, shared by every seat
  uint32 context = 22;
  // Layers the head keeps on listed devices, stages and its own, the rest on its CPU
  uint32 gpu_layers = 23;
  // A second port the seat's own protocol takes on the mesh address: a NIXL side channel or a bootstrap port
  uint32 aux_port = 24;
  // The seat's memory plan on its node, as the formation planner laid it out
  MemoryPlan memory = 26;
  // The port the seat's process binds on loopback behind a guard listener
  uint32 local_port = 27;
  // Where a relay seat saves and restores slot files: <cache dir>/slots/<formation>
  string slot_dir = 28;
  // The key of the model's tensor cache on the seat's node, the same across relaunches
  string cache_key = 29;
}

// A runtime process serving one stored model
message Instance {
  string id = 1;
  string name = 2;
  string source_id = 3;
  string repo = 4;
  string group = 5;
  string runtime_id = 6;
  string install_id = 7;
  map<string, string> params = 8;
  repeated string command = 9;
  string endpoint = 10;
  InstanceState state = 11;
  int32 pid = 12;
  string error = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp ready_at = 15;
  google.protobuf.Timestamp stopped_at = 16;
  MemoryPlan plan = 17;
  repeated TriageHit triage = 18;
  repeated Measurement measurements = 19;
  string task_id = 20;
  RunRequest request = 21;
  bool desired_running = 22;
  string slot_id = 23;
  TemplateProbe template = 24;
  // The seat this instance takes in a formation, unset for a solo instance
  SeatSpec seat = 25;
  // Measured from the seat's log: the transport its collective took, rdma or sockets
  string transport = 26;
}

// Start a stored model. Request parameters override slot defaults, which override manifest defaults.
message RunRequest {
  string source_id = 1;
  string repo = 2;
  string group = 3;
  string runtime_id = 4;
  string install_id = 5;
  string name = 6;
  map<string, string> params = 7;
  string slot_id = 8;
  bool force = 9;
  // The nodes and devices the run may use: node ids, or node/device for one device on a node.
  // Empty means this node alone.
  repeated string span = 10;
  // The shape to run, auto when unspecified
  Shape shape = 11;
  // The seat block a conductor gives a seat's node
  SeatSpec seat = 12;
  // Which numbers the planner weighs
  PlanProfile profile = 13;
  // Plan against free memory instead of total, as a launch does, so a swap sees the occupant it replaces
  bool free = 14;
}

// Returns the instance and its startup task
message RunResponse {
  Instance instance = 1;
  Task task = 2;
}

// Lists instances
message ListInstancesRequest {
  bool running_only = 1;
}

// Returns instances newest first
message ListInstancesResponse {
  repeated Instance instances = 1;
}

// Fetches one instance by id or name
message GetInstanceRequest {
  string id = 1;
}

// Returns one instance
message GetInstanceResponse {
  Instance instance = 1;
}

// Stops one instance by id or name
message StopInstanceRequest {
  string id = 1;
}

// Returns the instance after stop
message StopInstanceResponse {
  Instance instance = 1;
}

// Streams runtime output
message LogsRequest {
  string id = 1;
  bool follow = 2;
  uint32 tail = 3;
}

// Batch of log lines
message LogsResponse {
  repeated string lines = 1;
}

// Running models
service InstanceService {
  // Plans, launches, and registers a model
  rpc Run(RunRequest) returns (RunResponse);
  // Lists instances
  rpc ListInstances(ListInstancesRequest) returns (ListInstancesResponse);
  // Fetches one instance
  rpc GetInstance(GetInstanceRequest) returns (GetInstanceResponse);
  // Stops one instance
  rpc StopInstance(StopInstanceRequest) returns (StopInstanceResponse);
  // Streams runtime output
  rpc Logs(LogsRequest) returns (stream LogsResponse);
}

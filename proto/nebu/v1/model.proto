syntax = "proto3";

package nebu.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// Purpose of a file within a model
enum ArtifactRole {
  ARTIFACT_ROLE_UNSPECIFIED = 0;
  ARTIFACT_ROLE_WEIGHTS = 1;
  ARTIFACT_ROLE_PROJECTOR = 2;
  ARTIFACT_ROLE_TOKENIZER = 3;
  ARTIFACT_ROLE_CONFIG = 4;
  ARTIFACT_ROLE_TEMPLATE = 5;
  ARTIFACT_ROLE_OTHER = 6;
  // A speculative decoding head such as an MTP draft, loaded beside the weights it drafts for
  ARTIFACT_ROLE_DRAFT = 7;
  // The shard index naming which file holds each tensor
  ARTIFACT_ROLE_INDEX = 8;
  // Model code a checkpoint ships for loaders that trust remote code
  ARTIFACT_ROLE_CODE = 9;
}

// Placement class of a tensor group
enum TensorGroupKind {
  TENSOR_GROUP_KIND_UNSPECIFIED = 0;
  TENSOR_GROUP_KIND_EMBEDDING = 1;
  TENSOR_GROUP_KIND_LAYER = 2;
  TENSOR_GROUP_KIND_EXPERTS = 3;
  TENSOR_GROUP_KIND_OUTPUT = 4;
  TENSOR_GROUP_KIND_OTHER = 5;
  // A vision encoder and the projector feeding its features to the language model
  TENSOR_GROUP_KIND_VISION = 6;
  // An audio encoder and its projector
  TENSOR_GROUP_KIND_AUDIO = 7;
  // Speculative decoding layers such as multi token prediction heads, loaded only when a run drafts with them
  TENSOR_GROUP_KIND_DRAFT = 8;
  // The denoiser of a diffusion model, a UNet or a diffusion transformer
  TENSOR_GROUP_KIND_DIFFUSION = 9;
  // The autoencoder a diffusion model decodes latents through
  TENSOR_GROUP_KIND_VAE = 10;
  // A text encoder conditioning a diffusion model, CLIP, T5, or a language model used as one
  TENSOR_GROUP_KIND_TEXT_ENCODER = 11;
}

// What a weight group is, which decides the runtimes that serve it
enum ModelKind {
  MODEL_KIND_UNSPECIFIED = 0;
  // A language model served for chat, completion, or embeddings
  MODEL_KIND_LANGUAGE = 1;
  // A diffusion model that generates images or video
  MODEL_KIND_DIFFUSION = 2;
  // A part of a diffusion pipeline loaded beside a diffusion model, an autoencoder or a text encoder, not served alone
  MODEL_KIND_COMPONENT = 3;
}

// One file belonging to a model
message Artifact {
  string path = 1;
  uint64 size_bytes = 2;
  string sha256 = 3;
  string format_id = 4;
  ArtifactRole role = 5;
  string group = 6;
  uint32 shard_index = 7;
  uint32 shard_count = 8;
  // Where a browser can fetch the file from the source, empty when the source has no such address
  string url = 9;
}

// Repository at a revision with its artifacts
message Model {
  string source_id = 1;
  string repo = 2;
  string revision = 3;
  string commit = 4;
  repeated Artifact artifacts = 5;
  google.protobuf.Timestamp resolved_at = 6;
}

// One tensor as read from a header
message TensorInfo {
  string name = 1;
  string dtype = 2;
  uint64 bytes = 3;
  uint64 elements = 4;
  // The dimensions as the header lists them, outermost first, what tells one family's block from another's
  repeated uint64 shape = 5;
}

// Header facts read from one weight group
message RawModel {
  string format_id = 1;
  string group = 2;
  map<string, string> metadata = 3;
  repeated TensorInfo tensors = 4;
}

// Tensors summed by placement class and layer
message TensorGroup {
  string id = 1;
  TensorGroupKind kind = 2;
  int32 layer = 3;
  uint64 bytes = 4;
  uint64 elements = 5;
}

// How compactly a weight group stores each weight, in words
message Precision {
  uint32 bits = 1;
  string label = 2;
  string blurb = 3;
  // Quality retained, 0 unknown through 5 full
  uint32 level = 4;
}

// Format neutral facts the planner consumes
message Descriptor {
  string format_id = 1;
  string group = 2;
  string architecture = 3;
  // The attention family the planner sizes the cache by
  string family = 4;
  map<string, double> params = 5;
  repeated TensorGroup groups = 6;
  uint64 total_bytes = 7;
  uint64 parameter_count = 8;
  double bits_per_weight = 9;
  map<string, string> metadata = 10;
  Precision precision = 11;
  ModelKind kind = 12;
  // What a diffusion model makes, image or video, either or both; empty for anything else
  repeated string generates = 13;
}

// A weight format the daemon reads, in the words people meet it by
message Format {
  string id = 1;
  string description = 2;
  // What the format is, for people who have not met it
  string blurb = 3;
}

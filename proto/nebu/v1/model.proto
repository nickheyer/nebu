syntax = "proto3";

package nebu.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// Purpose of a file within a model
enum ArtifactRole {
  ARTIFACT_ROLE_UNSPECIFIED = 0;
  ARTIFACT_ROLE_WEIGHTS = 1;
  ARTIFACT_ROLE_PROJECTOR = 2;
  ARTIFACT_ROLE_TOKENIZER = 3;
  ARTIFACT_ROLE_CONFIG = 4;
  ARTIFACT_ROLE_TEMPLATE = 5;
  ARTIFACT_ROLE_OTHER = 6;
  // A speculative decoding head such as an MTP draft, loaded beside the weights it drafts for
  ARTIFACT_ROLE_DRAFT = 7;
  // The shard index naming which file holds each tensor
  ARTIFACT_ROLE_INDEX = 8;
  // Model code a checkpoint ships for loaders that trust remote code
  ARTIFACT_ROLE_CODE = 9;
}

// Placement class of a tensor group
enum TensorGroupKind {
  TENSOR_GROUP_KIND_UNSPECIFIED = 0;
  TENSOR_GROUP_KIND_EMBEDDING = 1;
  TENSOR_GROUP_KIND_LAYER = 2;
  TENSOR_GROUP_KIND_EXPERTS = 3;
  TENSOR_GROUP_KIND_OUTPUT = 4;
  TENSOR_GROUP_KIND_OTHER = 5;
  // A vision encoder and the projector feeding its features to the language model
  TENSOR_GROUP_KIND_VISION = 6;
  // An audio encoder and its projector
  TENSOR_GROUP_KIND_AUDIO = 7;
  // Speculative decoding layers such as multi token prediction heads, loaded only when a run drafts with them
  TENSOR_GROUP_KIND_DRAFT = 8;
}

// One file belonging to a model
message Artifact {
  string path = 1;
  uint64 size_bytes = 2;
  string sha256 = 3;
  string format_id = 4;
  ArtifactRole role = 5;
  string group = 6;
  uint32 shard_index = 7;
  uint32 shard_count = 8;
}

// Repository at a revision with its artifacts
message Model {
  string source_id = 1;
  string repo = 2;
  string revision = 3;
  string commit = 4;
  repeated Artifact artifacts = 5;
  google.protobuf.Timestamp resolved_at = 6;
}

// One tensor as read from a header
message TensorInfo {
  string name = 1;
  string dtype = 2;
  uint64 bytes = 3;
  uint64 elements = 4;
}

// Header facts read from one weight group
message RawModel {
  string format_id = 1;
  string group = 2;
  map<string, string> metadata = 3;
  repeated TensorInfo tensors = 4;
}

// Tensors summed by placement class and layer
message TensorGroup {
  string id = 1;
  TensorGroupKind kind = 2;
  int32 layer = 3;
  uint64 bytes = 4;
  uint64 elements = 5;
}

// How compactly a weight group stores each weight, in words
message Precision {
  uint32 bits = 1;
  string label = 2;
  string blurb = 3;
  // Quality retained, 0 unknown through 5 full
  uint32 level = 4;
}

// Format neutral facts the planner consumes
message Descriptor {
  string format_id = 1;
  string group = 2;
  string architecture = 3;
  string arch_spec_id = 4;
  map<string, double> params = 5;
  repeated TensorGroup groups = 6;
  uint64 total_bytes = 7;
  uint64 parameter_count = 8;
  double bits_per_weight = 9;
  map<string, string> metadata = 10;
  Precision precision = 11;
}

// Reads a weight group's precision from its group name or a metadata key
message PrecisionRule {
  // group, or a metadata key
  string key = 1;
  string match = 2;
  // The width, unless a bits capture names it, the first matching width winning
  uint32 bits = 3;
  // Added to the blurb, expanded with the captures
  string note = 4;
  // Matches only while no rule before it has
  bool fallback = 5;
  // The label, expanded with the captures, the name capture when empty
  string label = 6;
}

// Counts the weights a tensor packs into each stored element
message PackRule {
  string match = 1;
  // The metadata key whose value the bits capture reads the packed width from
  string key = 2;
  string value = 3;
}

// Words for one bit width and every width down to the next
message PrecisionLevel {
  uint32 bits = 1;
  string label = 2;
  string blurb = 3;
  uint32 level = 4;
}

// Data driven precision words, widths in descending order
message PrecisionSpec {
  string id = 1;
  string description = 2;
  repeated PrecisionLevel levels = 3;
}

// Claims files matching a path pattern
message FileRule {
  string match = 1;
  ArtifactRole role = 2;
}

// Derives a group name from a path pattern
message GroupRule {
  string match = 1;
  string value = 2;
}

// Classifies tensors by name pattern
message TensorRule {
  string match = 1;
  TensorGroupKind kind = 2;
}

// Maps a descriptor param to candidate metadata keys
message ParamRule {
  string name = 1;
  repeated string keys = 2;
  string derive = 3;
  // Sums the elements of tensors whose names match, for formats whose headers name no params
  string tensor = 4;
}

// Data driven format definition
message FormatSpec {
  string id = 1;
  string description = 2;
  uint32 priority = 3;
  repeated FileRule files = 4;
  repeated GroupRule groups = 5;
  string shards = 6;
  repeated TensorRule tensors = 7;
  repeated string architecture = 8;
  repeated ParamRule params = 9;
  repeated string metadata = 10;
  repeated ArtifactRole requires = 11;
  map<string, string> dtypes = 12;
  string reader = 13;
  string root = 14;
  // What the format is, for people who have not met it
  string blurb = 15;
  repeated PrecisionRule precisions = 16;
  repeated PackRule packing = 17;
  // Expression over the params read from the header giving the first layer index that is a
  // draft layer rather than a main one, so a checkpoint that numbers its prediction heads after
  // the main layers keeps them apart; empty when layers are never drafts by index
  string draft_from = 18;
}

// Data driven architecture family definition
message ArchSpec {
  string id = 1;
  string description = 2;
  string match = 3;
  uint32 priority = 4;
  map<string, string> formulas = 5;
}

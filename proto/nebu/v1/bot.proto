syntax = "proto3";

package nebu.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nickheyer/nebu/pkg/proto/nebu/v1;nebuv1";

// Lifecycle of a bot
enum BotState {
  BOT_STATE_UNSPECIFIED = 0;
  // Not running, by choice
  BOT_STATE_STOPPED = 1;
  // Shards opening
  BOT_STATE_CONNECTING = 2;
  // All local shards are connected.
  BOT_STATE_READY = 3;
  // Some shards connected, others not
  BOT_STATE_DEGRADED = 4;
  // Token or intents rejected, or all shards disconnected.
  BOT_STATE_FAILED = 5;
  // Shards closing
  BOT_STATE_STOPPING = 6;
}

// Automation trigger.
enum TriggerKind {
  TRIGGER_KIND_UNSPECIFIED = 0;
  // Cron or interval schedule.
  TRIGGER_KIND_SCHEDULE = 1;
  // Any message the bot can see
  TRIGGER_KIND_MESSAGE = 2;
  // A message matching a regular expression
  TRIGGER_KIND_KEYWORD = 3;
  // A message that mentions the bot
  TRIGGER_KIND_MENTION = 4;
  // Someone joins a guild
  TRIGGER_KIND_MEMBER_JOIN = 5;
  // A reaction is added to a message
  TRIGGER_KIND_REACTION = 6;
  // A prefix command such as !roll
  TRIGGER_KIND_COMMAND = 7;
}

// Automation action.
enum ActionKind {
  ACTION_KIND_UNSPECIFIED = 0;
  // Sends the rendered template to the persona's language model and posts the answer
  ACTION_KIND_CHAT = 1;
  // Sends the rendered template to the persona's image model and posts the images
  ACTION_KIND_IMAGE = 2;
  // Sends the rendered template to the persona's video model and posts the video
  ACTION_KIND_VIDEO = 3;
  // Posts the rendered template as it is
  ACTION_KIND_TEXT = 4;
  // Reacts to the triggering message with an emoji
  ACTION_KIND_REACT = 5;
  // Sets the bot's activity line to the rendered template
  ACTION_KIND_PRESENCE = 6;
}

// Bot status and activity.
message Presence {
  // online, idle, dnd, or invisible
  string status = 1;
  // playing, listening, watching, competing, or custom
  string activity_type = 2;
  // Activity lines rotated in order.
  repeated string activities = 3;
  // Rotation interval in seconds. Zero defaults to five minutes.
  uint32 rotate_seconds = 4;
}

// Language-model sampling settings. Unset fields use runtime defaults.
message Sampling {
  optional double temperature = 1;
  optional double top_p = 2;
  optional int32 top_k = 3;
  optional uint32 max_tokens = 4;
  repeated string stop = 5;
  optional int64 seed = 6;
}

// Reply timing, formatting, and frequency settings.
message Humanize {
  bool enabled = 1;
  // Simulated typing speed used to time the typing indicator.
  double chars_per_second = 2;
  // Random delay before typing, bounded by these values.
  uint32 delay_min_ms = 3;
  uint32 delay_max_ms = 4;
  // Maximum typing delay.
  uint32 max_typing_ms = 5;
  // Split long replies at paragraph and sentence boundaries, pausing between messages.
  bool split_messages = 6;
  // Split length in characters. Zero uses the Discord message limit.
  uint32 max_chunk_chars = 7;
  // Lowercase the answer and drop its final period
  bool casual = 8;
  // Chance from 0 to 1 that a message gets an emoji reaction
  double reaction_chance = 9;
  // Reaction emojis, selected at random.
  repeated string reactions = 10;
  // Probability of an unprompted reply, from 0 to 1.
  double ambient_reply_chance = 11;
  // Active hours as HH:MM-HH:MM. Empty means always active.
  string active_hours = 12;
  // IANA timezone for active hours. Empty uses the host timezone.
  string timezone = 13;
  // Send a Discord reply. Webhook personas mention the author instead.
  bool quote_reply = 14;
  // Probability of ignoring an addressed message, from 0 to 1.
  double ignore_chance = 15;
}

// Bot persona with identity, prompt, and models.
message Persona {
  string id = 1;
  string name = 2;
  string avatar_url = 3;
  // Use a channel webhook with the persona's name and avatar.
  bool webhook = 4;
  string system_prompt = 5;
  // Chat route. Empty selects the sole ready language model.
  string model = 6;
  // Image route. Empty selects the sole ready image model.
  string image_model = 7;
  // Video route. Empty selects the sole ready video model.
  string video_model = 8;
  Sampling sampling = 9;
  Humanize humanize = 10;
  // Wake words, matched as whole words without case sensitivity.
  repeated string wake_words = 11;
  // Channels for unprompted replies. Empty uses all allowed channels.
  repeated string channel_ids = 12;
  // Pass message images to the language model.
  bool vision = 13;
  // Appended to every image prompt
  string image_style = 14;
  // Negative prompt for images and video.
  string negative_prompt = 15;
  // Edit the message during generation.
  bool stream = 16;
}

// Bot response rules.
message Engagement {
  // Answer direct messages
  bool direct_messages = 1;
  // In guilds, answer only when mentioned, replied to, or called by a wake word
  bool require_mention = 2;
  // Allowed channels. Empty allows all channels.
  repeated string channel_ids = 3;
  // Blocked channels.
  repeated string denied_channel_ids = 4;
  // Allowed guilds. Empty allows all guilds.
  repeated string guild_ids = 5;
  // Allowed users. Empty allows all users.
  repeated string user_ids = 6;
  // Blocked users.
  repeated string denied_user_ids = 7;
  // Reply to bots and webhooks, including this bot's personas.
  bool answer_bots = 8;
  // Consecutive bot-message limit. Zero defaults to three.
  uint32 max_bot_chain = 9;
  // The character that starts a text command, such as !
  string prefix = 10;
  // Milliseconds between answers in one channel
  uint32 cooldown_ms = 11;
  // Milliseconds between answers to one person
  uint32 user_cooldown_ms = 12;
  // Maximum concurrent generations. Zero defaults to four.
  uint32 max_concurrent = 13;
  // Subscribe to member events. Requires the privileged members intent.
  bool member_events = 14;
}

// Slash commands the bot registers
message Commands {
  bool enabled = 1;
  // Register immediately in these guilds. Empty registers globally, which can take an hour.
  repeated string guild_ids = 2;
  // Command names keyed by their role: ask, imagine, video, persona, models, reset, help
  map<string, string> names = 3;
  // Command roles to skip.
  repeated string disabled = 4;
}

// Channel history limits.
message Memory {
  // History message count. Zero defaults to twenty.
  uint32 messages = 1;
  // Maximum history age in minutes. Zero disables the limit.
  uint32 window_minutes = 2;
  // Include author display names in history.
  bool include_names = 3;
  // History character limit. Drop oldest messages first. Zero defaults to eight thousand.
  uint32 max_chars = 4;
}

// Image and video settings.
message Media {
  // Video frames to sample for the language model. Zero disables sampling.
  uint32 video_frames = 1;
  // Upload limit in bytes. Zero defaults to ten million.
  uint64 max_upload_bytes = 2;
  // The default image size as WIDTHxHEIGHT
  string image_size = 3;
  uint32 image_steps = 4;
  // The default video size as WIDTHxHEIGHT
  string video_size = 5;
  double video_seconds = 6;
  uint32 video_fps = 7;
  // Images made per request
  uint32 image_count = 8;
}

// Automation trigger.
message Trigger {
  TriggerKind kind = 1;
  // Five field cron for a schedule, minute hour day month weekday
  string cron = 2;
  // Seconds between runs for a schedule without cron
  uint32 every_seconds = 3;
  // A regular expression for keywords, an emoji for reactions
  string pattern = 4;
  // The word after the prefix for a command
  string command = 5;
}

// Triggered automation action.
message Action {
  ActionKind kind = 1;
  // A Go template over the trigger: .Content .Author .Channel .Guild .Now .Persona .Bot
  string template = 2;
  string emoji = 3;
  // Post as a reply to the triggering message
  bool reply = 4;
  // Route override for the persona.
  string model = 5;
}

// Automation trigger, action, and persona.
message Automation {
  string id = 1;
  string name = 2;
  bool enabled = 3;
  Trigger trigger = 4;
  Action action = 5;
  // Persona ID. Empty selects the first persona.
  string persona_id = 6;
  // Channels for scheduled posts or message triggers. Empty uses all allowed channels.
  repeated string channel_ids = 7;
  repeated string guild_ids = 8;
  // Trigger probability from 0 to 1. Zero means always.
  double chance = 9;
  uint32 cooldown_ms = 10;
}

// Bot configuration.
message BotSpec {
  // Shard count. Zero uses Discord's recommendation.
  uint32 shard_count = 1;
  // Shard IDs assigned to this host. Empty selects all shards.
  repeated uint32 shard_ids = 2;
  Presence presence = 3;
  // The first persona is the default
  repeated Persona personas = 4;
  repeated Automation automations = 5;
  Engagement engagement = 6;
  Commands commands = 7;
  Memory memory = 8;
  Media media = 9;
}

// One shard's connection
message ShardStatus {
  uint32 id = 1;
  bool connected = 2;
  uint32 guilds = 3;
  uint32 latency_ms = 4;
  google.protobuf.Timestamp connected_at = 5;
  string error = 6;
}

// Connected bot metadata.
message BotStatus {
  string user_id = 1;
  string username = 2;
  string application_id = 3;
  string avatar_url = 4;
  repeated ShardStatus shards = 5;
  uint32 guilds = 6;
  google.protobuf.Timestamp started_at = 7;
  uint64 replies = 8;
  uint64 images = 9;
  uint64 videos = 10;
  uint64 errors = 11;
  // Bot invite URL.
  string invite_url = 12;
  // Shards Discord recommends for this bot
  uint32 recommended_shards = 13;
}

// Discord bot with connection state and configuration.
message Bot {
  string id = 1;
  string name = 2;
  // Whether the daemon keeps the bot connected
  bool enabled = 3;
  BotSpec spec = 4;
  BotState state = 5;
  string error = 6;
  BotStatus status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // Whether a token is stored. The token never leaves the daemon.
  bool token_set = 10;
}

// Bot activity or failure.
message BotActivity {
  string bot_id = 1;
  google.protobuf.Timestamp at = 2;
  // info, warn, or error
  string level = 3;
  // reply, image, video, command, automation, reaction, shard, or presence
  string kind = 4;
  string message = 5;
  string guild_id = 6;
  string channel_id = 7;
  string persona = 8;
  // Generation trace ID.
  string trace = 9;
}

// A channel a bot can see
message BotChannel {
  string id = 1;
  string name = 2;
  // text, news, thread, voice, or forum
  string kind = 3;
}

// A guild a bot is in, with its channels
message BotGuild {
  string id = 1;
  string name = 2;
  uint32 members = 3;
  repeated BotChannel channels = 4;
}

// Lists bots
message ListBotsRequest {}

// Returns every bot
message ListBotsResponse {
  repeated Bot bots = 1;
}

// Fetches one bot by id or name
message GetBotRequest {
  string id = 1;
}

// Returns one bot
message GetBotResponse {
  Bot bot = 1;
}

// Creates a bot
message CreateBotRequest {
  string name = 1;
  string token = 2;
  bool enabled = 3;
  BotSpec spec = 4;
}

// Returns the new bot
message CreateBotResponse {
  Bot bot = 1;
}

// Replace bot settings and restart it if running.
message UpdateBotRequest {
  string id = 1;
  // Name. Empty keeps the current name.
  string name = 2;
  // Token. Empty keeps the stored token.
  string token = 3;
  bool enabled = 4;
  BotSpec spec = 5;
}

// Returns the bot after the change
message UpdateBotResponse {
  Bot bot = 1;
}

// Deletes a bot, disconnecting it first
message DeleteBotRequest {
  string id = 1;
}

// Returns the deleted bot
message DeleteBotResponse {
  Bot bot = 1;
}

// Connects a bot and marks it enabled
message StartBotRequest {
  string id = 1;
}

// Returns the bot as it connects
message StartBotResponse {
  Bot bot = 1;
}

// Disconnects a bot and marks it disabled
message StopBotRequest {
  string id = 1;
}

// Returns the bot once disconnected
message StopBotResponse {
  Bot bot = 1;
}

// List recent activity, newest first.
message ListBotActivityRequest {
  string bot_id = 1;
  // Maximum results. Zero returns all retained activity.
  uint32 limit = 2;
}

// Returns activity newest first
message ListBotActivityResponse {
  repeated BotActivity activity = 1;
}

// Lists the guilds and channels a running bot can see
message ListBotGuildsRequest {
  string bot_id = 1;
}

// Returns guilds with their channels
message ListBotGuildsResponse {
  repeated BotGuild guilds = 1;
}

// Validate a token with Discord before saving.
message ProbeBotTokenRequest {
  string token = 1;
  // Use this bot's saved token when no token is supplied.
  string bot_id = 2;
}

// Token validation result from Discord.
message ProbeBotTokenResponse {
  string user_id = 1;
  string username = 2;
  string application_id = 3;
  string avatar_url = 4;
  uint32 recommended_shards = 5;
  string invite_url = 6;
}

// Post to a channel using a running bot persona.
message SendBotMessageRequest {
  string bot_id = 1;
  string channel_id = 2;
  // Persona ID. Empty selects the first persona.
  string persona_id = 3;
  // text, chat, image, or video
  ActionKind kind = 4;
  // Message text or generation prompt.
  string content = 5;
}

// Returns the id of the message posted
message SendBotMessageResponse {
  string message_id = 1;
  string trace = 2;
}

// Discord bots that route chat, images, and video through the gateway
service BotService {
  // Lists bots
  rpc ListBots(ListBotsRequest) returns (ListBotsResponse);
  // Fetches one bot
  rpc GetBot(GetBotRequest) returns (GetBotResponse);
  // Creates a bot, connecting it when enabled
  rpc CreateBot(CreateBotRequest) returns (CreateBotResponse);
  // Replaces a bot's settings
  rpc UpdateBot(UpdateBotRequest) returns (UpdateBotResponse);
  // Deletes a bot
  rpc DeleteBot(DeleteBotRequest) returns (DeleteBotResponse);
  // Connects a bot
  rpc StartBot(StartBotRequest) returns (StartBotResponse);
  // Disconnects a bot
  rpc StopBot(StopBotRequest) returns (StopBotResponse);
  // List recent bot activity.
  rpc ListBotActivity(ListBotActivityRequest) returns (ListBotActivityResponse);
  // Lists the guilds and channels a running bot sees
  rpc ListBotGuilds(ListBotGuildsRequest) returns (ListBotGuildsResponse);
  // Checks a token with Discord
  rpc ProbeBotToken(ProbeBotTokenRequest) returns (ProbeBotTokenResponse);
  // Posts to a channel through a running bot
  rpc SendBotMessage(SendBotMessageRequest) returns (SendBotMessageResponse);
}

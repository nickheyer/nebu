# Every key is also an environment variable, NEBU_ plus the key path in caps:
# NEBU_LISTEN, NEBU_LOGGING_LEVEL, NEBU_AUTH_OIDC_CLIENT_ID, NEBU_MESH_EXPOSURE.
listen: 127.0.0.1:8484

# data_dir: /path/to/nebu
# cache_dir: /path/to/cache/nebu
# store_dir: /path/to/nebu/store

logging:
  level: info
  format: text

# Mesh: nodes on one network pooling their devices. Everything about membership runs from the
# Mesh page; these settings only shape how this node is reached.
# mesh:
#   listen: 0.0.0.0:8485   # node traffic listener, bound when the API listener stays on loopback
#   advertise: 10.0.0.5    # the address other members reach this node at, on the fastest link
#   announce: true         # multicast beacons, so nodes and meshes on the network find each other
#   exposure: guard        # guard: seats other seats connect to sit behind a forwarder; direct: on the mesh address

# ffmpeg samples video attachments. Defaults to ffmpeg on PATH.
# discord:
#   ffmpeg: /usr/bin/ffmpeg
# auth:
#   disabled: false # if true, sso/accounts/token requirements all bypassed or disabled
#   session_ttl: 24h
#   token: change-me # or NEBU_AUTH_TOKEN
#   oidc:
#     issuer: https://accounts.google.com
#     client_id: 1234.apps.googleusercontent.com
#     client_secret: change-me # or NEBU_AUTH_OIDC_CLIENT_SECRET
#     allowed_domains: [example.com]
#     # allowed_emails: [ann@example.com]
#     # allowed_groups: [nebu-admins]
#     # public_url: https://nebu.example.com
#   Register https://<nebu host>/auth/oidc/callback with the provider

version: v2
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: pkg/proto
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go:v1.19.1
    out: pkg/proto
    opt:
      - paths=source_relative
  - remote: buf.build/bufbuild/es:v2.14.1
    out: web/nebu/src/lib/proto
    opt:
      - target=ts
  - remote: buf.build/community/sudorandom-connect-openapi:v0.27.2
    out: web/nebu/static
    opt:
      - format=yaml
      - path=openapi.yaml

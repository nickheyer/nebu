name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: ./scripts/check-gen.sh
      - run: make lint
      - run: make test
      - run: make build
